  },
  startHost() {
    this.mode = 'host'; this.err = null; Net.host(); this.qr = makeQR(Net.joinURL());
    Net.onMsg = m => this.onMsg(m); Net.onLost = () => { this.err = '상대와 연결이 끊겼습니다'; };
  },
  startJoin(code) {
    this.mode = 'guest'; this.err = null; Net.join(code);
    Net.onMsg = m => this.onMsg(m); Net.onLost = () => { this.err = '방장과 연결이 끊겼습니다'; };
  },
  onMsg(m) {
    if (m.t === 'hello' && Net.role === 'host') {
      if (m.v !== GAME_VER) { Net.send({ t: 'err', msg: '게임 버전이 다릅니다. 같은 파일로 접속하세요.' }); this.err = '상대의 게임 버전이 다릅니다'; return; }
      this.remoteChar = CHARS[m.char] ? m.char : 'RAZE';
      Net.send({ t: 'ping', a: performance.now() });
    } else if (m.t === 'ping') Net.send({ t: 'pong', a: m.a });
    else if (m.t === 'pong' && Net.role === 'host') {
      const rtt = performance.now() - m.a, delay = clamp(Math.ceil(rtt / 2 / STEP_MS) + 2, 2, 8);
      const cfg = { mode: 'online', p1: Game.p1Char, p2: this.remoteChar, mapIndex: Math.floor(Math.random() * MAPS.length), delay, side: 0 };
      Net.send({ t: 'start', cfg: Object.assign({}, cfg, { side: 1 }) });
      Net.onMsg = null; goto(new Battle(cfg));
    } else if (m.t === 'start' && Net.role === 'guest') { Net.onMsg = null; goto(new Battle(m.cfg)); }
    else if (m.t === 'err') this.err = m.msg;
    else Net.queue.push(m);
  },
  update() {
    this.t++;
    if (MI.back() || (this.mode !== 'menu' && this.backHit())) { SFX.play('back'); if (this.mode === 'menu') goto(TitleScene); else this.enter(); return; }
    if (this.mode === 'menu') this.menu.update();
  },
  backHit() {
    if (!Keys.pressed.has('Mouse0')) return false;
    const r = { x: VW / 2 - 30, y: VH - 24, w: 60, h: 14 };
    return inRect(Keys.mx, Keys.my, r);
  },
  render() {
    MenuBG.draw();
    kText('온라인 대전', VW / 2, 8, PAL.yellow, { align: 'center', size: 15 });
    kText('내 캐릭터: ' + Game.p1Char, VW / 2, 26, PAL.lgray, { align: 'center' });
    if (this.mode === 'menu') {
      panel(50, 46, 220, 3 * 18 + 12, 0.85);
      const hint = this.menu.draw(VW / 2, 52, 204, 18);
      if (hint) kText(hint, VW / 2, 112, PAL.cyan, { align: 'center' });
      kText('P2P 직접 연결 · 같은 게임 파일(같은 주소)로 접속해야 합니다', VW / 2, 128, PAL.gray, { align: 'center' });
      kText('W/S 선택   ENTER 결정   ESC 뒤로', VW / 2, VH - 15, PAL.gray, { align: 'center' });
      return;
    }
    if (this.mode === 'host') {
      panel(14, 40, 292, 118, 0.92, PAL.indigo);
      if (this.qr) drawQR(this.qr, 72, 98, 104);
      else kText('QR 생성 불가', 72, 94, PAL.red, { align: 'center' });
      kText('방 코드', 200, 46, PAL.lgray, { align: 'center' });
      drawText(Net.code || '-----', 200, 60, PAL.yellow, { align: 'center', scale: 3 });
      kText(Net.status, 200, 84, Net.connected ? PAL.green : PAL.white, { align: 'center', size: 10 });
      kText('폰 카메라로 QR을 찍거나', 200, 104, PAL.lgray, { align: 'center' });
      kText('[온라인 대전 → 코드로 참가]', 200, 117, PAL.lgray, { align: 'center' });
      if (location.protocol === 'file:') kText('QR은 웹 주소(https)로 열었을 때만 사용 가능', 200, 136, PAL.orange, { align: 'center', size: 10 });
    } else {
      panel(40, 50, 240, 80, 0.92, PAL.indigo);
      kText('방 코드: ' + (Net.code || ''), VW / 2, 62, PAL.yellow, { align: 'center' });
      kText(Net.status, VW / 2, 84, Net.connected ? PAL.green : PAL.white, { align: 'center' });
      kText('방장이 대전을 시작하면 바로 시작됩니다', VW / 2, 104, PAL.lgray, { align: 'center' });
    }
    if (this.err) kText(this.err, VW / 2, 144, PAL.red, { align: 'center' });
    panel(VW / 2 - 30, VH - 24, 60, 14, 0.9, PAL.peri);
    kText('취소', VW / 2, VH - 22, PAL.white, { align: 'center' });
  }
};

// =====================================================================
// 18. 모바일 터치 조작
//   · 왼쪽: 이동 스틱 (좌우 이동·방향 전환, 두 번 튕기면 달리기, 아래 = 숙이기·발판 내려가기)
//   · 오른쪽: 공격 / 가드 / 대시 / 점프 / Q·E·R  — 공격·가드·스킬은 이동 스틱을 민 방향(위·대각선 포함)으로, 스틱을 놓으면 바라보는 정면으로
// =====================================================================
const Touch = {
  enabled: false, list: new Map(), pressed: new Set(), released: new Set(), prev: {}, lastAim: null,
  buttons() {
    const b = [
      { id: 'atk', x: 290, y: 126, r: 14, label: 'ATK', col: PAL.red },
      { id: 'guard', x: 262, y: 142, r: 11, label: 'GRD', col: PAL.cyan },
      { id: 'jump', x: 307, y: 98, r: 10, label: 'JMP', col: PAL.green },
      { id: 'dash', x: 262, y: 115, r: 9, label: 'DSH', col: PAL.yellow },
      { id: 's1', x: 236, y: 100, r: 8, label: 'Q', col: PAL.peri },
      { id: 's2', x: 255, y: 89, r: 8, label: 'E', col: PAL.peri },
      { id: 's3', x: 279, y: 83, r: 8, label: 'R', col: PAL.peri },
      { id: 'pause', x: VW - 14, y: 38, r: 7, label: 'II', col: PAL.gray }
    ];
    const sc = Loop.scene;
    if (sc instanceof Battle && sc.mode === 'tutorial' && sc.tutDone) b.push({ id: 'next', x: VW / 2, y: 120, r: 12, label: 'NEXT', col: PAL.green });
    return b;
  },
  active() { const sc = Loop.scene; return sc instanceof Battle && !sc.pauseMenu && !sc.resultMenu; },
  toLogical(t) {
    return clientToLogical(t.clientX, t.clientY);
  },
  start(t) {
    const p = this.toLogical(t);
    if (!this.active()) {                 // 메뉴: 마우스 클릭처럼
      Keys.mx = p.x; Keys.my = p.y; Keys.mouseMoved = true; kDown('Mouse0');
      this.list.set(t.identifier, { kind: 'mouse' }); return;
    }
    for (const b of this.buttons()) if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 4) {
      if (b.id === 'pause') { Keys.pressed.add('Escape'); this.list.set(t.identifier, { kind: 'none' }); return; }
      if (b.id === 'next') { Keys.pressed.add('Enter'); this.list.set(t.identifier, { kind: 'none' }); return; }
      this.list.set(t.identifier, { kind: 'btn', id: b.id, bx: b.x, by: b.y, x: p.x, y: p.y, t: performance.now() });
      this.pressed.add(b.id); return;
    }
    if (p.x < VW * 0.5) this.list.set(t.identifier, { kind: 'stick', ox: p.x, oy: p.y, x: p.x, y: p.y });
    else this.list.set(t.identifier, { kind: 'none' });
  },
  move(t) { const s = this.list.get(t.identifier); if (!s) return; const p = this.toLogical(t); s.x = p.x; s.y = p.y; if (s.kind === 'mouse') { Keys.mx = p.x; Keys.my = p.y; Keys.mouseMoved = true; } },
  end(t) {
    const s = this.list.get(t.identifier); if (!s) return;
    if (s.kind === 'btn') this.released.add(s.id);
    if (s.kind === 'mouse') kUp('Mouse0');
    this.list.delete(t.identifier);
  },
  held(id) { for (const s of this.list.values()) if (s.kind === 'btn' && s.id === id) return true; return false; },
  // 한 틱의 터치 입력 → 공통 입력 구조
  read() {
    const o = {}, pv = this.prev;
    let stick = null;
    for (const s of this.list.values()) if (s.kind === 'stick') stick = s;
    const dx = stick ? clamp((stick.x - stick.ox) / 16, -1, 1) : 0, dy = stick ? clamp((stick.y - stick.oy) / 16, -1, 1) : 0;
    o.l = dx < -0.35; o.r = dx > 0.35;
    o.lP = o.l && !pv.l ? 1 : 0; o.rP = o.r && !pv.r ? 1 : 0;          // 스틱을 두 번 튕기면 더블탭 → 달리기
    // 스틱 위쪽은 조준 전용 (점프는 JMP 버튼) · 거의 똑바로 아래로 밀 때만 숙이기
    const stickUp = false, stickDown = dy > 0.75 && Math.abs(dx) < 0.45;
    o.jumpH = this.held('jump'); o.jumpP = this.pressed.has('jump');
    o.crouch = stickDown; o.downH = stickDown; o.downP = stickDown && !pv.stickDown;
    o.dashP = this.pressed.has('dash');
    o.atkP = this.pressed.has('atk');
    o.guardH = this.held('guard'); o.guardP = this.pressed.has('guard'); o.guardR = this.released.has('guard');
    o.s1 = this.pressed.has('s1'); o.s2 = this.pressed.has('s2'); o.s3 = this.pressed.has('s3');
    this.prev = { l: o.l, r: o.r, stickUp, stickDown };
    this.pressed.clear(); this.released.clear();
    // 조준: 이동 스틱을 민 방향 그대로 (위·대각선·아래 자유롭게) / 스틱을 놓으면 바라보는 정면
    const W = World, me = W && W.me;
    let aim = null;
    if (me) {
      const c = me.chest();
      if (stick && Math.hypot(dx, dy) > 0.3) {
        const L = Math.hypot(dx, dy), ax = Math.abs(dx) < 0.12 ? 0 : dx;   // 똑바로 위/아래면 바라보는 쪽 기준 수직
        aim = V(c.x + ax / L * 40, c.y + dy / L * 40);
      } else aim = V(c.x + me.facing * 40, c.y);
    }
    if (aim) { o.aimX = aim.x; o.aimY = aim.y; this.lastAim = aim; }
    return o;
  },
  draw() {
    if (!this.enabled || !this.active()) return;
    g.globalAlpha = 0.55;
    for (const s of this.list.values()) if (s.kind === 'stick') {
      for (let a = 0; a < 6.28; a += 0.2) R(s.ox + Math.cos(a) * 16, s.oy + Math.sin(a) * 16, 1, 1, PAL.white);
      const kx = s.ox + clamp(s.x - s.ox, -16, 16), ky = s.oy + clamp(s.y - s.oy, -16, 16);
      circleR(kx, ky, 6, PAL.lgray);
    }
    if (![...this.list.values()].some(s => s.kind === 'stick')) {     // 스틱 위치 안내
      for (let a = 0; a < 6.28; a += 0.3) R(46 + Math.cos(a) * 16, 136 + Math.sin(a) * 16, 0.5, 0.5, PAL.lgray);
      kText('이동', 46, 131, PAL.lgray, { align: 'center', size: 10 });
    }
    const me = World && World.me;
    for (const b of this.buttons()) {
      const h = this.held(b.id), skill = b.id[0] === 's' && me && me.cd[b.id] > 0;
      circleR(b.x, b.y, b.r, h ? PAL.white : skill ? PAL.dgray : b.col);
      circleR(b.x, b.y, b.r - 1.5, h ? b.col : PAL.ink);
      if (skill) { const m = me.def.moves[skillId(me, b.id)]; const f = me.cd[b.id] / m.cd; R(b.x - b.r + 2, b.y + b.r - 2 - (b.r * 2 - 4) * f, b.r * 2 - 4, (b.r * 2 - 4) * f, PAL.dgray); }
      drawText(b.label, b.x + 0.5, b.y - 2, h ? PAL.ink : PAL.white, { align: 'center', shadow: false });
    }
    g.globalAlpha = 1;
  }
};
function circleR(cx, cy, r, c) {
  for (let dy = -r; dy <= r; dy += 0.5) { const dx = Math.sqrt(Math.max(0, r * r - dy * dy)); R(cx - dx, cy + dy, dx * 2, 0.5, c); }
}
screen.addEventListener('touchstart', e => {
  e.preventDefault(); SFX.unlock();
  if (!Touch.enabled) { Touch.enabled = true; try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (er) { /* 무시 */ } }
  for (const t of e.changedTouches) Touch.start(t);
}, { passive: false });
screen.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) Touch.move(t); }, { passive: false });
screen.addEventListener('touchend', e => { e.preventDefault(); for (const t of e.changedTouches) Touch.end(t); }, { passive: false });
screen.addEventListener('touchcancel', e => { for (const t of e.changedTouches) Touch.end(t); });
window.addEventListener('pagehide', () => { if (Net.connected) Net.send({ t: 'leave' }); });   // 창을 닫으면 상대에게 알림

function snapProj(p) {
  const o = Object.assign({}, p); o.owner = p.owner.side;
  o.move = null; for (const k in p.owner.def.moves) if (p.owner.def.moves[k] === p.move) o.move = k;
  return JSON.parse(JSON.stringify(o));
}
function loadProj(o, b) {
  const p = Object.assign({}, o), f = o.owner ? b.p2 : b.p1;
  p.owner = f; p.move = o.move ? f.def.moves[o.move] : null; return p;
}
// 상대를 기다리는 동안 누른 키(눌림 순간)를 잃지 않도록 합치기
function mergeInput(a, b) {
  const o = Object.assign({}, b);
  for (const k of ['jumpP', 'downP', 'dashP', 'atkP', 'guardP', 'guardR', 's1', 's2', 's3']) o[k] = !!(a[k] || b[k]);
  o.lP = (a.lP || 0) + (b.lP || 0); o.rP = (a.rP || 0) + (b.rP || 0);
  return o;
}
// 최근 2초 안에 실제 마우스를 움직였는지 (터치 + 마우스 혼용 기기)
const mouseRecent = () => performance.now() - (Keys.realMouseT || -1e9) < 2000;

// =====================================================================
// 16. 메인 루프 — requestAnimationFrame + Delta Time 누산기
//     모니터 주사율(60/120/144/240Hz)과 무관하게 시뮬레이션은 정확히 60Hz
// =====================================================================
const Loop = {
  last: 0, acc: 0, tps: 60, tCount: 0, tTimer: 0, scene: null, next: null, wipe: 0, frameCount: 0,
  start() {
    this.scene = TitleScene; this.scene.enter();
    const jm = /[?&]join=([A-Za-z0-9]{4,8})/.exec(location.search);      // QR로 들어오면 바로 방 참가
    if (jm) { this.scene = OnlineScene; OnlineScene.enter(); OnlineScene.startJoin(jm[1]); }
    this.last = performance.now();
    requestAnimationFrame(t => this.frame(t));
  },
  frame(now) {
    let dt = now - this.last; this.last = now;
    if (dt > 250) dt = 250;
    this.acc += dt; this.tTimer += dt;
    let steps = 0;
    while (this.acc >= STEP_MS && steps < 8) {
      if (this.next) { this.scene = this.next; this.next = null; this.scene.enter(); this.wipe = 14; }
      if (Keys.pressed.has('KeyM')) {                     // 전역 음소거
        Settings.muted = !Settings.muted; saveSettings(); SFX.applyVolume();
        this.toast = { text: Settings.muted ? 'SOUND OFF' : 'SOUND ON', t: 70 };
      }
      if (this.toast && this.toast.t > 0) this.toast.t--;
      this.scene.update();
      endInputFrame();
      if (this.wipe > 0) this.wipe--;
      this.frameCount++;
      this.acc -= STEP_MS; steps++; this.tCount++;
    }
    if (steps >= 8) this.acc = 0;
    if (this.tTimer >= 1000) { this.tps = Math.round(this.tCount * 1000 / this.tTimer); this.tCount = 0; this.tTimer = 0; }

    const duck = this.scene.pauseMenu ? 0.3 : 1;      // 일시정지 중 배경음 낮춤
    if (duck !== Music.duck) { Music.duck = duck; SFX.applyVolume(); }
    Music.update();
    this.scene.render();
    if (this.toast && this.toast.t > 0) {
      const w = textWidth(this.toast.text) + 10;
      panel(VW - w - 4, VH - 40, w, 13, 0.9, Settings.muted ? PAL.red : PAL.green);
      drawText(this.toast.text, VW - 9, VH - 36, PAL.white, { align: 'right' });
    }
    if (this.wipe > 0) {                     // 픽셀 디졸브 화면 전환
      g.fillStyle = PAL.ink;
      for (let j = 0; j < VH / 10; j++) for (let i = 0; i < VW / 10; i++)
        if (((i * 7 + j * 13) % 14) < this.wipe) R(i * 10, j * 10, 10, 10, PAL.ink);
    }
    const sh = this.scene.shake;
    let sx = 0, sy = 0;
    if (sh && sh.t > 0 && !this.scene.pauseMenu) { sx = Math.round((Math.random() * 2 - 1) * sh.mag); sy = Math.round((Math.random() * 2 - 1) * sh.mag); }
    const cur = (this.scene instanceof Battle && !this.scene.pauseMenu && !this.scene.resultMenu) ? 'none' : 'crosshair';
    if (screen.style.cursor !== cur) screen.style.cursor = cur;
    if (Touch.enabled && innerHeight > innerWidth * 1.05) {        // 모바일 세로 화면 안내
      R(0, 0, VW, VH, PAL.ink);
      kText('화면을 가로로 돌려주세요', VW / 2, VH / 2 - 6, PAL.yellow, { align: 'center', size: 15 });
    }
    present(sx, sy);
    requestAnimationFrame(t => this.frame(t));
  }
};

// 화면 배율이 바뀌면 한글 캐시와 맵 배경을 새 해상도로 다시 그림
onResChange = () => { kCache.clear(); MAPS.forEach((m, i) => { if (m.bg) prepareMap(i); }); };
onResChange();

// 창이 포커스를 잃으면 대전 자동 일시정지
window.addEventListener('blur', () => {
  const sc = Loop.scene;
  if (sc instanceof Battle && !sc.pauseMenu && !sc.resultMenu) sc.openPause();
});

Loop.start();
screen.focus();
</script>
</body>
</html>
