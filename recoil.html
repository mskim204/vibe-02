const screen = document.getElementById('screen');

//  → 화면을 꽉 채우면서도 도트 하나가 작고 또렷함. 한글도 화면 해상도로 선명하게 렌더링

function resize() {

  screen.style.width = cw + 'px'; screen.style.height = ch + 'px';
  const W = Math.round(cw * dpr), H = Math.round(ch * dpr);
  screen.width = W; screen.height = H;
  const fit = Math.min(W / VW, H / VH);
  const s = Math.max(1, Math.floor(fit));                         // 내부 해상도: 게임 1픽셀 = s픽셀 (정수배)
  if (s !== RES) {
    RES = s; buf.width = VW * RES; buf.height = VH * RES; g.imageSmoothingEnabled = false;
    if (onResChange) onResChange();
  }
  // 고해상도 화면(배율 3 이상, 휴대폰 등)은 화면을 꽉 채우도록 비율 그대로 확대, 아니면 정수배로 또렷하게
  const d = s >= 3 ? fit : s;

// 화면 좌표(CSS 픽셀) → 게임 좌표: 캔버스의 실제 표시 크기 기준으로 계산 (보이는 위치 = 눌리는 위치)

  const kx = r.width ? screen.width / r.width : view.dpr, ky = r.height ? screen.height / r.height : view.dpr;
  return { x: ((cx - r.left) * kx - view.ox) / view.scale, y: ((cy - r.top) * ky - view.oy) / view.scale };

window.addEventListener('orientationchange', () => setTimeout(resize, 150));

if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function present(shakeX, shakeY) {
  sctx.imageSmoothingEnabled = false;

  sctx.fillRect(0, 0, screen.width, screen.height);
  const s = view.scale;
  sctx.drawImage(buf, 0, 0, buf.width, buf.height, view.ox + shakeX * s, view.oy + shakeY * s, VW * s, VH * s);
}

// =====================================================================

  const x0 = Math.round(snap(x) * k), y0 = Math.round(snap(y) * k);
  const x1 = Math.round(snap(x + w) * k), y1 = Math.round(snap(y + h) * k);

// EPX(Scale2x) 확대: 저해상도 도트 패턴을 2배 정밀도로 부드럽게 (글꼴/아이콘용)

const SFX = {
  ctx: null, master: null, music: null, voices: 0, noiseBuf: null,
  unlock() {

        const n = this.ctx.sampleRate;
        this.noiseBuf = this.ctx.createBuffer(1, n, n);
        const d = this.noiseBuf.getChannelData(0);

const Music = {
  name: null, track: null, step: 0, t: 0, duck: 1, waves: {},
  play(name) {
    if (this.name === name) return;
    this.name = name; this.track = name ? TRACKS[name] : null; this.step = 0; this.t = 0;
  },
  wave(duty) {   // 펄스파 (듀티비 12.5% / 25%) — 패미컴 풍 음색
    if (this.waves[duty]) return this.waves[duty];
    const N = 32, re = new Float32Array(N), im = new Float32Array(N);
    for (let n = 1; n < N; n++) re[n] = (4 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
    return (this.waves[duty] = SFX.ctx.createPeriodicWave(re, im));
  },
  update() {
    if (!SFX.ok() || !this.track) return;
    const ctx = SFX.ctx, tr = this.track, dur = 60 / tr.bpm / 4;
    if (this.t < ctx.currentTime) this.t = ctx.currentTime + 0.05;
    while (this.t < ctx.currentTime + 0.2) {
      for (const ch of tr.ch) {
        const ev = ch.ev[this.step % ch.ev.length];
        if (ev) ch.type === 'drum' ? this.drum(ev, this.t, ch.vol) : this.note(ch, ev, this.t, dur);
      }
      this.t += dur; this.step++;
    }
  },
  note(ch, ev, t, dur) {
    const ctx = SFX.ctx, o = ctx.createOscillator(), gn = ctx.createGain(), len = ev.len * dur;
    if (ch.wave) o.setPeriodicWave(this.wave(ch.wave)); else o.type = ch.type;
    o.frequency.value = 440 * Math.pow(2, (ev.m - 69) / 12);
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(ch.vol, t + 0.005);
    gn.gain.setTargetAtTime(ch.vol * 0.6, t + 0.02, 0.06);
    gn.gain.setTargetAtTime(0, t + len * 0.9, 0.015);
    o.connect(gn); gn.connect(SFX.music); o.start(t); o.stop(t + len + 0.1);
  },
  drum(c, t, vol) {
    const ctx = SFX.ctx, gn = ctx.createGain();
    gn.connect(SFX.music);
    if (c === 'k') {
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(gn); o.start(t); o.stop(t + 0.16);
    } else {
      const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), len = c === 's' ? 0.12 : 0.03;
      src.buffer = SFX.noiseBuf;
      flt.type = c === 's' ? 'bandpass' : 'highpass'; flt.frequency.value = c === 's' ? 1800 : 7000;
      gn.gain.setValueAtTime(vol * (c === 's' ? 0.7 : 0.3), t); gn.gain.exponentialRampToValueAtTime(0.001, t + len);
      src.connect(flt); flt.connect(gn); src.start(t, Math.random() * 0.5); src.stop(t + len + 0.02);
    }
  }
};

//    - pressed 플래그는 다음 시뮬레이션 틱이 소비할 때까지 유지 → 짧은 탭 유실 없음
// =====================================================================
const Keys = { down: new Set(), pressed: new Set(), released: new Set(), taps: new Map(), mx: 220, my: 130 };
const BLOCK_KEYS = new Set(['Space', 'Tab', 'KeyW', 'Enter', 'Backspace', 'ShiftLeft', 'ShiftRight', 'KeyA', 'KeyD', 'KeyS', 'KeyC',
  'KeyQ', 'KeyE', 'KeyR', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
function kDown(code) {
  if (!Keys.down.has(code)) { Keys.pressed.add(code); Keys.taps.set(code, (Keys.taps.get(code) || 0) + 1); }
  Keys.down.add(code);
}
function kUp(code) { if (Keys.down.has(code)) Keys.released.add(code); Keys.down.delete(code); }

window.addEventListener('keydown', e => {
  SFX.unlock();
  if (BLOCK_KEYS.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  kDown(e.code);
}, { passive: false });
window.addEventListener('keyup', e => { if (BLOCK_KEYS.has(e.code)) e.preventDefault(); kUp(e.code); });
screen.addEventListener('mousedown', e => { SFX.unlock(); screen.focus(); e.preventDefault(); kDown('Mouse' + e.button); });
window.addEventListener('mouseup', e => kUp('Mouse' + e.button));
// 우클릭 메뉴 완전 차단 (캔버스 + 문서 전체)
window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; }, { capture: true });
screen.addEventListener('contextmenu', e => e.preventDefault());
screen.addEventListener('mousemove', e => {
  const p = clientToLogical(e.clientX, e.clientY);
  Keys.mx = Math.floor(p.x); Keys.my = Math.floor(p.y);
  Keys.mouseMoved = true; Keys.realMouseT = performance.now();
});
window.addEventListener('blur', () => { for (const k of [...Keys.down]) kUp(k); });
screen.addEventListener('wheel', e => e.preventDefault(), { passive: false });

function endInputFrame() { Keys.pressed.clear(); Keys.released.clear(); Keys.taps.clear(); Keys.mouseMoved = false; }

// 사람(1P) 입력 → 공통 입력 프레임 구조
function readHuman() {
  const d = c => Keys.down.has(c), p = c => Keys.pressed.has(c), r = c => Keys.released.has(c);
  const o = {
    // lP/rP = 이번 틱 동안의 눌림 횟수 (한 틱 안의 초고속 더블탭도 유실 없음)
    l: d('KeyA'), r: d('KeyD'), lP: Keys.taps.get('KeyA') || 0, rP: Keys.taps.get('KeyD') || 0,
    jumpH: d('Space'), jumpP: p('Space'),
    downP: p('KeyS'), downH: d('KeyS'),
    crouch: d('KeyC'),
    dashP: p('ShiftLeft') || p('ShiftRight'),
    atkP: p('Mouse0'),
    guardH: d('Mouse2'), guardP: p('Mouse2'), guardR: r('Mouse2'),
    s1: p('KeyQ'), s2: p('KeyE'), s3: p('KeyR'),
    aimX: Keys.mx, aimY: Keys.my };
  if (typeof Touch !== 'undefined' && Touch.enabled) {        // 모바일 터치 입력 합치기
    const t = Touch.read();
    for (const k in t) if (k === 'aimX' || k === 'aimY') { if (t.aimX !== undefined && (Touch.list.size || !mouseRecent())) o[k] = t[k]; }
    else if (typeof t[k] === 'number') o[k] = (o[k] || 0) + t[k]; else o[k] = o[k] || t[k];
  }
  return o;
}
// AI/더미용: "누르고 있는 키" 상태만 주면 엣지(pressed)를 자동 계산
function makeVirtualPad() {
  let prev = {};
  return function (h) {
    const P = k => !!h[k] && !prev[k];
    const out = {
      l: !!h.l, r: !!h.r, lP: P('l') ? 1 : 0, rP: P('r') ? 1 : 0,
      jumpH: !!h.jump, jumpP: P('jump'), downP: P('down'), downH: !!h.down,
      crouch: !!h.crouch, dashP: P('dash'), atkP: P('atk'),
      guardH: !!h.guard, guardP: P('guard'), guardR: !h.guard && !!prev.guard,
      s1: P('s1'), s2: P('s2'), s3: P('s3'), aimX: h.aimX, aimY: h.aimY
    };
    prev = Object.assign({}, h);
    return out;
  };
}

function platWood(ctx, p) {
  fr(ctx, p.x - 0.5, p.y - 0.5, p.w + 1, 5.5, PAL.ink);
  fr(ctx, p.x, p.y, p.w, 4.5, PAL.brown);
  fr(ctx, p.x, p.y, p.w, 0.5, '#f0b080'); fr(ctx, p.x, p.y + 0.5, p.w, 0.5, '#c27a4a');
  fr(ctx, p.x, p.y + 3.5, p.w, 1, PAL.dbrown);
  for (let x = p.x + 8; x < p.x + p.w - 2; x += 12) fr(ctx, x, p.y + 1, 0.5, 2.5, PAL.dbrown);
  for (let x = p.x + 3; x < p.x + p.w - 6; x += 12) fr(ctx, x, p.y + 2, 4, 0.5, '#7a4026');
  // 매달린 등불
  const cx = Math.floor(p.x + p.w / 2);
  fr(ctx, cx, p.y + 5, 0.5, 2, PAL.ink);
  fr(ctx, cx - 1.5, p.y + 7, 3.5, 4, PAL.ink);
  fr(ctx, cx - 1, p.y + 7.5, 2.5, 3, PAL.red);
  fr(ctx, cx - 0.5, p.y + 8.5, 1, 1, PAL.yellow);
}
function platMetal(ctx, p) {
  fr(ctx, p.x - 0.5, p.y - 0.5, p.w + 1, 5, PAL.ink);
  fr(ctx, p.x, p.y, p.w, 2, PAL.gray);
  fr(ctx, p.x, p.y, p.w, 0.5, PAL.lgray);
  for (let x = p.x + 2; x < p.x + p.w; x += 6) fr(ctx, x, p.y + 1, 0.5, 0.5, PAL.lgray);
  for (let x = p.x; x < p.x + p.w; x += 3) { fr(ctx, x, p.y + 2.5, 1.5, 1.5, PAL.yellow); fr(ctx, x + 1.5, p.y + 2.5, 1.5, 1.5, PAL.ink); }
}
function platStone(ctx, p) {
  fr(ctx, p.x - 0.5, p.y - 0.5, p.w + 1, 6.5, PAL.ink);
  fr(ctx, p.x, p.y, p.w, 5.5, '#a89878');
  fr(ctx, p.x, p.y, p.w, 0.5, '#e8d8b0');
  fr(ctx, p.x, p.y + 5, p.w, 0.5, '#6a5a48');
  for (let x = p.x + 10; x < p.x + p.w - 4; x += 14) { fr(ctx, x, p.y + 1, 0.5, 2, '#6a5a48'); fr(ctx, x + 0.5, p.y + 3, 0.5, 2, '#6a5a48'); }
}

  const low = Math.max(0, a), high = Math.max(0, -a);
  if (f.moveCrouch && f.onGround) { P.hipY = -d.hipH * 0.5; P.lean = 0.6 + low * 0.2; P.tilt = -0.5; P.fF = V(4.2, 0); P.fB = V(-4.8, 0); }
  else if (ph === 's') { P.lean = -0.1 + low * 0.25; P.hipY += 0.8; P.fF = V(2.6, 0); P.fB = V(-4.2, 0); }
  else {
    const ext = ph === 'a' ? 1 : Math.max(0, 1 - (k - m.startup - m.active) / Math.max(1, m.recovery + f.recExtra));
    P.lean = 0.12 + (m.lean !== undefined ? m.lean : 0.32) * ext + low * 0.35 - high * 0.22;
    P.tilt = -low * 0.3;
    P.hipY += low * 2.2 * ext;
    P.fF = V(2.6 + 2.8 * ext, 0); P.fB = V(-4.2 - 1.8 * ext, 0);
  }
  if (m.body) m.body(f, P, k, ph, L);
  if (!f.onGround && !P.air) { P.air = true; P.fF = V(P.hipX + 2.6, P.hipY + L * 0.64); P.fB = V(P.hipX - 1.8, P.hipY + L * 0.8); }
}

function attackArms(f, J, idle, reach) {
  const m = f.move, k = f.moveK, ph = f.phaseOf(k), S = J.shF, a = f.moveAim, sh = m.shape || {};
  if (m.arms) return m.arms(f, J, idle, reach, k, ph);
  const at = (ang, r) => vadd(S, dirOf(ang), r);
  const recP = ph === 'r' ? Math.min(1, (k - m.startup - m.active) / Math.max(1, m.recovery + f.recExtra)) : 0;
  let hF, wAng, slide = 0, smear = null;
  if (sh.type === 'arc') {
    const A0 = a + sh.from, A1 = a + sh.to, sg = Math.sign(sh.to - sh.from);
    if (ph === 's') { const p = (k + 1) / m.startup; hF = at(A0 - 0.3 * sg * p, reach * 0.72); wAng = A0 - 0.5 * sg * p; }
    else if (ph === 'a') {
      const p = (k - m.startup + 1) / m.active, pp = (k - m.startup) / m.active;
      const cur = A0 + (A1 - A0) * p, prev = A0 + (A1 - A0) * pp;
      hF = at(cur, reach * 0.92); wAng = cur; smear = { type: 'arc', a0: prev, a1: cur, r0: sh.r0, r1: sh.r1 };
    } else { const e = ease(recP); hF = vlerp(at(A1, reach * 0.92), idle.hF, e); wAng = lerp(A1, idle.wAng, e); }
  } else if (sh.type === 'thrust') {
    if (ph === 's') { hF = vadd(at(a, 1.2), V(0, 1)); wAng = a; slide = -(m.slide || 0) * 0.4; }
    else if (ph === 'a') {
      const p = (k - m.startup + 1) / m.active;
      hF = at(a, reach * (0.82 + 0.18 * p)); wAng = a; slide = (m.slide || 0) * p;
      if (!sh.noHit) smear = { type: 'thrust', a, r0: sh.r0, r1: sh.r1, w: sh.size };
    } else { const e = ease(recP); hF = vlerp(at(a, reach), idle.hF, e); wAng = lerp(a, idle.wAng, e); slide = (m.slide || 0) * (1 - e); }
  } else { hF = idle.hF; wAng = idle.wAng; }
  return { hF, wAng, slide, smear, hB: idle.hB, wAngB: idle.wAngB, attacking: true };
}

function computeSkeleton(f) {
  const d = f.def.dim, P = poseBody(f), a = f.anim();
  const u = V(Math.sin(P.lean), -Math.cos(P.lean)), n = V(Math.cos(P.lean), Math.sin(P.lean));
  const hip = V(P.hipX, P.hipY), neck = vadd(hip, u, d.torso);
  const ht = P.lean + P.tilt, hu = V(Math.sin(ht), -Math.cos(ht)), hn = V(Math.cos(ht), Math.sin(ht));
  const head = vadd(neck, hu, d.headR + 0.5);
  const shF = vadd(vadd(neck, u, -1.6), n, 0.3), shB = vadd(vadd(neck, u, -1.6), n, -0.7);
  const J = { hip, neck, head, shF, shB, u, n, hu, hn, lean: P.lean, ht, air: P.air };
  // 팔 / 무기
  const reach = d.upper + d.fore - 0.4, idle = f.def.idleArms(f, J, a);
  let o;
  if (a === 'guard' || a === 'blockstun') o = f.def.guardArms(f, J, f.guardAng);
  else if (a === 'attack') o = attackArms(f, J, idle, reach);
  else if (a === 'hit' || a === 'airhit') o = { hF: vadd(shF, V(-2, 4.5)), wAng: 1.9, hB: vadd(shB, V(-2.5, 3)), wAngB: 2.2 };
  else if (a === 'gbreak') o = { hF: vadd(shF, V(1.5, reach * 0.9)), wAng: 1.35, hB: vadd(shB, V(0.5, reach * 0.85)), wAngB: 1.5 };
  else if (a === 'down') o = { hF: V(hip.x - 3, -1), wAng: PI, hB: V(hip.x - 5, -0.8), wAngB: PI };
  else o = idle;
  if (f.def.offhand) f.def.offhand(f, J, o);
  J.wAng = o.wAng; J.wAngB = o.wAngB; J.slide = o.slide || 0; J.smear = o.smear || null; J.spin = o.spin;
  const arm = (sh, target) => { const r = ik2(sh, target, d.upper, d.fore, 1); return { el: r.joint, hand: r.end }; };
  const aF = arm(shF, o.hF), aB = arm(shB, o.hB);
  J.elF = aF.el; J.hF = aF.hand; J.elB = aB.el; J.hB = aB.hand;
  // 다리
  const hipF = vadd(hip, n, 0.6), hipB = vadd(hip, n, -0.6);
  const ankle = p => (P.air ? p : V(p.x, p.y - 0.7));
  const lF = ik2(hipF, ankle(P.fF), d.thigh, d.shin, -1), lB = ik2(hipB, ankle(P.fB), d.thigh, d.shin, -1);
  J.hipF = hipF; J.hipB = hipB; J.knF = lF.joint; J.anF = lF.end; J.knB = lB.joint; J.anB = lB.end;
  return J;
}

// 공격 판정 사각형 생성 (조준각 기준, 로컬 좌표 — 정면 +x)
function genHitboxes(f, J) {
  const m = f.move, k = f.moveK;
  if (!m) return [];
  if (m.boxesAt) return m.boxesAt(f, J, k);
  if (f.phaseOf(k) !== 'a' || !m.shape || m.shape.noHit) return [];
  const sh = m.shape, S = J.shF, a = f.moveAim, out = [];
  const sq = (c, s) => ({ x: c.x - s / 2, y: c.y - s / 2, w: s, h: s });
  const ray = (ang, r0, r1, s) => {
    const dv = dirOf(ang), step = s * 0.8;
    for (let r = r0; r < r1; r += step) out.push(sq(vadd(S, dv, r), s));
    out.push(sq(vadd(S, dv, r1), s));
  };
  if (sh.type === 'thrust') ray(a, sh.r0, sh.r1, sh.size);
  else if (sh.type === 'arc' && J.smear) { const s = J.smear; [s.a0, (s.a0 + s.a1) / 2, s.a1].forEach(ang => ray(ang, sh.r0, sh.r1, sh.size)); }
  else if (sh.type === 'area') { const c = vadd(S, dirOf(a), sh.dist); out.push({ x: c.x - sh.w / 2, y: c.y - sh.h / 2, w: sh.w, h: sh.h }); }
  else if (sh.type === 'area0') out.push({ x: sh.x, y: sh.y, w: sh.w, h: sh.h });
  return out;
}

// 휘두르기 잔상 (공격 판정과 같은 영역에 그림 → 보이는 대로 맞음)
function drawSmear(R, J, gp) {
  const s = J.smear, S = J.shF;
  if (!s) return;
  if (s.type === 'arc') {
    const pts = [], n = 6;
    for (let i = 0; i <= n; i++) pts.push(vadd(S, dirOf(lerp(s.a0, s.a1, i / n)), s.r1));
    for (let i = n; i >= 0; i--) pts.push(vadd(S, dirOf(lerp(s.a0, s.a1, i / n)), s.r0 + 2));
    R.poly(pts, 'smear', gp, false);
  } else if (s.type === 'thrust') {
    const dv = dirOf(s.a);
    R.cap(vadd(S, dv, s.r0 + 2), vadd(S, dv, s.r1), s.w * 0.2, s.w * 0.42, 'smear', gp, false);
  } else if (s.type === 'ring') {
    for (let i = 0; i < 4; i++) {
      const a0 = s.a + i * PI / 2;
      R.poly([vadd(S, dirOf(a0), s.r1), vadd(S, dirOf(a0 + 0.6), s.r1), vadd(S, dirOf(a0 + 0.6), s.r0), vadd(S, dirOf(a0), s.r0)], 'smear', gp, false);
    }
  }
}

function drawKodachi(R, hand, ang, gp) {
  const dv = dirOf(ang), pv = V(-dv.y, dv.x);
  R.cap(vadd(hand, dv, -1.8), hand, 0.45, 0.45, 'hilt', gp, false);
  R.cap(vadd(hand, pv, 1.1), vadd(hand, pv, -1.1), 0.35, 0.35, 'steel', gp, false);
  R.cap(vadd(hand, dv, 0.6), vadd(hand, dv, 8.2), 0.6, 0.12, 'steel', gp, false);
}
function drawRaze(R, f, J) {
  const G = { sc: 1, aB: 2, lB: 3, body: 4, sash: 5, lF: 6, head: 7, mask: 8, smear: 9, aF: 10, wB: 11, wF: 12, band: 13 };
  const { u, n, hip, neck, head, hu, hn } = J;
  // 머플러 (머리 뒤 매듭에서 흩날림)
  if (f.scarf) {
    const bx = snap(f.x), by = snap(f.y), L = p => V((p.x - bx) * f.facing, p.y - by);
    for (let i = 1; i < f.scarf.length; i++) R.cap(L(f.scarf[i - 1]), L(f.scarf[i]), 0.85 - i * 0.07, 0.8 - i * 0.07, 'red', G.sc, false);
  }
  // 뒷팔 + 뒷단검
  R.back = 1;
  R.cap(J.shB, J.elB, 1.05, 0.85, 'gi', G.aB, true);
  R.cap(J.elB, J.hB, 0.85, 0.7, 'wrap', G.aB, true);
  R.ell(J.hB, 0.75, 0.75, 0, 'skin', G.aB, true);
  drawKodachi(R, J.hB, J.wAngB, G.wB);
  // 뒷다리
  R.cap(J.hipB, J.knB, 1.55, 1.15, 'pants', G.lB, true);
  R.cap(J.knB, J.anB, 1.1, 0.75, 'wrap', G.lB, true);
  R.cap(J.anB, vadd(J.anB, V(1.9, 0.25)), 0.75, 0.6, 'tabi', G.lB, true);
  R.back = 0;
  // 몸통 (도복)
  R.poly([vadd(hip, n, -2.1), vadd(vadd(hip, n, 2.0), u, 0.2), vadd(vadd(neck, n, 2.3), u, -1.6), vadd(vadd(neck, n, 1.2), u, 0.3),
          vadd(vadd(neck, n, -1.5), u, 0.2), vadd(vadd(neck, n, -2.3), u, -1.4)], 'gi', G.body, true);
  R.dline(vadd(vadd(neck, n, 1.1), u, 0.1), vadd(vadd(hip, n, 0.6), u, 3.5), '#7a6cc8');        // 도복 깃 선
  // 허리띠 + 띠 끝
  R.poly([vadd(vadd(hip, u, 0.2), n, -2.3), vadd(vadd(hip, u, 0.2), n, 2.2), vadd(vadd(hip, u, 1.8), n, 2.3), vadd(vadd(hip, u, 1.8), n, -2.4)], 'red', G.sash, false);
  const sw = clamp(-f.vx * 0.5, -1.5, 1.5);
  R.cap(vadd(vadd(hip, u, 1), n, -2.2), V(hip.x - 3.6 + sw, hip.y + 1.8), 0.55, 0.35, 'red', G.sash, false);
  // 앞다리
  R.cap(J.hipF, J.knF, 1.6, 1.2, 'pants', G.lF, true);
  R.cap(J.knF, J.anF, 1.15, 0.8, 'wrap', G.lF, true);
  R.cap(J.anF, vadd(J.anF, V(1.9, 0.25)), 0.8, 0.62, 'tabi', G.lF, true);
  // 머리: 얼굴 → 머리카락(뒤로 뻗친 삐침) → 복면 → 머리띠 → 눈
  R.ell(head, 2.9, 3.3, J.ht, 'skin', G.head, true);
  R.ell(vadd(vadd(head, hu, 1.0), hn, -0.5), 3.1, 2.5, J.ht, 'hair', G.head, false);
  R.cap(vadd(vadd(head, hu, 2.0), hn, -1.2), vadd(vadd(head, hu, 3.7), hn, -3.6), 1.0, 0.2, 'hair', G.head, false);
  R.cap(vadd(vadd(head, hu, 0.6), hn, -2.2), vadd(vadd(head, hu, 0.6), hn, -4.8), 0.9, 0.2, 'hair', G.head, false);
  R.cap(vadd(vadd(head, hu, 2.8), hn, 0.4), vadd(vadd(head, hu, 4.4), hn, -1.0), 0.8, 0.2, 'hair', G.head, false);
  R.ell(vadd(vadd(head, hu, -1.5), hn, 0.5), 2.75, 1.65, J.ht, 'gi', G.mask, false);
  R.cap(vadd(vadd(head, hu, 1.0), hn, -2.9), vadd(vadd(head, hu, 1.2), hn, 2.95), 0.55, 0.55, 'red', G.band, false);
  R.dot(vadd(vadd(head, hu, 0.1), hn, 1.7), '#ffffff'); R.dot(vadd(vadd(head, hu, 0.1), hn, 2.2), '#ffffff');
  R.dot(vadd(vadd(head, hu, 0.1), hn, 2.6), '#14141e');
  // 휘두르기 잔상

  R.cap(J.elF, J.hF, 0.9, 0.72, 'wrap', G.aF, true);
  R.ell(J.hF, 0.8, 0.8, 0, 'skin', G.aF, true);
  drawKodachi(R, J.hF, J.wAng, G.wF);
}
function razeIdleArms(f, J, a) {
  const S = J.shF, B = J.shB, br = Math.sin(f.animT * 0.08) * 0.3;
  if (a === 'run' || a === 'dash') return { hF: vadd(S, V(-3.8, 3.2)), wAng: PI - 0.35, hB: vadd(B, V(-4.2, 2.6)), wAngB: PI - 0.15 };
  if (a === 'jump' || a === 'fall') return { hF: vadd(S, V(3.2, -0.5)), wAng: -1.1, hB: vadd(B, V(-2.5, 3)), wAngB: 2.4 };
  if (a === 'crouch') return { hF: vadd(S, V(3.6, 3.2)), wAng: -0.35, hB: vadd(B, V(1.5, 4.2)), wAngB: 0.2 };
  return { hF: vadd(S, V(3.4, 4.0 + br)), wAng: -0.75, hB: vadd(B, V(1.3, 5.0 + br)), wAngB: 0.25 };
}
function razeGuardArms(f, J, ga) {
  const S = J.shF, gd = dirOf(ga), pv = V(-gd.y, gd.x);

}
function razeOffhand(f, J, o) {   // 공격 중 왼손 단검은 뒤로 당겨 균형
  if (o.attacking && !o.keepB) { o.hB = vadd(J.shB, V(-1.6, 4.4)); o.wAngB = 1.95; }
}

const BUFFER_FRAMES = 8;

    this.state = 'jump'; this.animT = 0;

    else { const f0 = this.facing; this.faceCursor(); if (f0 !== this.facing) this.guardAng = this.aim; }

  updateDash(inp, dir) {
    const k = DASH_LEN - this.dashT;

    this.dashT--;
    if (inp.guardH && k >= 2) { this.dashT = 0; this.enterGuard(); return; }

  startMove(id) {

    this.dashT = 0;

    this.moveHit = false; this.moveBlocked = false; this.moveWhiff = false; this.recExtra = 0; this.lastHitGroup = -1;

        if (this.onGround) { this.move = null; this.doJump(); this.jumpCut = true; emit('jumpCancel', { f: this }); return; }   // 점프 캔슬은 항상 최대 높이

  updateStun(inp, dir) {

  }
  updateAirHit() {

  }
  knockDown() {

  }
  onLand(hard) {

    switch (this.state) {
      case 'airhit':

          this.bounceArmed = false; this.bounced = true; this.onGround = false; this.ground = null;

          FX.dust(this.x, this.y, 10, 0, PAL.orange); FX.ring(this.x, this.y - 2, PAL.orange, 8); World.addShake(2, 8); SFX.play('land');

    if (this.x > maxX) { this.x = maxX; if (!this.onGround) this.vx = 0; }

  // ---------------------------------------------------------------
  // 리그: 뼈대 계산 → 스프라이트 래스터 → 부위별 피격 판정 / 조준 공격 판정 / 가드 영역
  //   피격 판정 = 각 신체 부위(머리·몸통·위팔·아래팔·손·허벅지·정강이·발)의 사각형 → 자세마다 달라짐

    if (sc) {
      const anc = this.def.id === 'ORIN'
        ? this.toWorld(vadd(vadd(J.head, J.hu, 3.4), J.hn, -0.6))
        : this.toWorld(vadd(vadd(J.head, J.hu, 1.1), J.hn, -3.0));
      if (!this.scarf) this.scarf = Array.from({ length: sc.n }, (_, i) => ({ x: anc.x - this.facing * i * sc.len, y: anc.y, px: anc.x - this.facing * i * sc.len, py: anc.y }));

    }

      this.guardZone = z;

  }

  draw() {
    drawSprite(this.spr.cv, this.x, this.y);
    const blink = (this.state === 'dash' || this.state === 'getup' || (this.state === 'attack' && this.invuln > 0)) && this.invuln > 0 && this.frame % 2 === 0;

  }

    if (!this.isGuarding()) return;

    const col = this.state === 'blockstun' ? PAL.white : this.justActive() ? PAL.cyan : SIDE_COL[this.side];   // 하늘색 = 지금 막히면 GUARD 이상
    for (let a = -arc; a <= arc + 0.001; a += 0.07) {
      for (const r of [12, 12.5]) R(c.x + Math.cos(ga + a) * r, c.y + Math.sin(ga + a) * r, 0.5, 0.5, Math.abs(a) > arc - 0.15 ? PAL.white : col);

}

function resolvePush(a, b) {
  if (a.state === 'down' || b.state === 'down') return;
  const ah = a.pushH(), bh = b.pushH();
  if (!(a.y - ah < b.y && b.y - bh < a.y)) return;
  const dx = b.x - a.x, ov = PB * 2 - Math.abs(dx);
  if (ov <= 0) return;
  const s = dx > 0 ? 1 : dx < 0 ? -1 : a.facing;
  const minX = WALL_L + PB, maxX = WALL_R - PB;
  a.x = clamp(a.x - s * ov / 2, minX, maxX);
  b.x = clamp(b.x + s * ov / 2, minX, maxX);
  const ov2 = PB * 2 - Math.abs(b.x - a.x);
  if (ov2 > 0) {
    const aWall = a.x <= minX || a.x >= maxX;
    if (aWall) b.x = clamp(b.x + s * ov2, minX, maxX); else a.x = clamp(a.x - s * ov2, minX, maxX);
  }
}

function surfaceBelow(map, x, y) {
  let best = FLOOR_Y;
  for (const p of map.plats) if (x + PB > p.x && x - PB < p.x + p.w && p.y >= y - 0.5 && p.y < best) best = p.y;
  return best;
}
function drawRing(f, half) {
  const x = snap(f.x), y = f.onGround ? snap(f.y) : surfaceBelow(f.map, f.x, f.y);
  const c = SIDE_COL[f.side], cd = SIDE_COLD[f.side];
  if (!f.onGround && f.frame % 4 < 2) return;
  if (half === 'back') {
    R(x - 4, y - 1, 8.5, 0.5, cd);
    R(x - 6, y - 0.5, 2, 0.5, cd); R(x + 4.5, y - 0.5, 2, 0.5, cd);
    R(x - 7, y, 1, 0.5, c); R(x + 6.5, y, 1, 0.5, c);
  } else {
    R(x - 6, y + 0.5, 2, 0.5, c); R(x + 4.5, y + 0.5, 2, 0.5, c);
    R(x - 4, y + 1, 8.5, 0.5, c);
  }
}
function drawMarker(f, label) {
  const x = snap(f.x), bob = Math.floor(f.frame / 20) % 2 * 0.5;
  const y = f.topY - 5 - bob, c = SIDE_COL[f.side];
  for (let i = 0; i < 5; i++) {
    R(x - 2.5 + i * 0.5, y + i * 0.5 - 0.5, 5.5 - i, 0.5, PAL.ink);
    R(x - 2 + i * 0.5, y + i * 0.5, 4.5 - i, 0.5, c);
  }
  drawText(label, x + 0.5, y - 7, c, { align: 'center' });
}

// =====================================================================
// 9. 전투 판정 (방향 가드 / 저스트 가드 / 가드 브레이크 / 카운터 / 조준 넉백 / 투사체)
// =====================================================================
const Combat = {
  hitParams(m, grp) {
    if (m.finisher && m.hitEvery && grp === Math.floor((m.active - 1) / m.hitEvery)) return Object.assign({}, m.hit, m.finisher);
    return m.hit;
  },
  // 방향 가드: 접촉 지점이 가드 방향 호 안에 있어야 막힘 (뒤나 다른 각도에서 오면 맞음)
  // 공격이 날아온 방향 (방향 가드 판정용)
  //  찌르기·투사체: 진행 방향의 반대쪽 / 베기: 칼날이 닿은 위치 (몸 중심에 너무 가깝거나 공격자 반대편이면 공격자 쪽)
  incomingAngle(def, pt, src, tdir) {
    if (tdir) return Math.atan2(-tdir.y, -tdir.x);
    const c = def.chest();
    let vx = pt.x - c.x, vy = pt.y - c.y;
    if (vx * vx + vy * vy < 36 || (Math.abs(src.x - c.x) > 3 && Math.sign(vx) !== Math.sign(src.x - c.x))) { vx = src.x - c.x; vy = src.y - c.y; }
    return Math.atan2(vy, vx);
  },
  guardCovers(def, pt, src, tdir) {
    if (!def.isGuarding()) return false;
    return Math.abs(wrapPI(this.incomingAngle(def, pt, src || pt, tdir) - def.guardWorldAng())) <= def.def.guard.arc;
  },
  overlapPt(a, b) {
    const x1 = Math.max(a.x, b.x), x2 = Math.min(a.x + a.w, b.x + b.w), y1 = Math.max(a.y, b.y), y2 = Math.min(a.y + a.h, b.y + b.h);
    return { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
  },
  // 접촉 지점 = 겹친 곳 중 공격이 날아온 쪽(src)에 가장 가까운 지점 → 방향 가드 판정에 사용
  touch(boxes, def, src) {
    if (def.guardZone && def.isGuarding())
      for (const z of def.guardZone) for (const b of boxes) if (rectHit(b, z)) return { pt: this.overlapPt(b, z), zone: true };
    let best = null, bd = 1e9;
    for (const b of boxes) for (const h of def.hurt) if (rectHit(b, h)) {
      const pt = this.overlapPt(b, h), d = (pt.x - src.x) ** 2 + (pt.y - src.y) ** 2;
      if (d < bd) { bd = d; best = pt; }
    }
    return best ? { pt: best, zone: false } : null;
  },
  scan(fs, projs) {

class Menu {
  // item: { label, value?: () => string, change?: dir => void, action?: () => void, hint?: string }
  constructor(items) { this.items = items; this.sel = 0; this.rects = []; }
  update() {
    const n = this.items.length;
    if (MI.up()) { this.sel = (this.sel + n - 1) % n; SFX.play('blip'); }
    if (MI.down()) { this.sel = (this.sel + 1) % n; SFX.play('blip'); }
    if (Keys.mouseMoved) this.rects.forEach((r, i) => { if (inRect(Keys.mx, Keys.my, r)) this.sel = i; });
    let clicked = false;
    if (Keys.pressed.has('Mouse0')) this.rects.forEach((r, i) => { if (inRect(Keys.mx, Keys.my, r)) { this.sel = i; clicked = true; } });
    const it = this.items[this.sel];
    if (it.change) {
      if (MI.left()) { it.change(-1); SFX.play('blip'); }
      if (MI.right()) { it.change(1); SFX.play('blip'); }
    }
    if (MI.ok() || clicked) {
      if (it.action) { SFX.play('select'); it.action(); }
      else if (it.change) { it.change(1); SFX.play('blip'); }
    }
  }
  draw(cx, y, w, lh = 16) {
    this.rects = [];
    this.items.forEach((it, i) => {
      const yy = y + i * lh, sel = i === this.sel, r = { x: cx - w / 2, y: yy, w, h: lh - 2 };
      this.rects.push(r);
      if (sel) { R(r.x, r.y, r.w, r.h, PAL.indigo); rectLine(r.x, r.y, r.w, r.h, PAL.yellow); }
      const col = sel ? PAL.white : PAL.lgray, ty = yy + Math.floor((lh - 2 - 12) / 2) + 1;
      if (it.value) {
        kText(it.label, r.x + 8, ty, col);
        const v = it.value();
        kText(sel ? '< ' + v + ' >' : v, r.x + r.w - 8, ty, sel ? PAL.yellow : PAL.cyan, { align: 'right' });
      } else {
        kText(it.label, cx, ty, col, { align: 'center' });
        if (sel && (Loop.frameCount >> 4) % 2) drawText('>', r.x + 6, yy + (lh - 2) / 2 - 2, PAL.yellow);
      }
    });
    const hint = this.items[this.sel].hint;
    return hint;
  }
}

function moveReach(m) {
  if (m.proj) return 400;
  const sh = m.shape;
  if (!sh) return 70;
  if (sh.type === 'thrust' || sh.type === 'arc') return sh.r1 + 3;
  if (sh.type === 'area') return sh.dist + sh.w / 2 + 3;
  if (sh.type === 'area0') return Math.max(Math.abs(sh.x), sh.x + sh.w);
  return 40;
}

// 상대 공격이 나에게 닿기까지 남은 프레임 (근접: 활성까지, 투사체: 거리/속도)
function threatTTC(o, me) {
  let best = null;
  if (o.state === 'attack' && o.move && o.phaseOf(o.moveK) !== 'r' && Math.hypot(o.x - me.x, o.y - me.y) <= moveReach(o.move) + 12)
    best = { key: o.moveId + ':' + (o.frame - o.moveK), ttc: Math.max(0, o.move.startup - o.moveK) };
  for (const p of World.projs) if (p.owner === o && p.alive && (p.vx || p.vy)) {
    const sp = Math.hypot(p.vx, p.vy), d = Math.hypot(me.x - (p.x + p.w / 2), me.y - 14 - (p.y + p.h / 2));
    const toward = (me.x - (p.x + p.w / 2)) * p.vx + (me.y - 14 - (p.y + p.h / 2)) * p.vy > 0;
    if (toward && d < 70) { const t = Math.max(0, Math.floor((d - 7) / sp)); if (!best || t < best.ttc) best = { key: 'p' + p.tick, ttc: t }; }
  }
  return best;
}
// 진짜 빈틈인가: 헛친 후딜 / 경직 / 가드 브레이크 / 착지 빈틈, 또는 캔슬 불가 후딜이 내 발동보다 길 때
// (맞히거나 막힌 공격의 후딜은 다음 타로 캔슬되므로 빈틈이 아님 → 거기에 반격하면 카운터를 맞음)
function punishable(o, me) {
  if (o.state === 'stagger' || o.state === 'gbreak' || o.state === 'lag') return true;
  if (o.state !== 'attack' || !o.move) return false;
  if (o.moveWhiff) return true;
  if (o.phaseOf(o.moveK) !== 'r' || o.moveHit) return false;
  if (o.moveBlocked && o.move.chain) return false;                 // 막혔어도 다음 평타로 이을 수 있음
  const left = o.move.startup + o.move.active + o.move.recovery + o.recExtra - o.moveT;
  return left > me.def.moves.N1.startup + (o.moveBlocked ? 4 : 2);   // 체인 끝 기술이 막힌 후딜 = 반격 기회
}
// 숙이면 실제로 피할 수 있는가: 상대 찌르기선/투사체가 내 숙인 머리보다 위로 지나가는지 계산
function duckDodges(o, me) {
  const top = me.y - me.def.dim.crouchTop - 0.8;
  for (const p of World.projs) if (p.owner === o && p.alive && Math.abs(p.x + p.w / 2 - me.x) < 60) return p.y + p.h < top && Math.abs(p.vy) < 1.2;
  if (o.state !== 'attack' || !o.move || !o.move.shape || o.move.shape.type !== 'thrust' || o.move.shape.noHit) return false;
  const S = o.chest(), dx = Math.abs(me.x - S.x), yAt = S.y + Math.tan(clamp(o.moveAim, -1.3, 1.3)) * dx;
  return yAt + o.move.shape.size / 2 < top;
}
// 상대 공격이 실제로 닿을 지점 예측 → 그 방향으로 가드 (찌르기는 조준선, 베기는 호의 가운데, 낙하는 위)
function predictThreat(o, me) {
  const c0 = me.chest();
  for (const p of World.projs) if (p.owner === o && p.alive && Math.abs(p.x - me.x) < 70) {
    const sp = Math.hypot(p.vx, p.vy) || 1;
    return (p.vx || p.vy) ? V(c0.x - p.vx / sp * 10, c0.y - p.vy / sp * 10) : V(p.x + p.w / 2, p.y + p.h / 2);   // 투사체가 날아오는 쪽
  }
  let tp = o.chest();
  if (o.state === 'attack' && o.move) {
    const sh = o.move.shape, dist = Math.hypot(o.x - me.x, o.y - me.y);
    if (sh && sh.type === 'thrust' && !sh.noHit) return vadd(c0, o.aimWorldDir(o.moveAim), -10);            // 찌르기가 들어오는 쪽
    if (o.hitboxes.length) { let x = 0, y = 0; for (const b of o.hitboxes) { x += b.x + b.w / 2; y += b.y + b.h / 2; } tp = V(x / o.hitboxes.length, y / o.hitboxes.length); }
    else if (sh && sh.type === 'arc') tp = vadd(o.chest(), o.aimWorldDir(o.moveAim + (sh.from + sh.to) / 2), Math.min((sh.r0 + sh.r1) / 2, Math.max(0, dist - 8)));
    else if (sh && sh.type === 'thrust' && !sh.noHit) tp = vadd(o.chest(), o.aimWorldDir(o.moveAim), Math.max(0, Math.min(sh.r1, dist - 8)));
    else if (o.move.boxesAt) tp = V(o.x, o.y - 30);
  }
  // 예측 지점이 내 몸 중심과 너무 가까우면 방향이 흔들리므로 상대 쪽 방향으로 보정
  const c = me.chest();
  if (Math.hypot(tp.x - c.x, tp.y - c.y) < 7) tp = o.chest();
  return tp;
}

class AI {
  constructor(me, level) {
    this.me = me; this.L = AI_LEVELS[level] || AI_LEVELS.NORMAL;
    this.hist = []; this.t = 0; this.taps = [];
    this.guardHeld = false; this.lastRel = -99; this.decided = new Set();
    this.thinkT = 20; this.moveDir = 0; this.run = false; this.runSeq = 0;
    this.jumpT = 0; this.crouchT = 0; this.aaCD = 0; this.defense = null; this.dashDir = null;
  }
  press(key, delay = 0) { this.taps.push({ key, at: this.t + delay }); }
  roll(p) { return Math.random() < p; }
  mark(k) { if (this.decided.has(k)) return false; this.decided.add(k); if (this.decided.size > 80) this.decided.clear(); return true; }
  snap(o) {
    const atk = o.state === 'attack' && o.move;
    return {
      x: o.x, y: o.y, state: o.state, move: atk ? o.move : null, phase: atk ? o.phaseOf(o.moveK) : null, aim: atk ? o.moveAim : 0,
      key: atk ? o.moveId + ':' + (o.frame - o.moveK) : null,
      vul: punishable(o, this.me), vkey: o.state + ':' + (o.frame - o.animT)
    };
  }
  held() {
    const me = this.me, o = me.opp, L = this.L, h = {};
    this.t++;
    this.hist.push(this.snap(o)); if (this.hist.length > 40) this.hist.shift();
    const S = this.hist[Math.max(0, this.hist.length - 1 - L.react)];      // 지연된 인지
    const dx = o.x - me.x, dist = Math.abs(dx), fwd = dx > 0 ? 'r' : 'l', back = dx > 0 ? 'l' : 'r';
    if (this.aaCD > 0) this.aaCD--;
    // 상대가 마지막으로 공격을 시작한 지 몇 프레임인지 (몰아치기 감지)
    const oInst = o.state === 'attack' ? o.moveId + ':' + (o.frame - o.moveK) : null;
    if (oInst && oInst !== this.oppInst) { this.oppInst = oInst; this.oppAtkAgo = 0; } else this.oppAtkAgo = (this.oppAtkAgo || 0) + 1;
    const inStun = (me.state === 'hitstun' || me.state === 'airhit') && me.combo >= 1;
    if (!inStun && me.state === 'attack' && me.move) this.comboThink();

    // ---- 타이밍 가드: 공격을 보고(인지 지연) 막을지 정한 뒤, 닿기 몇 프레임 전에 누를지 난이도별로 결정 ----
    const T = threatTTC(o, me);
    const seen = T && (T.key[0] === 'p' || !!(S.key && T.key === S.key));
    const canDef = inStun || me.isFree() || me.isGuarding() || me.state === 'dash';
    if (T && seen && canDef && T.key !== this.gKey) {
      this.gKey = T.key; this.gPlan = null;
      if (!inStun && me.onGround && T.key[0] === 'p' && duckDodges(o, me) && this.roll(L.duck)) this.defense = { type: 'duck', until: this.t + 24 };
      else if (this.roll(inStun ? L.just : L.guard)) {
        const arr = inStun ? L.gTimeC : L.gTime;
        this.gPlan = { key: T.key, off: arr[Math.floor(Math.random() * arr.length)], pressed: false, hold: 0 };
      } else if (!inStun && me.canDash() && this.roll(0.12)) { this.dashDir = back; this.press('dash'); }
    }
    if (this.defense && this.t > this.defense.until) this.defense = null;
    if (this.defense && this.defense.type === 'duck') h.crouch = true;
    const GP = this.gPlan;
    if (GP) {
      const live = T && T.key === GP.key;
      if (!GP.pressed && live && T.ttc <= GP.off && this.t - this.lastRel > SPAM_WINDOW) { GP.pressed = true; GP.hold = 3; }
      if (GP.pressed) { if (live) GP.hold = Math.max(GP.hold, 3); if (GP.hold-- > 0) h.guard = true; else this.gPlan = null; }
      else if (!live) this.gPlan = null;
    }
    if (h.guard) this.guardHeld = true; else if (this.guardHeld) { this.guardHeld = false; this.lastRel = this.t; }
    if (inStun) return this.finish(h);
    if (h.guard || h.crouch) { this.moveDir = 0; return this.finish(h); }

    // ---- 공격 판단 ----
    if (me.isFree()) {
      const reach = moveReach(me.def.moves.N1);
      if (S.vul && dist <= reach + 8 && this.mark('v' + S.vkey) && this.roll(L.punish)) this.attackChoice(dist, true, fwd);
      else if (S.vul && dist > reach + 8 && dist < reach + 42 && me.canDash() && this.mark('d' + S.vkey) && this.roll(L.dashPunish)) {
        this.dashDir = fwd; this.press('dash'); this.press('atk', 6);                 // 헛친 상대에게 대시로 파고들어 반격
      } else if (o.state === 'getup' && o.stun <= 3 && dist <= reach + 4 && this.mark('o' + o.frame) && this.roll(L.oki)) {
        this.attackChoice(dist, true, fwd);                                            // 일어나는 순간을 노린 공격
      } else if (!me.onGround && !o.onGround && dist < 22 && Math.abs(o.y - me.y) < 20 && me.airAtk < 2 && this.mark('a' + Math.floor(this.t / 10)) && this.roll(L.antiAir * 0.6)) {
        this.press('atk');                                                             // 공대공
      } else if (!o.onGround && o.y < me.y - 10 && dist < 32 && me.onGround && this.aaCD <= 0) {
        this.aaCD = 45;
        if (this.roll(L.antiAir)) {
          if (me.cd.s2 === 0 && (me.def.id === 'RAZE' || dist > 12)) this.press('s2');       // RAZE E는 대공 무적
          else if (this.roll(L.discipline)) this.defense = { type: 'guard', just: this.roll(L.just), until: this.t + 18 };   // 무적 대공기가 없으면 막기
          else this.press('atk');
        }
      } else if (--this.thinkT <= 0) {
        this.thinkT = L.think + Math.floor(Math.random() * 8);
        this.neutral(dist, fwd, back);
      }
    }

// 연습용 더미 (훈련 설정 / 튜토리얼 단계별 행동)
const DUMMY_KO = { STAND: '서 있기', JUMP: '점프', CROUCH: '숙이기', GUARD: '자동 막기', JUST: '저스트 가드', ATTACK: '반격 (공격)', CPU: 'CPU (보통)' };
const DUMMY_LIST = Object.keys(DUMMY_KO);
class Dummy {
  constructor(me, world) { this.me = me; this.w = world; this.t = 0; this.hold = 0; this.cpu = null; }
  held() {
    const f = this.me, o = f.opp, t = this.t++, h = {}, mode = this.w.dummyMode();
    const dist = Math.abs(o.x - f.x), fwd = o.x < f.x ? 'l' : 'r', back = fwd === 'l' ? 'r' : 'l';
    if (mode !== 'CPU' && (f.isFree() || f.isGuarding()) && Math.abs(o.x - f.x) > 2) f.facing = o.x > f.x ? 1 : -1;
    switch (mode) {
      case 'JUMP': if (t % 50 < 12) h.jump = true; break;
      case 'CROUCH': h.crouch = true; break;
      case 'GUARD': case 'JUST': {     // 자동 막기 = GUARD 타이밍(2프레임 전), 저스트 = PERFECT 타이밍
        const T = threatTTC(o, f), off = mode === 'JUST' ? 0 : 3;
        if (T && T.key !== this.gk && T.ttc <= off) { this.gk = T.key; this.hold = 4; }
        if (T && T.key === this.gk) this.hold = Math.max(this.hold, 2);
        if (this.hold > 0) { this.hold--; h.guard = true; }
        break;
      }
      case 'JUST_OLD': {
        let threat = o.state === 'attack' && o.move && o.moveK >= o.move.startup - 2 && dist < moveReach(o.move) + 10;
        for (const p of this.w.projs) if (p.owner === o && Math.abs(p.x + p.w / 2 - f.x) < 18 + Math.abs(p.vx) * 2) threat = true;
        if (threat) this.hold = 10; else if (this.hold > 0) this.hold--;
        h.guard = this.hold > 0; break;
      }
      case 'ATTACK': {
        const ph = t % 80;
        // 체인은 역경직이 풀리는 순간에 맞춰 입력 (타이밍 링크)
        if (f.state === 'attack' && f.move && f.move.chain && (f.moveHit || f.moveBlocked) && World.hitstopT === 1) { h.atk = true; break; }
        if (dist < 44) { if (ph === 0) h.atk = true; }
        else if (ph === 0 && f.cd.s1 === 0) h.s1 = true;
        else if (ph > 20 && ph < 50) h[fwd] = true;
        break;
      }
      case 'POKE': {   // 튜토리얼: 거리를 유지하며 상단 찌르기 반복
        if (dist > 40) h[fwd] = true; else if (dist < 26) h[back] = true;
        else if (t % 45 === 0) h.atk = true;
        break;
      }
      case 'CPU': return (this.cpu || (this.cpu = new AI(f, 'NORMAL'))).held();
    }
    // 조준: 막는 더미는 공격이 오는 쪽, 찌르기 더미는 수평(머리 높이), 나머지는 상대 몸
    let tp;
    if (mode === 'GUARD' || mode === 'JUST') {
      tp = predictThreat(o, f);
    } else if (mode === 'POKE') tp = V(o.x, f.chest().y);
    else tp = V(o.x, o.y - o.def.dim.hipH - o.def.dim.torso * 0.5);
    h.aimX = tp.x; h.aimY = tp.y;
    return h;
  }
}

  { title: '타이밍 가드', lines: ['우클릭은 누르고만 있어서는 막히지 않습니다. 공격이 닿는 순간에 맞춰 누르세요!', '닿기 직전일수록 좋음: PERFECT(무효+반격) > GUARD(무효) > BLOCK(60% 감소+틈) > GRAZE(20% 감소)', '커서도 공격이 오는 쪽을 향해야 합니다. 판정이 매우 좁습니다!'],

// =====================================================================
// 14. 대전 씬 (AI 대전 / 콤보 연구 / 튜토리얼 공용)
// =====================================================================
const NEUTRAL = { l: false, r: false, lP: 0, rP: 0, jumpH: false, jumpP: false, downP: false, downH: false, crouch: false,
  dashP: false, atkP: false, guardH: false, guardP: false, guardR: false, s1: false, s2: false, s3: false };

class Battle {
  constructor(cfg) { this.cfg = cfg; this.mode = cfg.mode; }
  enter() {
    World = this;
    const c = this.cfg;
    this.online = this.mode === 'online'; this.local = this.online ? c.side : 0;
    this.map = this.online ? prepareMap(c.mapIndex) : pickRandomMap();   // 매치 시작 시 1회 랜덤 → 모든 라운드 동일
    this.c1 = c.p1;
    this.c2 = c.p2 === 'RANDOM' ? CHAR_LIST[Math.floor(Math.random() * CHAR_LIST.length)] : c.p2;
    this.wins = [0, 0]; this.round = 1;
    this.debug = false; this.pauseMenu = null; this.resultMenu = null;
    this.opt = { regen: true, noCD: this.mode === 'tutorial', dummy: c.dummy || 'STAND' };
    this.lesson = 0; this.hudT = 0; this.t = 0;
    this.startRound();
    if (this.online) this.netInit();
  }
  get isMatch() { return this.mode === 'ai' || this.mode === 'online'; }
  get me() { return this.local ? this.p2 : this.p1; }
  dummyMode() { return this.mode === 'tutorial' ? LESSONS[this.lesson].dummy : this.opt.dummy; }

  startRound() {
    FX.clear(); Popups.list.length = 0; this.projs = [];
    this.p1 = new Fighter(this.c1, 0, 110, this.map);
    this.p2 = new Fighter(this.c2, 1, 210, this.map);
    this.p1.opp = this.p2; this.p2.opp = this.p1;
    this.pad2 = makeVirtualPad();
    this.ctrl = this.online ? null : this.mode === 'ai' ? new AI(this.p2, this.cfg.level) : new Dummy(this.p2, this);
    this.tick = 0; this.hitstopT = 0; this.shake = { t: 0, mag: 0 };
    this.comboView = [{ hits: 0, dmg: 0, t: 0 }, { hits: 0, dmg: 0, t: 0 }];
    this.idleT = [0, 0]; this.adv = null; this.advShow = null;
    this.hpLag = [this.p1.maxHp, this.p2.maxHp]; this.lagDelay = [0, 0]; this.prevHp = [this.p1.hp, this.p2.hp];
    this.cdPrev = [{}, {}]; this.cdFlash = [{}, {}];
    this.timer = this.isMatch ? 60 * 60 : -1;
    this.phase = this.isMatch ? 'intro' : 'fight'; this.phaseT = 0;
    this.koInfo = null;
    if (this.mode === 'tutorial') this.startLesson();
  }
  startLesson() {
    const L = LESSONS[this.lesson];
    this.tutProg = 0; this.tutDone = L.need === 0; this.tutNeed = L.need;
    if (L.init) { L.init(this); this.tutNeed = L.need; }
  }
  gotoLesson(i) {
    if (i >= LESSONS.length) { goto(TitleScene); return; }
    this.lesson = clamp(i, 0, LESSONS.length - 1);
    this.startRound();
  }

  // ---- World 인터페이스 ----
  hitstop(n) { this.hitstopT = Math.max(this.hitstopT, n); }
  addShake(mag, frames) { this.shake.mag = Math.max(this.shake.mag, mag); this.shake.t = Math.max(this.shake.t, frames); }
  popup(text, f, col) { Popups.add(text, f.x, f.topY - 20, col); }
  onEvent(type, d) {
    if (type === 'hit' || type === 'block' || type === 'just') this.adv = { atk: d.atk, def: d.def, a: null, b: null };
    if (this.mode === 'tutorial' && !this.tutDone) {
      const L = LESSONS[this.lesson];
      if (L.event) { const v = L.event(this, type, d); if (v) this.addProg(v); }
    }
  }
  addProg(v) {
    this.tutProg = Math.min(this.tutNeed, this.tutProg + v);
    if (this.tutProg >= this.tutNeed && !this.tutDone) {
      this.tutDone = true; SFX.play('clear');
      Popups.add('CLEAR!', this.p1.x, this.p1.topY - 20, PAL.green);
    }
  }

  // ---- 일시정지 메뉴 (모든 물리/타이머/AI 완전 정지) ----
  openPause() {
    SFX.play('blip');
    const items = [{ label: '계속하기', action: () => this.closePause() }, { label: '조작키 보기', action: () => { this.showControls = true; } }];
    const onoff = v => (v ? 'ON' : 'OFF');
    if (this.mode === 'training') {
      items.push(
        { label: '더미 행동', value: () => DUMMY_KO[this.opt.dummy], change: d => { this.opt.dummy = cycle(DUMMY_LIST, this.opt.dummy, d); this.ctrl = new Dummy(this.p2, this); } },
        { label: '체력 자동 회복', value: () => onoff(this.opt.regen), change: () => { this.opt.regen = !this.opt.regen; } },
        { label: '쿨타임 초기화', value: () => onoff(this.opt.noCD), change: () => { this.opt.noCD = !this.opt.noCD; } },
        { label: '판정 박스 표시', value: () => onoff(this.debug), change: () => { this.debug = !this.debug; } },
        { label: '위치 초기화', action: () => { this.startRound(); this.closePause(); } });
    } else if (this.mode === 'tutorial') {
      items.push(
        { label: '다음 단계', action: () => { this.gotoLesson(this.lesson + 1); this.closePause(); } },
        { label: '이전 단계', action: () => { this.gotoLesson(this.lesson - 1); this.closePause(); } },
        { label: '이 단계 다시 하기', action: () => { this.startRound(); this.closePause(); } },
        { label: '판정 박스 표시', value: () => onoff(this.debug), change: () => { this.debug = !this.debug; } });
    } else if (this.online) {
      items.push({ label: '기권하고 나가기', action: () => this.leaveOnline() });
    } else {
      items.push(
        { label: '라운드 다시 시작', action: () => { this.startRound(); this.closePause(); } },
        { label: '판정 박스 표시', value: () => onoff(this.debug), change: () => { this.debug = !this.debug; } });
    }
    items.push(
      { label: '배경음 볼륨', value: () => Settings.bgm + '/10', change: d => { Settings.bgm = clamp(Settings.bgm + d, 0, 10); SFX.applyVolume(); saveSettings(); } },
      { label: '효과음 볼륨', value: () => Settings.sfx + '/10', change: d => { Settings.sfx = clamp(Settings.sfx + d, 0, 10); SFX.applyVolume(); saveSettings(); SFX.play('blip'); } },
      { label: '메인 메뉴로', action: () => this.online ? this.leaveOnline() : goto(TitleScene) });
    this.pauseMenu = new Menu(items);
  }
  closePause() { this.pauseMenu = null; SFX.play('back'); }

  // ---- 메인 업데이트 ----
  update() {
    if (this.online) { this.updateOnline(); return; }
    if (this.pauseMenu) {
      if (this.showControls) { if (MI.back() || MI.ok() || Keys.pressed.has('Mouse0')) { this.showControls = false; SFX.play('back'); } return; }
      if (MI.back()) { this.closePause(); return; }
      this.pauseMenu.update(); return;
    }
    if (this.resultMenu) { this.resultMenu.update(); this.phaseT++; FX.update(); return; }
    if (Keys.pressed.has('Escape')) { this.openPause(); return; }
    if (!this.isMatch) {
      if (Keys.pressed.has('KeyH')) this.debug = !this.debug;
      if (Keys.pressed.has('Tab')) this.startRound();
    }
    if (this.mode === 'tutorial' && this.tutDone && Keys.pressed.has('Enter')) {
      SFX.play('select');
      if (this.lesson === LESSONS.length - 1) { goto(TitleScene); return; }
      this.gotoLesson(this.lesson + 1); return;
    }
    this.simStep(fight => {
      const i1 = fight ? readHuman() : NEUTRAL;
      const h2 = this.ctrl.held();
      return [i1, this.pad2(fight ? h2 : {})];
    });
  }

  // 시뮬레이션 1프레임 (온라인에서는 양쪽 입력이 모두 도착한 프레임만 실행 → 두 화면이 똑같이 진행)
  simStep(getInputs) {
    this.hudT++;
    const me = this.me, low = me.hp > 0 && me.hp / me.maxHp <= 0.25;
    const finalRound = this.isMatch && this.wins[0] === 1 && this.wins[1] === 1;
    Music.play(this.phase === 'result' || this.phase === 'ko' ? null : (low || finalRound) ? 'danger' : 'battle');
    const fight = this.phase === 'fight';
    const [i1, i2] = getInputs(fight);
    if (this.shake.t > 0) this.shake.t--;
    this.updateHpLag();
    if (this.hitstopT > 0) {                        // 역경직: 시뮬레이션 정지, 선입력만 기록
      this.hitstopT--;
      if (fight) { this.p1.readInputs(i1); this.p2.readInputs(i2); }
      return;
    }
    if (this.phase === 'ko' && this.phaseT < 50 && (this.hudT & 1)) return;   // KO 슬로모션
    this.t++; this.tick++;
    const fs = [this.p1, this.p2];
    this.p1.update(i1); this.p2.update(i2);
    resolvePush(this.p1, this.p2);
    this.p1.postUpdate(); this.p2.postUpdate();
    Combat.updateProjs(this.projs);
    Combat.clashes(fs, this.projs);
    const events = Combat.scan(fs, this.projs);
    for (const e of events) Combat.apply(e);
    if (events.length) { this.p1.buildRig(); this.p2.buildRig(); }
    if (this.isMatch && this.phase === 'fight') this.checkKO(events);
    FX.update(); Popups.update();
    this.trackStats();
    this.updatePhase();
  }

  updateHpLag() {
    [this.p1, this.p2].forEach((f, s) => {
      if (f.hp < this.prevHp[s]) this.lagDelay[s] = 24;
      this.prevHp[s] = f.hp;
      if (f.hp > this.hpLag[s]) this.hpLag[s] = f.hp;
      if (this.lagDelay[s] > 0) this.lagDelay[s]--;
      else if (this.hpLag[s] > f.hp) this.hpLag[s] = Math.max(f.hp, this.hpLag[s] - Math.max(2, (this.hpLag[s] - f.hp) * 0.08));
    });
  }

  trackStats() {
    const fs = [this.p1, this.p2], practice = !this.isMatch;
    for (let s = 0; s < 2; s++) {
      const def = fs[1 - s], v = this.comboView[s], f = fs[s];
      if (def.combo > 0) { v.hits = def.combo; v.dmg = def.comboDmg; v.t = 70; }
      else if (v.t > 0) v.t--;
      if (practice) {
        const calm = (f.isFree() || f.state === 'guard') && f.combo === 0;
        this.idleT[s] = calm ? this.idleT[s] + 1 : 0;
        if (f.hp <= 0) f.hp = 1;                                   // 연습에서는 KO 없음
        if (this.idleT[s] > 45 && (this.opt.regen || f.hp <= 1)) f.hp = f.maxHp;
        if (this.opt.noCD) { f.cd.s1 = f.cd.s2 = f.cd.s3 = 0; }
      }
    }
    // 프레임 유불리 측정 (콤보 연구용)
    if (this.adv) {
      const A = this.adv, free = f => f.isFree() || f.state === 'guard';
      if (A.a === null && free(A.atk)) A.a = this.tick;
      if (A.b === null && free(A.def)) A.b = this.tick;
      if (A.a !== null && A.b !== null) { this.advShow = { v: A.b - A.a, side: A.atk.side, t: 150 }; this.adv = null; }
    }
    if (this.advShow && this.advShow.t > 0) this.advShow.t--;
    if (this.mode === 'tutorial' && !this.tutDone) {
      const L = LESSONS[this.lesson];
      if (L.frame) { const v = L.frame(this); if (v) this.addProg(v); }
    }
  }

  // ---- 라운드 / KO / 시간 초과 / 무승부 ----
  checkKO(events) {
    const d1 = this.p1.hp <= 0, d2 = this.p2.hp <= 0;
    if (!d1 && !d2) return;
    let loser;
    if (d1 && d2) {
      // 같은 프레임에 둘 다 0: 먼저 발동된 공격에 맞은 쪽이 '먼저' 쓰러진 것. 발동 시점까지 같으면 DRAW
      const killT = f => { let t = Infinity; for (const e of events) if (e.def === f) t = Math.min(t, e.t); return t; };
      const t1 = killT(this.p1), t2 = killT(this.p2);
      loser = t1 < t2 ? 0 : t2 < t1 ? 1 : -1;
      if (loser === 0) this.p2.hp = 1; else if (loser === 1) this.p1.hp = 1;
    } else loser = d1 ? 0 : 1;
    this.finishRound(loser, 'KO');
  }
  timeUp() {
    const r1 = this.p1.hp / this.p1.maxHp, r2 = this.p2.hp / this.p2.maxHp;
    this.finishRound(Math.abs(r1 - r2) < 1e-6 ? -1 : (r1 < r2 ? 0 : 1), 'TIME');
  }
  finishRound(loser, how) {
    this.phase = 'ko'; this.phaseT = 0;
    const winner = loser === -1 ? -1 : 1 - loser;
    if (winner >= 0) this.wins[winner]++;
    const fs = [this.p1, this.p2];
    this.koInfo = { how, winner, draw: loser === -1, perfect: winner >= 0 && fs[winner].hp >= fs[winner].maxHp };
    fs.forEach((f, s) => {
      f.invuln = 9999;
      if (how === 'KO' && (loser === s || loser === -1)) {
        f.koed = true; f.move = null; f.knock = true; f.stun = 9999;
        if (f.state !== 'airhit') { f.state = 'airhit'; f.vy = -3.4; f.vx = -f.facing * 1.8; f.onGround = false; f.ground = null; }
      }
    });
    if (how === 'KO') { this.hitstop(28); this.addShake(5, 24); SFX.play('ko'); }
    else SFX.play('round');
  }
  endRound() {
    if (this.wins[0] >= 2 || this.wins[1] >= 2 || this.round >= 9) { this.showResult(); return; }
    this.round++; this.startRound();
  }
  showResult() {
    this.phase = 'result'; this.phaseT = 0;
    const w = this.wins[0] > this.wins[1] ? 0 : this.wins[1] > this.wins[0] ? 1 : -1;
    this.matchWinner = w;
    SFX.play(w === -1 ? 'round' : w === this.local ? 'win' : 'lose');
    if (this.online) { this.resultMenu = this.onlineResultMenu(); return; }
    this.resultMenu = new Menu([
      { label: '다시 대전 (새 맵)', action: () => goto(new Battle(this.cfg)) },
      { label: '대전 설정', action: () => goto(AISetupScene()) },
      { label: '메인 메뉴', action: () => goto(TitleScene) }
    ]);
  }
  updatePhase() {
    this.phaseT++;
    switch (this.phase) {
      case 'intro':
        if (this.phaseT === 2) SFX.play('round');
        if (this.phaseT === 70) SFX.play('fight');
        if (this.phaseT >= 90) { this.phase = 'fight'; this.phaseT = 0; }
        break;
      case 'fight':
        if (this.timer > 0) {
          this.timer--;
          if (this.timer % 60 === 0 && this.timer <= 600 && this.timer > 0) SFX.play('tick');
          if (this.timer === 0) this.timeUp();
        }
        // 위기(체력 25% 이하) 심장 박동음
        if (this.me.hp > 0 && this.me.hp / this.me.maxHp <= 0.25 && this.hudT % 54 === 0) SFX.play('heart');
        break;
      case 'ko': if (this.phaseT >= 150) this.endRound(); break;
    }
  }


  // ---- 온라인 대전 (딜레이 락스텝) ----
  netInit() {
    const d = this.cfg.delay || 3;
    this.net = { delay: d, inputs: [[], []], localFrame: d, simFrame: 0, hashes: {}, remoteHashes: {}, stall: 0, carry: null,
      rtt: 0, pingT: 0, snap: null, desyncs: 0, lost: false, lostMsg: '' };
    const neutral = encodeInput({});
    for (let f = 0; f < d; f++) { this.net.inputs[0][f] = neutral; this.net.inputs[1][f] = neutral; }
    this.mid = this.cfg.mid || 0;
    this.rematch = [false, false]; this.rematchMsg = '';
    Net.onMsg = m => this.onNet(m);
    Net.onLost = () => this.netLose('상대와 연결이 끊겼습니다');
    const q = Net.queue; Net.queue = [];
    for (const m of q) this.onNet(m);
    if (!Net.connected) this.netLose('연결되어 있지 않습니다');
  }
  netLose(msg) { if (!this.net || this.net.lost) return; this.net.lost = true; this.net.lostMsg = msg; this.pauseMenu = null; SFX.play('back'); }
  leaveOnline() { Net.send({ t: 'leave' }); Net.close(); goto(TitleScene); }
  onNet(m) {
    const N = this.net;
    if (m.mid !== undefined && m.mid !== this.mid) return;      // 이전 판의 늦게 도착한 메시지
    switch (m.t) {
      case 'i': N.inputs[1 - this.local][m.f] = m.d; break;
      case 'h': N.remoteHashes[m.f] = m.h; this.checkHash(m.f); break;
      case 'snap': N.snap = m; break;
      case 'ping': Net.send({ t: 'pong', a: m.a }); break;
      case 'pong': N.rtt = Math.round(performance.now() - m.a); break;
      case 'leave': this.netLose('상대가 대전을 떠났습니다'); break;
      case 'rematch':
        this.rematch[1 - this.local] = true; this.rematchMsg = '상대가 재대결을 원합니다';
        this.tryRematch(); break;
      case 'start':                                              // 방장이 재대결을 시작
        if (this.local === 1) { Net.onMsg = null; goto(new Battle(m.cfg)); }
        break;
    }
  }
  tryRematch() {
    if (this.local !== 0 || !this.rematch[0] || !this.rematch[1]) return;
    const cfg = { mode: 'online', p1: this.c1, p2: this.c2, mapIndex: Math.floor(Math.random() * MAPS.length), delay: this.net.delay, mid: this.mid + 1, side: 0 };
    Net.send({ t: 'start', cfg: Object.assign({}, cfg, { side: 1 }) });
    Net.onMsg = null; goto(new Battle(cfg));
  }
  onlineResultMenu() {
    return new Menu([
      { label: '다시 대전', action: () => {
        if (this.rematch[this.local]) return;
        this.rematch[this.local] = true; Net.send({ t: 'rematch', mid: this.mid });
        this.rematchMsg = this.rematch[1 - this.local] ? '시작합니다...' : '상대의 수락을 기다리는 중...';
        this.tryRematch();
      } },
      { label: '메인 메뉴', action: () => this.leaveOnline() }
    ]);
  }
  // 상태 해시: 두 화면의 시뮬레이션이 같은지 검사
  stateHash() {
    const r = v => Math.round(v * 100);
    const a = [this.timer, this.phase, this.phaseT, this.round, this.wins[0], this.wins[1], this.hitstopT, this.projs.length];
    for (const f of [this.p1, this.p2]) a.push(r(f.x), r(f.y), r(f.vx), r(f.vy), f.hp, f.state, f.moveId || '', f.moveK | 0, f.stun | 0, r(f.gauge || 0), f.facing, f.cd.s1, f.cd.s2, f.cd.s3);
    for (const p of this.projs) a.push(r(p.x), r(p.y));
    const str = a.join(',');
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  checkHash(f) {
    const N = this.net, a = N.hashes[f], b = N.remoteHashes[f];
    if (a === undefined || b === undefined) return;
    delete N.hashes[f]; delete N.remoteHashes[f];
    if (a === b) return;
    N.desyncs++;
    if (this.local === 0) Net.send({ t: 'snap', mid: this.mid, f: N.simFrame, s: this.snapshot() });   // 방장 상태로 맞춤
  }
  snapshot() {
    const keys = ['timer', 'phase', 'phaseT', 'round', 'wins', 'hitstopT', 'tick', 't', 'hudT', 'koInfo', 'comboView', 'shake'];
    const b = {};
    for (const k of keys) b[k] = JSON.parse(JSON.stringify(this[k] === undefined ? null : this[k]));
    return { b, p: [snapFighter(this.p1), snapFighter(this.p2)], projs: this.projs.map(p => snapProj(p)) };
  }
  loadSnapshot(s) {
    for (const k in s.b) this[k] = s.b[k];
    loadFighter(this.p1, s.p[0]); loadFighter(this.p2, s.p[1]);
    this.projs = s.projs.map(p => loadProj(p, this));
  }
  updateOnline() {
    const N = this.net;
    if (N.lost) {
      if (MI.ok() || MI.back() || Keys.pressed.has('Mouse0')) { Net.close(); goto(TitleScene); }
      return;
    }
    // 메뉴 (일시정지 메뉴가 열려 있어도 대전은 계속 진행됨)
    let menuOpen = false;
    if (this.pauseMenu) {
      menuOpen = true;
      if (this.showControls) { if (MI.back() || MI.ok() || Keys.pressed.has('Mouse0')) { this.showControls = false; SFX.play('back'); } }
      else if (MI.back()) this.closePause();
      else this.pauseMenu.update();
    } else if (this.resultMenu) { menuOpen = true; this.resultMenu.update(); }
    else if (Keys.pressed.has('Escape')) { this.openPause(); menuOpen = true; }
    if (Loop.next) return;
    // 내 입력 기록 → 전송 (입력 지연 프레임만큼 미래 프레임에 예약)
    let raw = readHuman();
    if (menuOpen) raw = { aimX: raw.aimX, aimY: raw.aimY };
    if (N.carry) raw = mergeInput(N.carry, raw);
    if (N.localFrame < N.simFrame + N.delay + 2) {
      const enc = encodeInput(raw); N.carry = null;
      N.inputs[this.local][N.localFrame] = enc;
      Net.send({ t: 'i', mid: this.mid, f: N.localFrame, d: enc });
      N.localFrame++;
    } else N.carry = raw;                                // 상대를 기다리는 동안 누른 키는 다음 프레임에 합침
    // 보정 스냅샷 (게스트)
    if (N.snap && N.snap.f <= N.simFrame) {
      const sn = N.snap, cur = N.simFrame; N.snap = null;
      this.loadSnapshot(sn.s); N.simFrame = sn.f;
      while (N.simFrame < cur) this.netStep();              // 스냅샷 이후 프레임은 저장된 입력으로 다시 계산
    }
    // 양쪽 입력이 모두 있는 프레임만 실행 (뒤처지면 한 번에 2프레임까지 따라잡기)
    let steps = 0;
    const ahead = N.localFrame - N.simFrame;
    while (steps < (ahead > N.delay + 1 ? 2 : 1) && N.inputs[0][N.simFrame] && N.inputs[1][N.simFrame] && !(N.snap && N.snap.f <= N.simFrame)) {
      this.netStep(); steps++;
    }
    N.stall = steps ? 0 : N.stall + 1;
    if (N.stall > 60 * 15) this.netLose('상대의 응답이 없습니다');
    if (++N.pingT % 60 === 0) Net.send({ t: 'ping', a: performance.now() });
    if (this.resultMenu) { this.phaseT++; FX.update(); }
  }
  netStep() {
    const N = this.net, f = N.simFrame;
    const d0 = decodeInput(N.inputs[0][f]), d1 = decodeInput(N.inputs[1][f]);
    if (this.phase !== 'result') this.simStep(fight => fight ? [d0, d1] : [NEUTRAL, NEUTRAL]);
    N.simFrame++;
    const old = N.simFrame - 300;
    if (old >= 0) { delete N.inputs[0][old]; delete N.inputs[1][old]; }
    if (N.simFrame % 120 === 0) {
      const h = this.stateHash(); N.hashes[N.simFrame] = h;
      Net.send({ t: 'h', mid: this.mid, f: N.simFrame, h });
      this.checkHash(N.simFrame);
    }
  }
  drawNet() {
    const N = this.net;
    const col = N.rtt < 80 ? PAL.green : N.rtt < 160 ? PAL.yellow : PAL.red;
    drawText((N.rtt || '--') + 'MS', VW - 6, 29, col, { align: 'right' });
    if (N.stall > 20 && !N.lost) {
      panel(VW / 2 - 60, 64, 120, 18, 0.9, PAL.yellow);
      kText('상대를 기다리는 중...', VW / 2, 68, PAL.white, { align: 'center' });
    }
    if (N.lost) {
      g.globalAlpha = 0.7; R(0, 0, VW, VH, PAL.ink); g.globalAlpha = 1;
      panel(50, 60, 220, 52, 0.95, PAL.red);
      kText(N.lostMsg, VW / 2, 70, PAL.white, { align: 'center' });
      kText('클릭 / ENTER: 메인 메뉴', VW / 2, 92, PAL.lgray, { align: 'center' });
    }
  }

  // ---- 렌더 ----
  render() {
    g.drawImage(this.map.bg, 0, 0, buf.width, buf.height);

    const fs = [this.p2, this.p1];

  // 1P 조준 표시: 몸에서 조준 방향 점 3개(발동 후 고정되면 노란색) + 커서 위치 십자선
  drawAim() {
    if (this.pauseMenu || this.resultMenu) return;
    const f = this.me, c = f.chest(), atk = f.state === 'attack' && f.move;
    const a = atk ? f.moveAim : f.isGuarding() ? f.guardAng : f.aim;
    const side = atk || Math.abs(Keys.mx - f.x) < 3 ? f.facing : Math.sign(Keys.mx - f.x);
    const dv = V(side * Math.cos(a), Math.sin(a));
    const locked = atk && f.moveK >= f.move.startup;
    for (const r of [15, 18, 21]) R(c.x + dv.x * r - 0.25, c.y + dv.y * r - 0.25, 0.5, 0.5, locked ? PAL.yellow : SIDE_COL[f.side]);
    if (Touch.enabled && !mouseRecent()) return;        // 터치 조작 중에는 마우스 십자선 숨김
    const x = snap(Keys.mx), y = snap(Keys.my);
    const L = (x0, y0, w, h) => { R(x0 + 0.5, y0 + 0.5, w, h, PAL.ink); R(x0, y0, w, h, PAL.white); };
    L(x - 3.5, y, 2, 0.5); L(x + 2, y, 2, 0.5); L(x, y - 3.5, 0.5, 2); L(x, y + 2, 0.5, 2);
    R(x, y, 0.5, 0.5, SIDE_COL[f.side]);
  }
  drawDebug() {
    for (const f of [this.p1, this.p2]) {
      for (const h of f.hurt) rectLine(h.x, h.y, h.w, h.h, f.invuln > 0 ? PAL.cyan : PAL.green);
      for (const h of f.hitboxes) rectLine(h.x, h.y, h.w, h.h, PAL.red);
      const pr = f.pushRect();
      rectLine(Math.round(pr.x), Math.round(pr.y), pr.w, Math.round(pr.h), PAL.yellow);
      drawText(f.state.toUpperCase(), Math.round(f.x), Math.round(f.y) + 4, PAL.white, { align: 'center' });
    }
    for (const p of this.projs) rectLine(Math.floor(p.x), Math.floor(p.y), p.w, p.h, PAL.red);
  }

  beat() { const p = this.hudT % 54; return p < 5 ? 1 : (p >= 9 && p < 13) ? 0.7 : 0; }
  // 위기 연출: 1P 체력 25% 이하 → 화면 가장자리 붉은 박동
  drawDanger() {
    const f = this.me;
    if (f.hp <= 0 || f.hp / f.maxHp > 0.25 || this.phase === 'result') return;
    const b = this.beat();
    if (!b) return;
    g.globalAlpha = 0.35 * b;
    for (let i = 0; i < 4; i++) {
      R(0, i * 2, VW, 2, PAL.red); R(0, VH - 2 - i * 2, VW, 2, PAL.red);
      R(i * 2, 0, 2, VH, PAL.red); R(VW - 2 - i * 2, 0, 2, VH, PAL.red);
      g.globalAlpha *= 0.6;
    }
    g.globalAlpha = 1;
  }

  drawHpBar(f, side) {
    const W = 118, H = 7, x = side ? VW - 4 - W : 4, y = 4;
    const ratio = Math.max(0, f.hp / f.maxHp), low = ratio <= 0.25 && f.hp > 0, b = low ? this.beat() : 0;
    R(x - 0.5, y - 0.5, W + 1, H + 1, b ? PAL.red : PAL.ink);
    if (b) rectLine(x - 1.5, y - 1.5, W + 3, H + 3, b > 0.8 ? PAL.yellow : PAL.dred);
    R(x, y, W, H, '#2a0a18');
    const lw = Math.round(W * this.hpLag[side] / f.maxHp), hw = Math.round(W * ratio);
    R(side ? x + W - lw : x, y, lw, H, PAL.white);
    let col = ratio > 0.5 ? PAL.green : ratio > 0.25 ? PAL.yellow : PAL.red;
    if (low && (this.hudT % 16 < 8 || b)) col = b ? '#ff6a6a' : PAL.dred;
    const hx = side ? x + W - hw : x;
    R(hx, y, hw, H, col);
    if (hw > 0) R(hx, y + 1, hw, 0.5, ratio > 0.5 ? '#9af09a' : ratio > 0.25 ? '#fff0a0' : '#ff9a9a');
    // 가드 게이지
    const GW = Math.round(W * 0.6), gx = side ? x + W - GW : x;
    const gr = Math.max(0, f.gauge) / f.def.guard.gauge, gw = Math.round(GW * gr);
    R(gx - 0.5, y + H + 1.5, GW + 1, 3, PAL.ink);
    const gcol = f.state === 'gbreak' ? (this.hudT % 6 < 3 ? PAL.red : PAL.dred) : gr < 0.3 ? PAL.orange : PAL.cyan;
    R(side ? gx + GW - gw : gx, y + H + 2, gw, 2, gcol);
    // 이름 + 라운드 승수
    const tag = this.online ? (side === this.local ? 'YOU ' : 'RIVAL ') : side === 0 ? '1P ' : (this.mode === 'ai' ? 'CPU ' : 'DUMMY ');
    drawText(tag + f.def.name, side ? x + W : x, y + H + 7, SIDE_COL[side], { align: side ? 'right' : 'left' });
    if (this.isMatch) for (let i = 0; i < 2; i++) {
      const px = side ? x + W - 78 + i * 7 : x + 72 - i * 7, py = y + H + 7;
      R(px - 0.5, py - 0.5, 6, 6, PAL.ink);
      R(px, py, 5, 5, this.wins[side] > i ? PAL.yellow : PAL.dgray);
      if (this.wins[side] > i) R(px + 1, py + 1, 2, 2, PAL.white);
    }
  }

  drawSkills(f, side) {

// 17. 온라인 대전 — P2P(WebRTC, PeerJS 무료 연결 서버) + 입력 동기화(딜레이 락스텝) + 상태 검증
//   · 양쪽이 같은 시뮬레이션을 돌리고 '입력'만 주고받음 → 통신량이 작고 두 화면이 똑같이 진행
//   · 통신 지연(왕복 시간)에 맞춰 입력 지연 프레임을 자동 결정 (2~8프레임)
//   · 2초마다 상태 해시를 비교, 어긋나면 방장 상태로 맞춤
//   · 같은 PC 두 창 테스트: 주소 뒤에 ?local=1 (BroadcastChannel 사용)
// =====================================================================
const GAME_VER = 'recoil-online-1';
const IN_KEYS = ['l', 'r', 'jumpH', 'jumpP', 'downP', 'downH', 'crouch', 'dashP', 'atkP', 'guardH', 'guardP', 'guardR', 's1', 's2', 's3'];
function encodeInput(inp) {
  let bits = 0;
  IN_KEYS.forEach((k, i) => { if (inp[k]) bits |= 1 << i; });
  const ax = inp.aimX === undefined || inp.aimX === null ? -99999 : Math.round(inp.aimX * 4);
  const ay = inp.aimY === undefined || inp.aimY === null ? -99999 : Math.round(inp.aimY * 4);
  return [bits, inp.lP | 0, inp.rP | 0, ax, ay];
}
function decodeInput(a) {
  const o = {};
  IN_KEYS.forEach((k, i) => { o[k] = !!(a[0] & (1 << i)); });
  o.lP = a[1]; o.rP = a[2];
  o.aimX = a[3] === -99999 ? undefined : a[3] / 4; o.aimY = a[4] === -99999 ? undefined : a[4] / 4;
  return o;
}
const NEUTRAL_DEC = decodeInput(encodeInput({}));

const Net = {
  peer: null, conn: null, bc: null, role: null, code: null, status: '', connected: false, onMsg: null, onLost: null, queue: [],
  makeCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; },
  isLocal() { return /[?&]local=1/.test(location.search); },
  joinURL() { return location.href.split('#')[0].split('?')[0] + '?join=' + this.code + (this.isLocal() ? '&local=1' : ''); },
  host() {
    this.close(); this.role = 'host'; this.code = this.makeCode();
    if (this.isLocal()) { this.useBC(); this.status = '상대를 기다리는 중... (PC 테스트)'; return; }
    if (typeof Peer === 'undefined') { this.status = '온라인 모듈을 불러오지 못했습니다'; return; }
    this.status = '연결 서버에 접속 중...';
    this.peer = new Peer('recoil-' + this.code.toLowerCase(), { debug: 0 });
    this.peer.on('open', () => { this.status = '상대를 기다리는 중...'; });
    this.peer.on('connection', c => { if (this.conn) { try { c.close(); } catch (e) { /* 이미 연결됨 */ } return; } this.attach(c); });
    this.peer.on('error', e => {
      if (e.type === 'unavailable-id') { this.host(); return; }
      this.status = e.type === 'network' || e.type === 'server-error' ? '연결 서버에 접속할 수 없습니다' : '오류: ' + (e.type || e);
    });
  },
  join(code) {
    this.close(); this.role = 'guest'; this.code = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (this.isLocal()) { this.useBC(); this.connected = true; this.status = '연결됨'; this.send({ t: 'hello', v: GAME_VER, char: Game.p1Char }); return; }
    if (typeof Peer === 'undefined') { this.status = '온라인 모듈을 불러오지 못했습니다'; return; }
    this.status = '방 ' + this.code + ' 에 연결 중...';
    this.peer = new Peer({ debug: 0 });
    this.peer.on('open', () => this.attach(this.peer.connect('recoil-' + this.code.toLowerCase(), { reliable: true })));
    this.peer.on('error', e => {
      this.status = e.type === 'peer-unavailable' ? '방을 찾을 수 없습니다 (코드 확인)' :
        e.type === 'network' || e.type === 'server-error' ? '연결 서버에 접속할 수 없습니다' : '오류: ' + (e.type || e);
    });
  },
  attach(c) {
    this.conn = c;
    c.on('open', () => {
      this.connected = true; this.status = '연결됨';
      if (this.role === 'guest') this.send({ t: 'hello', v: GAME_VER, char: Game.p1Char });
    });
    c.on('data', d => this.recv(typeof d === 'string' ? JSON.parse(d) : d));
    c.on('close', () => this.lost());
    c.on('error', () => this.lost());
  },
  useBC() {
    this.bc = new BroadcastChannel('recoil-' + this.code);
    this.bc.onmessage = ev => {
      if (!ev.data || ev.data.from === this.role) return;
      if (!this.connected) { this.connected = true; this.status = '연결됨'; }
      this.recv(JSON.parse(ev.data.s));
    };
  },
  send(o) {
    const s = JSON.stringify(o);
    try {
      if (this.conn && this.conn.open) this.conn.send(s);
      else if (this.bc) this.bc.postMessage({ from: this.role, s });
    } catch (e) { this.lost(); }
  },
  recv(m) { if (this.onMsg) this.onMsg(m); else this.queue.push(m); },
  lost() { if (!this.connected) return; this.connected = false; this.status = '연결이 끊겼습니다'; if (this.onLost) this.onLost(); },
  close() {
    try { if (this.conn) this.conn.close(); } catch (e) { /* 무시 */ }
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* 무시 */ }
    try { if (this.bc) this.bc.close(); } catch (e) { /* 무시 */ }
    this.peer = this.conn = this.bc = null; this.connected = false; this.onMsg = null; this.onLost = null; this.queue = [];
  }
};

// 상태 스냅샷 (어긋남 보정용)
const SNAP_SKIP = new Set(['def', 'map', 'opp', 'spr', 'J', 'hurt', 'hitboxes', 'guardZone', 'scarf', 'move', 'ground']);
function snapFighter(f) {
  const o = {};
  for (const k of Object.keys(f)) {
    if (SNAP_SKIP.has(k)) continue;
    const v = f[k];
    if (v === null || typeof v !== 'object') { if (typeof v !== 'function' && v !== undefined) o[k] = v; }
    else o[k] = JSON.parse(JSON.stringify(v));
  }
  o._move = f.move ? f.moveId : null;
  o._ground = f.ground === 'floor' ? 'floor' : f.ground ? f.map.plats.indexOf(f.ground) : null;
  return o;
}
function loadFighter(f, o) {
  for (const k in o) if (k[0] !== '_') f[k] = o[k];
  f.move = o._move ? f.def.moves[o._move] : null;
  f.ground = o._ground === 'floor' ? 'floor' : o._ground === null ? null : f.map.plats[o._ground];
  f.buildRig();
}

// QR 코드 (qrcode-generator 라이브러리) → 도트로 그리기
function makeQR(text) {
  if (typeof qrcode === 'undefined') return null;
  const q = qrcode(0, 'L'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = [];
  for (let r = 0; r < n; r++) { m.push([]); for (let c = 0; c < n; c++) m[r].push(q.isDark(r, c)); }
  return { n, m };
}
function drawQR(qr, cx, cy, size) {
  const cell = Math.max(1, Math.floor(size / (qr.n + 4) * 2) / 2), total = cell * (qr.n + 4);
  const x0 = snap(cx - total / 2), y0 = snap(cy - total / 2);
  R(x0, y0, total, total, '#ffffff');
  for (let r = 0; r < qr.n; r++) for (let c = 0; c < qr.n; c++) if (qr.m[r][c]) R(x0 + (c + 2) * cell, y0 + (r + 2) * cell, cell, cell, '#000000');
  return total;
}
