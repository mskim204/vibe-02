<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마인드 클래시 - 예측 심리전 격투</title>
<style>
  html, body { margin: 0; height: 100%; background: #d9dfe7; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   마인드 클래시 (MIND CLASH) - 2D 횡스크롤 턴제 예측 심리전 격투
   - 옆에서 보는 시점: 좌우 이동 + 점프 + 발판(발판 위에 서 있어야 높은 곳에 있을 수 있음)
   - 공격: 바라보는 방향으로 검 휘두르기 (횡베기 / 올려베기 / 내려베기)
   - 모든 그래픽은 Canvas 2D로 직접 그림 (이미지/이모지 미사용)
   - 사운드는 Web Audio API 합성음
   - 고정 60Hz 업데이트(Delta Time 누적) + requestAnimationFrame 렌더링
   ========================================================================= */

// ----------------------------------------------------------------- 기본 설정
const W = 1280, H = 720;
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize);
resize();

const FONT = "'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif";
const font = (size, weight = 600) => `${weight} ${size}px ${FONT}`;

// 차분한 플랫 팔레트 (네온/글로우 없음)
const C = {
  bg1: '#eef1f5', bg2: '#dde3ea', panel: '#ffffff', panel2: '#f2f4f7', line: '#d0d7e0',
  text: '#1f2733', sub: '#5d6878', dim: '#98a2b0',
  p1: '#2f6fd1', ai: '#d64545', gold: '#c98a10', green: '#2f9e5b',
  paper: '#f8f6f1', grid: 'rgba(60,70,90,0.055)',
  wood: '#b48c63', woodTop: '#c9a37a', woodDark: '#7d5f40',
  dirt: '#8f7658', dirtDark: '#76603f', grass: '#77a058',
  steel: '#cdd3da', steelDark: '#4b5360', hilt: '#6b4a2b'
};

// ----------------------------------------------------------------- 게임 규칙 상수
const ARENA = { x: 252, y: 112, w: 776, h: 550 };   // 경기장
const GROUND_Y = 636;      // 바닥 높이(발 위치)
const BODY_W = 32, BODY_H = 100;   // 피격 판정 박스(발 기준)
const GRAVITY = 2400;
const JUMP_V = Math.sqrt(2 * GRAVITY * 150);   // 최대 점프 높이 150
const SPEED = 260;         // 좌우 이동 속도(px/s)
const STAMINA = 320;       // 한 턴 이동력 (이동 1px = 1, 점프 1회 = 50)
const JUMP_COST = 50;
const PLAN_TIME = 10;      // 작전 페이즈 제한 시간(초)
const MAX_HP = 100;

// 발판: 바닥(0층) + 1~2층 발판 (아래에서 점프로 통과, S로 내려가기)
const SURFACES = [
  { x0: ARENA.x, x1: ARENA.x + ARENA.w, y: GROUND_Y, lvl: 0, ground: true },
  { x0: 300, x1: 470, y: 512, lvl: 1 },
  { x0: 810, x1: 980, y: 512, lvl: 1 },
  { x0: 530, x1: 750, y: 388, lvl: 2 }
];

// 격돌 페이즈 타임라인(초)
const CL_REVEAL = 0.5;     // AI가 최종 위치로 이동하는 연출
const CL_FIRE_MIN = 0.85;  // 동시 공격 (착지 이후)
const SWING_T = 0.22;      // 검 휘두르는 시간
const CL_AFTER = 2.0;      // 판정 후 결과 확인 시간

// ----------------------------------------------------------------- 유틸
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const vcopy = v => ({ x: v.x, y: v.y });
const easeOut = t => 1 - Math.pow(1 - t, 3);
const inRect = (p, x, y, w, h) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
const inArena = p => inRect(p, ARENA.x, ARENA.y, ARENA.w, ARENA.h);
const gaussW = (d, s) => Math.exp(-(d * d) / (2 * s * s));
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(str, maxW) {
  const out = []; let line = '';
  for (const ch of str) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) {
      const sp = line.lastIndexOf(' ');
      if (sp > 0 && line.length - sp < 10) { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
      else { out.push(line); line = ch; }
    } else line = test;
  }
  if (line) out.push(line);
  return out;
}
function text(str, x, y, size, color, align = 'left', weight = 600) {
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function outlinedText(str, x, y, size, fill, stroke, weight = 900, lw = 6) {
  ctx.font = font(size, weight); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

// ----------------------------------------------------------------- 사운드 (Web Audio 합성)
const Sfx = {
  ac: null, master: null, noiseBuf: null,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    try {
      this.ac = new A();
      this.master = this.ac.createGain(); this.master.gain.value = 0.55;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  tone(f, d, { type = 'sine', vol = 0.3, to = null, delay = 0, attack = 0.005 } = {}) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, { vol = 0.3, freq = 1000, to = null, type = 'bandpass', q = 1, delay = 0 } = {}) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + d);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, rand(0, 0.5)); s.stop(t + d + 0.05);
  },
  ui() { this.tone(640, 0.06, { type: 'square', vol: 0.05 }); },
  aim() { this.tone(1250, 0.05, { type: 'square', vol: 0.07 }); this.tone(1900, 0.06, { vol: 0.07, delay: 0.035 }); },
  jump() { this.tone(300, 0.12, { type: 'triangle', vol: 0.12, to: 620 }); },
  land() { this.noise(0.06, { vol: 0.12, freq: 400, type: 'lowpass' }); },
  swing() { this.noise(0.28, { vol: 0.4, freq: 900, to: 4500, q: 2 }); this.tone(220, 0.15, { type: 'triangle', vol: 0.06, to: 520 }); },
  hit() {
    this.tone(1400, 0.12, { type: 'square', vol: 0.08, to: 700 });
    this.tone(140, 0.3, { type: 'square', vol: 0.2, to: 45 });
    this.tone(80, 0.4, { vol: 0.4, to: 35 });
    this.noise(0.22, { vol: 0.5, freq: 1600, to: 300, type: 'lowpass' });
  },
  miss() { this.tone(520, 0.2, { type: 'triangle', vol: 0.12, to: 240 }); this.noise(0.15, { vol: 0.08, freq: 3500, type: 'highpass' }); },
  tick() { this.tone(1000, 0.08, { type: 'square', vol: 0.08 }); },
  ready() { this.tone(520, 0.09, { type: 'triangle', vol: 0.2 }); this.tone(780, 0.14, { type: 'triangle', vol: 0.2, delay: 0.08 }); },
  err() { this.tone(190, 0.16, { type: 'square', vol: 0.1 }); },
  phase() { this.tone(330, 0.12, { type: 'triangle', vol: 0.12 }); this.tone(495, 0.16, { type: 'triangle', vol: 0.12, delay: 0.07 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.22, delay: i * 0.12 })); },
  lose() { [440, 370, 311, 220].forEach((f, i) => this.tone(f, 0.35, { type: 'sawtooth', vol: 0.08, delay: i * 0.16 })); },
  draw() { [440, 440, 554].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', vol: 0.18, delay: i * 0.15 })); }
};

// ----------------------------------------------------------------- 무기/기술 시스템 (확장 구조)
/*  무기(WEAPONS)는 여러 '기술(techs)'을 가지며, 각 기술은
    - box  : 발 위치 기준, '바라보는 방향' 쪽으로 [앞 시작, 앞 끝, 위(-)~아래(+) 시작, 끝] 공격 판정 박스
    - swing: 휘두르는 각도(시작, 끝) — 애니메이션용
    - damage
    추후 [무기 설정]에서 fighter.weapon 값만 바꾸면 공격 범위/모양/대미지가 교체된다.        */
const WEAPONS = {
  sword: {
    id: 'sword', name: '검', locked: false, desc: '균형 잡힌 근접 무기', blade: 60,
    techs: {
      mid:  { name: '횡베기',   key: '1', box: [0, 175, -118, -2],  swing: [-1.7, 0.7], damage: 25, desc: '같은 높이의 정면' },
      up:   { name: '올려베기', key: '2', box: [-10, 150, -262, -104], swing: [1.1, -2.0], damage: 25, desc: '한 층 위만 (같은 층 X)' },
      down: { name: '내려베기', key: '3', box: [-10, 150, 6, 140],  swing: [-1.5, 1.6], damage: 25, desc: '한 층 아래만 (같은 층 X)' }
    }
  },
  // ---- 추후 업데이트 예정 무기 (잠김) ----
  spear: { id: 'spear', name: '창', locked: true, desc: '길고 가는 찌르기', blade: 95,
    techs: { mid: { name: '찌르기', box: [0, 290, -80, -40], swing: [0, 0], damage: 25 } } },
  greatsword: { id: 'greatsword', name: '대검', locked: true, desc: '넓은 범위, 고위력', blade: 80,
    techs: { mid: { name: '내려치기', box: [-20, 160, -200, 20], swing: [-2, 1], damage: 35 } } },
  bow: { id: 'bow', name: '활', locked: true, desc: '멀리 날아가는 화살', blade: 0,
    techs: { mid: { name: '사격', box: [60, 560, -70, -50], swing: [0, 0], damage: 15 } } }
};
const TECH_ORDER = ['mid', 'up', 'down'];
function techRect(pos, facing, weaponId, techId) {
  const b = WEAPONS[weaponId].techs[techId].box;
  const x0 = facing > 0 ? pos.x + b[0] : pos.x - b[1];
  const x1 = facing > 0 ? pos.x + b[1] : pos.x - b[0];
  return { x0, x1, y0: pos.y + b[2], y1: pos.y + b[3] };
}
const bodyRect = pos => ({ x0: pos.x - BODY_W / 2, x1: pos.x + BODY_W / 2, y0: pos.y - BODY_H, y1: pos.y });
const overlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
const attackHits = (att, target) => overlap(techRect(att.pos, att.facing, att.weapon, att.tech), bodyRect(target.pos));

function drawRectArea(r, color, { alpha = 1, fill = 0.15, dash = null, lw = 2.5 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = color; ctx.globalAlpha *= fill;
  rr(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0, 8); ctx.fill();
  ctx.globalAlpha /= fill;
  ctx.strokeStyle = color; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);
  ctx.stroke(); ctx.restore();
}
// 검기(초승달 모양) 이펙트
function drawSlashArc(pos, facing, techId, k, color, scale = 1) {
  const sw = WEAPONS.sword.techs[techId] ? WEAPONS.sword.techs[techId].swing : [-1.5, 0.6];
  const cx = pos.x, cy = pos.y - 68 * scale;
  const R = (techId === 'mid' ? 125 : 135) * scale, th = 30 * scale;
  const end = sw[0] + (sw[1] - sw[0]) * clamp(k, 0, 1);
  const start = sw[0] + (sw[1] - sw[0]) * clamp(k - 0.6, 0, 1);
  const wa = a => facing > 0 ? a : Math.PI - a;
  const N = 18;
  ctx.save(); ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = wa(start + (end - start) * i / N);
    const r = R * (0.92 + 0.08 * Math.sin(Math.PI * i / N));
    i ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  for (let i = N; i >= 0; i--) {
    const a = wa(start + (end - start) * i / N);
    const r = R - th * Math.sin(Math.PI * i / N);
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.globalAlpha *= 0.55; ctx.fill();
  ctx.restore();
}

// ----------------------------------------------------------------- 입력
const keys = {};
const mouse = { x: -999, y: -999 };
function canvasPoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
addEventListener('keydown', e => {
  Sfx.unlock();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onKeyPress(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('pointermove', e => { const p = canvasPoint(e); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('pointerdown', e => {
  Sfx.unlock();
  const p = canvasPoint(e); mouse.x = p.x; mouse.y = p.y;
  if (e.button !== 0) return;
  onClick(p);
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// ----------------------------------------------------------------- UI 버튼 (매 프레임 등록)
let buttons = [];
let hoverAny = false;
function button(x, y, w, h, label, onClick, o = {}) {
  const hover = !o.disabled && inRect(mouse, x, y, w, h);
  if (hover) hoverAny = true;
  buttons.push({ x, y, w, h, onClick, disabled: o.disabled });
  const style = o.active ? 'active' : (o.style || 'normal');
  const S = {
    normal:  ['#ffffff', C.text, '#c3ccd8'],
    ghost:   ['#ffffff', C.text, '#c3ccd8'],
    primary: [C.p1, '#ffffff', '#255bb0'],
    danger:  [C.ai, '#ffffff', '#b53636'],
    gold:    ['#d99a1c', '#ffffff', '#b07a0e'],
    active:  ['#e3edfc', C.p1, C.p1]
  }[style];
  ctx.save();
  const lift = hover ? -2 : 0, r = o.r || 10;
  ctx.globalAlpha = o.disabled ? 0.45 : 1;
  ctx.fillStyle = 'rgba(30,40,60,0.12)'; rr(x, y + 3, w, h, r); ctx.fill();
  rr(x, y + lift, w, h, r); ctx.fillStyle = S[0]; ctx.fill();
  const plain = style === 'normal' || style === 'ghost';
  if (hover) { ctx.fillStyle = plain ? 'rgba(47,111,209,0.06)' : 'rgba(255,255,255,0.12)'; ctx.fill(); }
  ctx.strokeStyle = hover && plain ? C.p1 : S[2]; ctx.lineWidth = o.active ? 2.5 : 1.5; ctx.stroke();
  const fs = o.size || 18;
  if (o.sub) {
    text(label, x + w / 2, y + h / 2 - 8 + lift, fs, S[1], 'center', 700);
    ctx.globalAlpha *= 0.7;
    text(o.sub, x + w / 2, y + h / 2 + 12 + lift, 11, S[1], 'center', 600);
  } else text(label, x + w / 2, y + h / 2 + 1 + lift, fs, S[1], 'center', 700);
  ctx.globalAlpha = o.disabled ? 0.45 : 1;
  if (o.lock) drawLock(x + w - 30, y + h / 2 + lift, 0.9);
  ctx.restore();
}
function onClick(p) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (inRect(p, b.x, b.y, b.w, b.h)) {
      if (!b.disabled) { Sfx.ui(); b.onClick(); }
      return;
    }
  }
  if (scene === 'battle' && !paused) battleClick(p);
}

let toast = null;
function showToast(msg, life = 2.2) { toast = { msg, t: 0, life }; }

// ----------------------------------------------------------------- 그리기 헬퍼
function drawLock(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = C.gold; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, -4, 6, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = C.gold; rr(-9, -4, 18, 14, 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-1.5, 0, 3, 5);
  ctx.restore();
}
function drawCheck(x, y, on, color = C.green) {
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = on ? color : C.dim;
  rr(x - 9, y - 9, 18, 18, 4); ctx.stroke();
  if (on) {
    ctx.fillStyle = color; rr(x - 9, y - 9, 18, 18, 4); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x - 1, y + 4); ctx.lineTo(x + 5, y - 4); ctx.stroke();
  }
  ctx.restore();
}
function drawKeycap(x, y, w, h, label, pressed = false) {
  ctx.save();
  const off = pressed ? 3 : 0;
  ctx.fillStyle = '#9aa4b2'; rr(x, y + 4, w, h, 7); ctx.fill();
  ctx.fillStyle = pressed ? '#dfe5ee' : '#ffffff'; rr(x, y + off, w, h, 7); ctx.fill();
  ctx.strokeStyle = '#8f99a8'; ctx.lineWidth = 1.5; ctx.stroke();
  text(label, x + w / 2, y + h / 2 + off + 1, Math.min(18, h * 0.45), C.text, 'center', 800);
  ctx.restore();
}
function drawArrow(x1, y1, x2, y2, color, lw = 2.5, head = 9) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a - 0.5) * head, y2 - Math.sin(a - 0.5) * head);
  ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a + 0.5) * head, y2 - Math.sin(a + 0.5) * head); ctx.stroke();
  ctx.restore();
}

/* 졸라맨 (굵고 단순한 단색 실루엣, 얼굴 표정 없음). (x, y) = 발 위치. 키 약 105px.
   o: color, facing, scale, pose('idle'|'slash'|'hit'|'ko'|'win'), poseT, moving, walk, air,
      tech(슬래시 종류), flash, alpha, weapon                                                  */
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function drawStick(x, y, o = {}) {

// ----------------------------------------------------------------- 지형/이동 계산
function surfaceAt(pos) {
  for (let i = 0; i < SURFACES.length; i++) {
    const s = SURFACES[i];
    if (Math.abs(pos.y - s.y) < 1.5 && pos.x >= s.x0 - 1 && pos.x <= s.x1 + 1) return i;
  }
  return -1;
}
function levelOf(pos) {
  const i = surfaceAt(pos);
  return i >= 0 ? SURFACES[i].lvl : Math.max(0, Math.round((GROUND_Y - pos.y) / 124));
}
function surfaceBelow(x, y) {

  SURFACES.forEach((s, i) => { if (s.y > y + 1 && x >= s.x0 && x <= s.x1 && (best < 0 || s.y < SURFACES[best].y)) best = i; });
  return best;
}
const wallL = ARENA.x + BODY_W / 2 + 2, wallR = ARENA.x + ARENA.w - BODY_W / 2 - 2;

// 물리: 좌우 이동(이동력 소모), 점프(이동력 소모), 아래로 내려가기, 중력/착지

  if (inp.dx && f.stamina > 0) {
    const mv = Math.min(SPEED * dt, f.stamina);
    const nx = clamp(f.pos.x + inp.dx * mv, wallL, wallR);
    f.stamina -= Math.abs(nx - f.pos.x);
    f.pos.x = nx; f.facing = inp.dx;
    if (f.grounded) f.walk += dt * 11;
    f.moving = true;
  } else f.moving = false;
  if (inp.jump && f.grounded) {
    if (f.stamina >= JUMP_COST) { f.vy = -JUMP_V; f.grounded = false; f.stamina -= JUMP_COST; Sfx.jump(); }
    else if (!f.isAI) showToast('이동력이 부족해 점프할 수 없습니다', 1.2);
  }
  if (inp.drop && f.grounded) {
    const si = surfaceAt(f.pos);
    if (si >= 0 && !SURFACES[si].ground) { f.grounded = false; f.vy = 60; f.dropFrom = si; f.dropT = 0.22; }
  }
  if (f.grounded && surfaceAt(f.pos) < 0) { f.grounded = false; f.vy = 0; }   // 발판 끝에서 걸어 나감
  if (!f.grounded) {
    const prevY = f.pos.y;
    f.vy += GRAVITY * dt; f.pos.y += f.vy * dt;
    if (f.pos.y - BODY_H < ARENA.y + 4) { f.pos.y = ARENA.y + 4 + BODY_H; if (f.vy < 0) f.vy = 0; }
    if (f.vy >= 0) {
      let land = -1;
      SURFACES.forEach((s, i) => {
        if (f.dropT > 0 && i === f.dropFrom) return;
        if (prevY <= s.y + 0.5 && f.pos.y >= s.y && f.pos.x >= s.x0 && f.pos.x <= s.x1) {
          if (land < 0 || s.y < SURFACES[land].y) land = i;
        }

      if (land >= 0) { f.pos.y = SURFACES[land].y; f.vy = 0; f.grounded = true; Sfx.land(); }
    }

}

/* 도달 가능 지점 계산 (AI 계획 & 화면 표시용)
   - 같은 발판 위 이동: 거리만큼 이동력
   - 점프로 한 층 위: 50 + 수평 거리 (수평 70px 이내)
   - 내려가기/떨어지기: 0                                             */
let SPOTS = null;
function buildSpots() {
  SPOTS = [];
  SURFACES.forEach((s, i) => {
    const a = s.ground ? wallL : s.x0 + 4, b = s.ground ? wallR : s.x1 - 4;
    const n = Math.max(1, Math.round((b - a) / 12));
    for (let k = 0; k <= n; k++) SPOTS.push({ si: i, x: a + (b - a) * k / n, y: s.y });
  });
  SPOTS.forEach(sp => { sp.nb = []; });
  SPOTS.forEach((a, ia) => {
    const sa = SURFACES[a.si];
    SPOTS.forEach((b, ib) => {
      if (ia === ib) return;
      const dx = Math.abs(a.x - b.x);
      if (a.si === b.si && dx <= 13) a.nb.push([ib, dx]);
      const sb = SURFACES[b.si];
      if (sb.y < sa.y && sa.y - sb.y <= 140 && dx <= 70) a.nb.push([ib, JUMP_COST + dx]);
    });
    if (!sa.ground) {
      for (const x of [a.x, sa.x0 - 22, sa.x1 + 22]) {
        const extra = Math.abs(a.x - x);
        if (extra > 30) continue;
        const bi = surfaceBelow(clamp(x, wallL, wallR), sa.y);
        if (bi < 0) continue;
        let best = -1, bd = 1e9;
        SPOTS.forEach((c, ic) => { if (c.si === bi && Math.abs(c.x - x) < bd) { bd = Math.abs(c.x - x); best = ic; } });

function reachFrom(pos) {
  if (!SPOTS) buildSpots();

  if (si < 0) si = 0;
  const cost = new Array(SPOTS.length).fill(Infinity), done = new Array(SPOTS.length).fill(false);
  SPOTS.forEach((sp, i) => { if (sp.si === si) cost[i] = Math.abs(sp.x - pos.x); });
  for (;;) {
    let u = -1, bc = Infinity;
    for (let i = 0; i < cost.length; i++) if (!done[i] && cost[i] < bc) { bc = cost[i]; u = i; }
    if (u < 0 || bc > STAMINA) break;
    done[u] = true;
    for (const [v, c] of SPOTS[u].nb) if (cost[u] + c < cost[v]) cost[v] = cost[u] + c;
  }
  return SPOTS.map((sp, i) => ({ x: sp.x, y: sp.y, si: sp.si, cost: cost[i] })).filter(s => s.cost <= STAMINA);
}

let scene = 'home';

}

function onKeyPress(k) {
  if (k === 'Escape') {
    if ((scene === 'battle' && B && B.phase !== 'over') || scene === 'tutorial') { paused = !paused; Sfx.ui(); }
    return;
  }
  if (paused) return;
  if (scene === 'battle' && B) {
    if (B.phase === 'plan') {
      if (k === 'Space') playerReady();
      if (k === 'KeyW' || k === 'ArrowUp') B.p.jumpQ = true;
      if (k === 'KeyS' || k === 'ArrowDown') B.p.dropQ = true;
      if (k === 'KeyQ') setFacing(-1);
      if (k === 'KeyE') setFacing(1);
      if (k === 'Digit1' || k === 'Numpad1') setTech('mid');
      if (k === 'Digit2' || k === 'Numpad2') setTech('up');
      if (k === 'Digit3' || k === 'Numpad3') setTech('down');
    }
    if (k === 'KeyR' && B.phase === 'over' && B.overT > 1) startBattle();
  } else if (scene === 'tutorial') {
    if (k === 'ArrowRight' || k === 'KeyD' || k === 'Enter') tutGo(1);
    if (k === 'ArrowLeft' || k === 'KeyA') tutGo(-1);
  }
}

  const p = B.p;
  const dx = pt.x - p.pos.x, dy = pt.y - (p.pos.y - 50);
  const facing = Math.abs(dx) < 6 ? p.facing : (dx > 0 ? 1 : -1);
  const tech = dy < -75 ? 'up' : dy > 50 ? 'down' : 'mid';
  return { facing, tech };
}
function battleClick(pt) {
  if (B.phase !== 'plan' || !inArena(pt)) return;
  const c = clickChoice(pt);
  B.p.facing = c.facing; B.p.tech = c.tech;
  const r = techRect(B.p.pos, c.facing, B.p.weapon, c.tech);
  B.fx.push({ type: 'ripple', x: (r.x0 + r.x1) / 2, y: (r.y0 + r.y1) / 2, t: 0, life: 0.35, color: C.p1 });
  Sfx.aim();
}

/* ---------- 연습 대전 AI ----------
   1) 플레이어가 이번 턴 도달 가능한 지점들 중 어디에 설지 확률 분포를 만든다.
      (제자리 습관, 과거 이동 습관(상대 쪽으로 몇 px / 몇 층), AI 잔상 쪽으로 접근하는 경향, 기본 확률)
   2) 그 분포에서 시나리오 40개를 뽑고, 플레이어의 방향(대개 AI 잔상 쪽)과 기술(높이 차이 + 과거 기술 습관)을 추정한다.
   3) AI 자신이 도달 가능한 모든 지점 × 방향 2 × 기술 3 조합에 대해
      '명중 확률'과 '피격 위험'을 계산해 점수를 매기고, 상위 몇 개 중 하나를 고른다.             */
function aiDecide() {
  const { ai, p, hist } = B;
  const recent = hist.slice(-5);
  const side = Math.sign(ai.anchor.x - p.anchor.x) || 1;     // 플레이어 → AI 방향
  const pLvl = levelOf(p.anchor), aLvl = levelOf(ai.anchor);
  // --- 1. 플레이어 위치 분포 ---
  const stayRate = hist.length ? hist.filter(h => Math.abs(h.dx) < 25 && h.dLvl === 0).length / hist.length : 0.2;
  let habit = null;
  if (recent.length) {
    const ax = recent.reduce((s, h) => s + h.dx, 0) / recent.length;
    const al = recent.reduce((s, h) => s + h.dLvl, 0) / recent.length;
    habit = { x: p.anchor.x + ax * side, lvl: pLvl + Math.round(al) };
  }
  const pSpots = B.pReach.map(sp => {
    const lv = SURFACES[sp.si].lvl;
    let w = 0.2;
    w += (0.4 + stayRate * 2) * gaussW(sp.x - p.anchor.x, 35) * (lv === pLvl ? 1 : 0.2);
    if (habit) w += 1.4 * gaussW(sp.x - habit.x, 60) * (lv === habit.lvl ? 1 : 0.3);
    // AI 잔상을 공격할 수 있는 자리로 접근하는 경향
    w += 0.7 * gaussW(Math.abs(sp.x - ai.anchor.x) - 90, 50) * (Math.abs(lv - aLvl) <= 1 ? 1 : 0.3);
    return { sp, w };
  });
  const totalW = pSpots.reduce((s, q) => s + q.w, 0);
  const techFreq = { mid: 1, up: 1, down: 1 };
  recent.forEach(h => { techFreq[h.tech] += 1.2; });
  const towardRate = recent.length ? recent.filter(h => h.toward).length / recent.length : 0.75;
  const samples = [];
  for (let n = 0; n < 40; n++) {
    let r = Math.random() * totalW, pick = pSpots[0];
    for (const q of pSpots) { r -= q.w; if (r <= 0) { pick = q; break; } }
    const pos = { x: pick.sp.x, y: pick.sp.y };
    const toward = Math.random() < clamp(towardRate, 0.4, 0.92);
    const facing = (Math.sign(ai.anchor.x - pos.x) || 1) * (toward ? 1 : -1);
    // 기술: AI 잔상과의 층 차이로 '정석' 기술을 예상하되, 플레이어의 과거 기술 습관도 섞는다
    const dl = aLvl - SURFACES[pick.sp.si].lvl;
    let tech = dl > 0 ? 'up' : dl < 0 ? 'down' : 'mid';
    if (Math.random() < 0.35) {
      const tw = techFreq.mid + techFreq.up + techFreq.down; const r2 = Math.random() * tw;
      tech = r2 < techFreq.mid ? 'mid' : r2 < techFreq.mid + techFreq.up ? 'up' : 'down';
    }
    samples.push({ pos, facing, tech });
  }
  // --- 2. AI 후보 평가 ---
  const aggr = 0.25 + (ai.hp < p.hp ? 0.2 : 0) + (B.turn > 6 ? 0.1 : 0);
  const cands = [];
  for (const sp of B.aiReach) {
    const pos = { x: sp.x, y: sp.y }, body = bodyRect(pos);
    let danger = 0;
    for (const s of samples) if (overlap(techRect(s.pos, s.facing, 'sword', s.tech), body)) danger++;
    danger /= samples.length;
    for (const facing of [-1, 1]) for (const tech of TECH_ORDER) {
      const r = techRect(pos, facing, ai.weapon, tech);
      let hit = 0;
      for (const s of samples) if (overlap(r, bodyRect(s.pos))) hit++;
      hit /= samples.length;
      const score = hit * (1 + aggr) - danger * (1.15 - aggr) + rand(0, 0.12)
        - Math.abs(pos.x - p.anchor.x) * 0.00025 - sp.cost * 0.00008;
      cands.push({ pos, facing, tech, score });
    }
  }
  cands.sort((a, b) => b.score - a.score);
  return cands[Math.floor(rand(0, Math.min(3, cands.length)))] || { pos: vcopy(ai.anchor), facing: ai.facing, tech: 'mid' };
}

function recordHistory() {
  const { p, ai } = B;
  const side = Math.sign(ai.anchor.x - p.anchor.x) || 1;
  B.hist.push({
    dx: (p.pos.x - p.anchor.x) * side, dLvl: levelOf(p.pos) - levelOf(p.anchor),
    toward: p.facing === (Math.sign(ai.anchor.x - p.pos.x) || 1), tech: p.tech
  });
}

function resolveClash() {
  const { p, ai } = B;
  B.resolved = true;
  recordHistory();
  const pHit = attackHits(p, ai), aHit = attackHits(ai, p);
  for (const [f, hit] of [[p, pHit], [ai, aHit]])
    B.fx.push({ type: 'box', r: techRect(f.pos, f.facing, f.weapon, f.tech), t: 0, life: 0.7, color: f.color, hit });
  const hitTarget = (attacker, target) => {
    const dmg = WEAPONS[attacker.weapon].techs[attacker.tech].damage;
    target.hp = Math.max(0, target.hp - dmg);
    target.pose = 'hit'; target.poseT = 0; target.flash = 0.5; attacker.hits++;
    const sep = Math.abs(attacker.pos.x - target.pos.x) < 80 ? (target.isAI ? 32 : -32) : 0;
    B.floaters.push({ x: target.pos.x + sep, y: target.pos.y - 150, text: `-${dmg}`, color: '#d62f2f', size: 42, t: 0, life: 1.9 });
    for (let i = 0; i < 22; i++) {
      const a = rand(0, TAU), sp = rand(120, 380);
      B.particles.push({ x: target.pos.x, y: target.pos.y - 55, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, t: 0, life: rand(0.35, 0.75), color: Math.random() < 0.5 ? attacker.color : '#f0a500', size: rand(3, 6) });
    }
  };
  const missAt = attacker => {
    const r = techRect(attacker.pos, attacker.facing, attacker.weapon, attacker.tech);
    B.floaters.push({ x: clamp((r.x0 + r.x1) / 2, ARENA.x + 50, ARENA.x + ARENA.w - 50), y: clamp((r.y0 + r.y1) / 2, ARENA.y + 30, GROUND_Y - 20), text: 'MISS', color: '#6b7584', size: 32, t: 0, life: 1.9 });
  };
  if (pHit) hitTarget(p, ai); else missAt(p);
  if (aHit) hitTarget(ai, p); else missAt(ai);
  if (pHit || aHit) { B.shake = 0.3; Sfx.hit(); }
  if (!pHit || !aHit) Sfx.miss();

  let msg, col;
  if (pHit && aHit) { msg = '상호 명중!'; col = C.gold; }
  else if (pHit) { msg = '명중! 예측 성공'; col = C.p1; }
  else if (aHit) { msg = '피격! AI에게 읽혔다'; col = C.ai; }
  else { msg = '양측 모두 빗나감!'; col = C.sub; }
  B.resultText = { msg, col, t: 0 };
  B.log.unshift({ turn: B.turn, pHit, aHit });
  if (B.log.length > 7) B.log.pop();
  // 다음 작전 페이즈용 잔상
  B.ghost = { pos: vcopy(ai.pos), facing: ai.facing, tech: ai.tech, weapon: ai.weapon };
  B.trail.push(vcopy(ai.pos)); if (B.trail.length > 5) B.trail.shift();
}
function endClash() {
  const { p, ai } = B;
  if (p.hp <= 0 || ai.hp <= 0) {
    B.phase = 'over'; B.overT = 0;
    if (p.hp <= 0 && ai.hp <= 0) { B.result = 'draw'; p.pose = ai.pose = 'ko'; Sfx.draw(); }
    else if (ai.hp <= 0) { B.result = 'win'; ai.pose = 'ko'; p.pose = 'win'; Sfx.win(); }
    else { B.result = 'lose'; p.pose = 'ko'; ai.pose = 'win'; Sfx.lose(); }
    p.poseT = ai.poseT = 0;
    return;
  }
  beginPlan();
}

function updateBattle(dt) {
  const { p, ai } = B;
  for (const f of [p, ai]) {
    f.poseT += dt; f.flash = Math.max(0, f.flash - dt);
    f.disp = f.disp > f.hp ? Math.max(f.hp, f.disp - 45 * dt) : f.hp;
  }
  if (B.banner) { B.banner.t += dt; if (B.banner.t > 1.3) B.banner = null; }
  if (B.resultText) B.resultText.t += dt;

  if (B.phase === 'intro') {
    B.t += dt;
    if (B.t >= 1.6) beginPlan();
  } else if (B.phase === 'plan') {
    B.timer -= dt;
    const c = Math.ceil(B.timer);
    if (c !== B.lastTick) { B.lastTick = c; if (c <= 3 && c > 0) Sfx.tick(); }
    const dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    physicsStep(p, dt, { dx, jump: p.jumpQ, drop: p.dropQ });
    p.jumpQ = false; p.dropQ = false;
    if (B.timer <= 0) { B.timer = 0; startClash(); }
  } else if (B.phase === 'clash') {
    B.t += dt; const t = B.t;
    // 플레이어: 공중이면 착지할 때까지 낙하
    physicsStep(p, dt, { dx: 0, jump: false, drop: false });
    // AI: 잔상 위치 → 계획 위치로 (점프 궤적) 이동 연출
    const k = clamp(t / CL_REVEAL, 0, 1), e = easeOut(k);
    const far = Math.abs(ai.planPos.y - ai.from.y) > 2 || Math.abs(ai.planPos.x - ai.from.x) > 60;
    const arc = Math.sin(Math.PI * k) * (far ? 70 : 0);
    ai.pos = { x: lerp(ai.from.x, ai.planPos.x, e), y: lerp(ai.from.y, ai.planPos.y, e) - arc };
    ai.air = arc > 3; ai.moving = k < 1; if (ai.moving) ai.walk += dt * 14;
    if (!B.fired && t >= CL_FIRE_MIN && p.grounded) {
      B.fired = true; B.fireT = t; Sfx.swing();
      for (const f of [p, ai]) { f.pose = 'slash'; f.poseT = 0; }
    }
    if (B.fired && !B.resolved && t >= B.fireT + SWING_T * 0.8) resolveClash();
    if (B.resolved && t >= B.fireT + SWING_T + CL_AFTER) endClash();
  } else if (B.phase === 'over') {
    B.overT += dt;
  }
  B.shake = Math.max(0, B.shake - dt);
  for (const e of B.fx) e.t += dt;
  B.fx = B.fx.filter(e => e.t < e.life);
  for (const q of B.particles) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy = q.vy * 0.92 + 600 * dt; }
  B.particles = B.particles.filter(q => q.t < q.life);
  for (const fl of B.floaters) fl.t += dt;
  B.floaters = B.floaters.filter(fl => fl.t < fl.life);
}

// ----------------------------------------------------------------- 배틀 렌더링
function drawReach(spots, color, off) {
  ctx.save(); ctx.fillStyle = color;
  for (const s of spots) ctx.fillRect(s.x - 6.5, s.y + off, 13, 4);
  ctx.restore();
}
function renderBattle() {
  const { p, ai } = B;
  drawBg();
  ctx.save();
  if (B.shake > 0) ctx.translate(rand(-1, 1) * B.shake * 18, rand(-1, 1) * B.shake * 18);
  drawArenaFloor();
  ctx.save(); ctx.beginPath(); ctx.rect(ARENA.x, ARENA.y - 40, ARENA.w, ARENA.h + 40); ctx.clip();

  const plan = B.phase === 'plan';
  const clashT = B.phase === 'clash' ? B.t : 99;

  // --- 도달 가능 지점 (발판 위 띠) ---
  if (plan) {
    drawReach(B.aiReach, 'rgba(214,69,69,0.55)', 10);
    drawReach(B.pReach, 'rgba(47,111,209,0.75)', 4);
  }

  // --- 직전 턴 잔상(Ghost) ---
  const ghostAlpha = plan ? 1 : B.phase === 'clash' ? Math.max(0, 1 - clashT / 0.5) : B.phase === 'intro' ? 0.6 : 0;
  if (ghostAlpha > 0) {
    ctx.save(); ctx.globalAlpha = ghostAlpha;
    if (B.trail.length > 1) {
      ctx.strokeStyle = 'rgba(214,69,69,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
      ctx.beginPath(); B.trail.forEach((q, i) => i ? ctx.lineTo(q.x, q.y - 50) : ctx.moveTo(q.x, q.y - 50)); ctx.stroke(); ctx.setLineDash([]);
      B.trail.forEach((q, i) => {
        if (i === B.trail.length - 1) return;
        const a = 0.2 + 0.5 * (i + 1) / B.trail.length;
        ctx.fillStyle = `rgba(214,69,69,${a})`; ctx.beginPath(); ctx.arc(q.x, q.y - 50, 6, 0, TAU); ctx.fill();
        text(`-${B.trail.length - 1 - i}`, q.x, q.y - 64, 10, `rgba(180,50,50,${a + 0.2})`, 'center', 700);
      });
    }
    if (B.ghost) {
      const r = techRect(B.ghost.pos, B.ghost.facing, B.ghost.weapon, B.ghost.tech);
      drawRectArea(r, C.ai, { alpha: 0.8, fill: 0.08, dash: [8, 6], lw: 2 });
      text(`AI 직전 공격 · ${WEAPONS[B.ghost.weapon].techs[B.ghost.tech].name}`, (r.x0 + r.x1) / 2, r.y0 + 14, 11, '#b83a3a', 'center', 700);
    }
    const gp = B.ghost ? B.ghost.pos : ai.anchor, gf = B.ghost ? B.ghost.facing : ai.facing;
    ctx.globalAlpha = ghostAlpha * 0.4;
    drawStick(gp.x, gp.y, { color: C.ai, facing: gf, idle: gt });
    ctx.globalAlpha = ghostAlpha;
    ctx.strokeStyle = 'rgba(214,69,69,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.ellipse(gp.x, gp.y, 24, 7, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    text(B.ghost ? 'AI 잔상 (직전 턴)' : 'AI 시작 위치', gp.x, gp.y - 134, 12, '#b83a3a', 'center', 800);
    if (plan) text('?', gp.x, gp.y - 154 + Math.sin(gt * 3) * 2, 20, '#b83a3a', 'center', 900);
    ctx.restore();
  }

  // --- 내 공격 범위 미리보기 ---
  if (plan) {
    ctx.save(); ctx.strokeStyle = 'rgba(47,111,209,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.anchor.x - 8, p.anchor.y - 3); ctx.lineTo(p.anchor.x + 8, p.anchor.y - 3);
    ctx.moveTo(p.anchor.x, p.anchor.y - 11); ctx.lineTo(p.anchor.x, p.anchor.y + 5); ctx.stroke(); ctx.restore();
    if (inArena(mouse) && !paused) {
      const c = clickChoice(mouse);
      if (c.facing !== p.facing || c.tech !== p.tech)
        drawRectArea(techRect(p.pos, c.facing, p.weapon, c.tech), C.p1, { alpha: 0.45, fill: 0.04, dash: [4, 6], lw: 1.5 });
    }
    const r = techRect(p.pos, p.facing, p.weapon, p.tech);
    drawRectArea(r, C.p1, { fill: 0.14, lw: 2.5 });
    text(`내 공격 · ${WEAPONS[p.weapon].techs[p.tech].name}`, (r.x0 + r.x1) / 2, r.y1 - 12, 12, C.p1, 'center', 800);
    drawArrow(p.pos.x + p.facing * 22, p.pos.y - 50, p.pos.x + p.facing * 48, p.pos.y - 50, C.p1, 3, 8);
  }

  // --- 격돌: 공격 범위 경고 ---
  if (B.phase === 'clash' && !B.resolved && clashT >= CL_REVEAL * 0.8) {
    const a = clamp((clashT - CL_REVEAL * 0.8) / 0.2, 0, 1) * (0.6 + 0.4 * Math.sin(clashT * 30));
    for (const f of [p, ai]) drawRectArea(techRect(f.pos, f.facing, f.weapon, f.tech), f.color, { alpha: a, fill: 0.16, lw: 2.5 });
  }
  for (const e of B.fx) {
    const k = e.t / e.life;
    if (e.type === 'ripple') {
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = e.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, 10 + k * 40, 0, TAU); ctx.stroke(); ctx.restore();
    } else if (e.type === 'box') {
      drawRectArea(e.r, e.color, { alpha: Math.max(0, 1 - k), fill: e.hit ? 0.35 : 0.15, lw: 3 });
    }
  }

  // --- 캐릭터 ---
  const list = [p]; if (!plan) list.push(ai);
  for (const f of list) {
    const air = f.isAI ? f.air : !f.grounded;
    drawMarker(f.pos.x, f.pos.y, f.color, f.pose === 'ko' ? null : f.name, air ? 0.5 : 1, gt + (f.isAI ? 1 : 0));
    drawStick(f.pos.x, f.pos.y, {
      color: f.color, facing: f.facing, moving: f.moving, walk: f.walk, idle: gt, pose: f.pose, poseT: f.poseT,
      flash: f.flash, tech: f.tech, weapon: f.weapon, air
    });
    if (B.fired && f.pose === 'slash' && f.poseT < SWING_T + 0.25)
      drawSlashArc(f.pos, f.facing, f.tech, f.poseT / SWING_T, f.color);
  }
  if (plan) {   // 이동력 바 (머리 위)
    const k = p.stamina / STAMINA, bx = p.pos.x - 30, by = p.pos.y - 156;
    ctx.fillStyle = '#e3e7ed'; rr(bx, by, 60, 6, 3); ctx.fill();
    ctx.fillStyle = k < 0.15 ? '#e07b20' : C.p1; rr(bx, by, Math.max(3, 60 * k), 6, 3); ctx.fill();
  }
  for (const q of B.particles) {
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  for (const fl of B.floaters) {
    const k = fl.t / fl.life;
    const pop = fl.t < 0.15 ? 0.6 + fl.t / 0.15 * 0.6 : fl.t < 0.25 ? 1.2 - (fl.t - 0.15) * 2 : 1;
    ctx.save(); ctx.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1;
    ctx.translate(fl.x, fl.y - easeOut(Math.min(1, fl.t / 0.8)) * 26); ctx.scale(pop, pop);
    outlinedText(fl.text, 0, 0, fl.size, fl.color, '#ffffff', 900, 7);
    ctx.restore();
  }
  ctx.restore(); // clip

  if (B.phase === 'intro') {
    const t = B.t, s = t < 0.8 ? 'READY' : 'FIGHT!', lt = t < 0.8 ? t : t - 0.8;
    const sc = 1 + Math.max(0, 0.4 - lt) * 1.5;
    ctx.save(); ctx.translate(ARENA.x + ARENA.w / 2, ARENA.y + ARENA.h / 2 - 60); ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, lt * 5);
    outlinedText(s, 0, 0, 72, t < 0.8 ? C.text : C.gold, '#ffffff', 900, 12);
    ctx.restore();
  }
  if (B.banner && !(B.resultText && B.phase === 'clash')) {
    const t = B.banner.t;
    const a = t < 0.2 ? t / 0.2 : t > 1.0 ? Math.max(0, (1.3 - t) / 0.3) : 1;
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + 50, bw = 380;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; rr(cx - bw / 2, cy - 30, bw, 60, 12); ctx.fill();
    ctx.strokeStyle = B.banner.color; ctx.lineWidth = 2.5; ctx.stroke();
    text(B.banner.text, cx, cy - 8, 26, B.banner.color, 'center', 900);
    text(B.banner.sub, cx, cy + 16, 12, C.sub, 'center', 600);
    ctx.restore();
  }
  if (B.resultText && B.phase === 'clash') {
    const t = B.resultText.t, a = Math.min(1, t * 6) * (t > 1.7 ? Math.max(0, (1.95 - t) / 0.25) : 1);
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + 50;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,0.96)'; rr(cx - 170, cy - 26, 340, 52, 12); ctx.fill();
    ctx.strokeStyle = B.resultText.col; ctx.lineWidth = 2.5; ctx.stroke();
    text(B.resultText.msg, cx, cy + 1, 24, B.resultText.col, 'center', 900);
    ctx.restore();
  }
  ctx.restore(); // shake

  renderHud();
  renderSidePanels();
  if (B.phase === 'over') renderOver();
}

function renderHud() {
  const { p, ai } = B;
  ctx.save();

function miniStage(x, y, w, h, plats = []) {
  ctx.fillStyle = C.paper; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (let gx = x + 30; gx < x + w; gx += 30) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
  ctx.stroke();
  drawPlatform(x, x + w, y + h - 40, true, y + h);
  plats.forEach(([a, b, py]) => drawPlatform(x + a, x + b, y + py, false));
  ctx.strokeStyle = '#3a4352'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  return y + h - 40;
}
const SC = 0.8;   // 튜토리얼 캐릭터 크기
function miniRect(pos, facing, tech, sc = SC) {
  const b = WEAPONS.sword.techs[tech].box;
  const x0 = facing > 0 ? pos.x + b[0] * sc : pos.x - b[1] * sc, x1 = facing > 0 ? pos.x + b[1] * sc : pos.x - b[0] * sc;
  return { x0, x1, y0: pos.y + b[2] * sc, y1: pos.y + b[3] * sc };
}

    const rows = wrapText(ln, tw - 40);
    ctx.fillStyle = i === 0 ? C.gold : C.p1;
    ctx.beginPath(); ctx.arc(tx + 8, ty + 12, 5, 0, TAU); ctx.fill();
    rows.forEach((r, j) => text(r, tx + 28, ty + 12 + j * 30, 18, i === 0 ? C.text : '#3d4756', 'left', i === 0 ? 700 : 500));
    ty += rows.length * 30 + 22;
  });
  ctx.restore();
  for (let i = 0; i < TUT_PAGES.length; i++) {
    ctx.fillStyle = i === tutPage ? C.gold : '#c3ccd8';
    ctx.beginPath(); ctx.arc(340 - (TUT_PAGES.length - 1) * 10 + i * 20, 640, i === tutPage ? 6 : 4, 0, TAU); ctx.fill();
  }
  button(680, 620, 150, 46, '이전', () => tutGo(-1), { size: 16, disabled: tutPage === 0 });
  if (tutPage < TUT_PAGES.length - 1) button(1090, 620, 150, 46, '다음', () => tutGo(1), { style: 'primary', size: 16 });
  else button(1040, 620, 200, 46, '연습 대전 시작', () => startBattle(), { style: 'primary', size: 16 });
  text('← → 키로 페이지 이동', 960, 690, 11, C.dim, 'center', 600);
  button(14, 670, 104, 38, '홈으로', () => goHome(), { size: 15, style: 'ghost' });
  button(126, 670, 112, 38, '일시정지', () => { paused = true; }, { size: 15, style: 'ghost' });
}

// ----------------------------------------------------------------- 일시정지
function renderPause() {
  ctx.fillStyle = 'rgba(25,30,40,0.5)'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, inBattle = scene === 'battle';
  const ph = inBattle ? 330 : 260;
  ctx.fillStyle = C.panel; rr(cx - 200, cy - ph / 2, 400, ph, 18); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C.text; rr(cx - 16, cy - ph / 2 + 26, 10, 30, 3); ctx.fill(); rr(cx + 6, cy - ph / 2 + 26, 10, 30, 3); ctx.fill();
  text('일시정지', cx, cy - ph / 2 + 82, 26, C.text, 'center', 900);
  let y = cy - ph / 2 + 112;
  button(cx - 140, y, 280, 50, '계속하기', () => { paused = false; }, { style: 'primary', size: 18, sub: 'ESC' }); y += 62;
  if (inBattle) { button(cx - 140, y, 280, 50, '다시 시작', () => startBattle(), { size: 18 }); y += 62; }
  button(cx - 140, y, 280, 50, '홈으로 나가기', () => goHome(), { size: 18, style: 'danger' });
}

// ----------------------------------------------------------------- 메인 루프 (고정 60Hz + Delta Time)
function update(dt) {
  gt += dt;
  if (toast) { toast.t += dt; if (toast.t > toast.life) toast = null; }
  if (paused) return;
  if (scene === 'battle' && B) updateBattle(dt);
  else if (scene === 'tutorial') tutT += dt;
}
function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  buttons = []; hoverAny = false;
  if (scene === 'home') renderHome();
  else if (scene === 'battle') renderBattle();
  else if (scene === 'tutorial') renderTutorial();
  if (paused) { buttons = []; hoverAny = false; renderPause(); }
  if (toast) {
    const k = toast.t, a = Math.min(1, k * 6) * Math.min(1, (toast.life - k) * 4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = font(18, 700);
    const tw = ctx.measureText(toast.msg).width + 56;
    const ty = scene === 'home' ? 452 : 160;
    ctx.fillStyle = '#ffffff'; rr(W / 2 - tw / 2, ty - 25, tw, 50, 25); ctx.fill();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
    text(toast.msg, W / 2, ty, 18, C.gold, 'center', 800);
    ctx.restore();
  }
  const aiming = scene === 'battle' && B && B.phase === 'plan' && !paused && inArena(mouse);
  cv.style.cursor = hoverAny ? 'pointer' : aiming ? 'crosshair' : 'default';
}
const STEP = 1 / 60;
let lastT = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;           // 탭 전환 등 큰 지연 보호
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 20) { update(STEP); acc -= STEP; n++; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && ((scene === 'battle' && B && B.phase !== 'over') || scene === 'tutorial')) paused = true;
});
window.__mc = { get B() { return B; }, get scene() { return scene; } };
</script>
