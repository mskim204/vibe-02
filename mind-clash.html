<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마인드 클래시 - 예측 심리전 격투</title>
<style>
  html, body { margin: 0; height: 100%; background: #d9dfe7; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   마인드 클래시 (MIND CLASH) - 2D 횡스크롤 턴제 예측 심리전 격투
   - 옆에서 보는 시점: 좌우 이동 + 점프 + 발판(발판 위에 서 있어야 높은 곳에 있을 수 있음)
   - 공격: 바라보는 방향으로 검 휘두르기 (횡베기 / 올려베기 / 내려베기)
   - 모든 그래픽은 Canvas 2D로 직접 그림 (이미지/이모지 미사용)
   - 사운드는 Web Audio API 합성음
   - 고정 60Hz 업데이트(Delta Time 누적) + requestAnimationFrame 렌더링
   ========================================================================= */

// ----------------------------------------------------------------- 기본 설정
const W = 1280, H = 720;
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize);
resize();

const FONT = "'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif";
const font = (size, weight = 600) => `${weight} ${size}px ${FONT}`;

// 차분한 플랫 팔레트 (네온/글로우 없음)
const C = {
  bg1: '#eef1f5', bg2: '#dde3ea', panel: '#ffffff', panel2: '#f2f4f7', line: '#d0d7e0',
  text: '#1f2733', sub: '#5d6878', dim: '#98a2b0',
  p1: '#2f6fd1', ai: '#d64545', gold: '#c98a10', green: '#2f9e5b',
  paper: '#f8f6f1', grid: 'rgba(60,70,90,0.055)',
  wood: '#b48c63', woodTop: '#c9a37a', woodDark: '#7d5f40',
  dirt: '#8f7658', dirtDark: '#76603f', grass: '#77a058',
  steel: '#cdd3da', steelDark: '#4b5360', hilt: '#6b4a2b'
};

// ----------------------------------------------------------------- 게임 규칙 상수
const ARENA = { x: 252, y: 112, w: 776, h: 550 };   // 경기장
const GROUND_Y = 636;      // 바닥 높이(발 위치)
const BODY_W = 32, BODY_H = 100;   // 피격 판정 박스(발 기준)
const GRAVITY = 2400;
const JUMP_V = Math.sqrt(2 * GRAVITY * 150);   // 최대 점프 높이 150
const SPEED = 260;         // 좌우 이동 속도(px/s)
const STAMINA = 320;       // 한 턴 이동력 (이동 1px = 1, 점프 1회 = 50)
const JUMP_COST = 50;
const PLAN_TIME = 10;      // 작전 페이즈 제한 시간(초)
const MAX_HP = 100;

// 발판: 바닥(0층) + 1~2층 발판 (아래에서 점프로 통과, S로 내려가기)
const SURFACES = [
  { x0: ARENA.x, x1: ARENA.x + ARENA.w, y: GROUND_Y, lvl: 0, ground: true },
  { x0: 300, x1: 470, y: 512, lvl: 1 },
  { x0: 810, x1: 980, y: 512, lvl: 1 },
  { x0: 530, x1: 750, y: 388, lvl: 2 }
];

// 격돌 페이즈 타임라인(초)
const CL_REVEAL = 0.5;     // AI가 최종 위치로 이동하는 연출
const CL_FIRE_MIN = 0.85;  // 동시 공격 (착지 이후)
const SWING_T = 0.22;      // 검 휘두르는 시간
const CL_AFTER = 2.0;      // 판정 후 결과 확인 시간

// ----------------------------------------------------------------- 유틸
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const vcopy = v => ({ x: v.x, y: v.y });
const easeOut = t => 1 - Math.pow(1 - t, 3);
const inRect = (p, x, y, w, h) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
const inArena = p => inRect(p, ARENA.x, ARENA.y, ARENA.w, ARENA.h);
const gaussW = (d, s) => Math.exp(-(d * d) / (2 * s * s));
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(str, maxW) {
  const out = []; let line = '';
  for (const ch of str) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) {
      const sp = line.lastIndexOf(' ');
      if (sp > 0 && line.length - sp < 10) { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
      else { out.push(line); line = ch; }
    } else line = test;
  }
  if (line) out.push(line);
  return out;
}
function text(str, x, y, size, color, align = 'left', weight = 600) {
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function outlinedText(str, x, y, size, fill, stroke, weight = 900, lw = 6) {
  ctx.font = font(size, weight); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

// ----------------------------------------------------------------- 사운드 (Web Audio 합성)
const Sfx = {
  ac: null, master: null, noiseBuf: null,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    try {
      this.ac = new A();
      this.master = this.ac.createGain(); this.master.gain.value = 0.55;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  tone(f, d, { type = 'sine', vol = 0.3, to = null, delay = 0, attack = 0.005 } = {}) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, { vol = 0.3, freq = 1000, to = null, type = 'bandpass', q = 1, delay = 0 } = {}) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + d);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, rand(0, 0.5)); s.stop(t + d + 0.05);
  },
  ui() { this.tone(640, 0.06, { type: 'square', vol: 0.05 }); },
  aim() { this.tone(1250, 0.05, { type: 'square', vol: 0.07 }); this.tone(1900, 0.06, { vol: 0.07, delay: 0.035 }); },
  jump() { this.tone(300, 0.12, { type: 'triangle', vol: 0.12, to: 620 }); },
  land() { this.noise(0.06, { vol: 0.12, freq: 400, type: 'lowpass' }); },
  swing() { this.noise(0.28, { vol: 0.4, freq: 900, to: 4500, q: 2 }); this.tone(220, 0.15, { type: 'triangle', vol: 0.06, to: 520 }); },
  hit() {
    this.tone(1400, 0.12, { type: 'square', vol: 0.08, to: 700 });
    this.tone(140, 0.3, { type: 'square', vol: 0.2, to: 45 });
    this.tone(80, 0.4, { vol: 0.4, to: 35 });
    this.noise(0.22, { vol: 0.5, freq: 1600, to: 300, type: 'lowpass' });
  },
  miss() { this.tone(520, 0.2, { type: 'triangle', vol: 0.12, to: 240 }); this.noise(0.15, { vol: 0.08, freq: 3500, type: 'highpass' }); },
  tick() { this.tone(1000, 0.08, { type: 'square', vol: 0.08 }); },
  ready() { this.tone(520, 0.09, { type: 'triangle', vol: 0.2 }); this.tone(780, 0.14, { type: 'triangle', vol: 0.2, delay: 0.08 }); },
  err() { this.tone(190, 0.16, { type: 'square', vol: 0.1 }); },
  shot() { this.noise(0.18, { vol: 0.6, freq: 1800, to: 300, type: 'lowpass' }); this.tone(120, 0.15, { type: 'square', vol: 0.2, to: 50 }); },
  load() { this.tone(900, 0.05, { type: 'square', vol: 0.08 }); this.tone(600, 0.06, { type: 'square', vol: 0.08, delay: 0.08 }); },
  heal() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, { type: 'sine', vol: 0.15, delay: i * 0.07 })); },
  guard() { this.tone(1600, 0.25, { type: 'triangle', vol: 0.15, to: 900 }); this.noise(0.1, { vol: 0.2, freq: 3000, type: 'highpass' }); },
  phase() { this.tone(330, 0.12, { type: 'triangle', vol: 0.12 }); this.tone(495, 0.16, { type: 'triangle', vol: 0.12, delay: 0.07 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.22, delay: i * 0.12 })); },
  lose() { [440, 370, 311, 220].forEach((f, i) => this.tone(f, 0.35, { type: 'sawtooth', vol: 0.08, delay: i * 0.16 })); },
  draw() { [440, 440, 554].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', vol: 0.18, delay: i * 0.15 })); }
};

// ----------------------------------------------------------------- 무기/기술 시스템 (확장 구조)
/*  무기(WEAPONS)는 여러 '기술(techs)'을 가지며, 각 기술은
    - box  : 발 위치 기준, '바라보는 방향' 쪽으로 [앞 시작, 앞 끝, 위(-)~아래(+) 시작, 끝] 공격 판정 박스
    - swing: 휘두르는 각도(시작, 끝) — 애니메이션용
    - damage
    추후 [무기 설정]에서 fighter.weapon 값만 바꾸면 공격 범위/모양/대미지가 교체된다.        */
const WEAPONS = {
  sword: {
    id: 'sword', name: '검', locked: false, desc: '균형 잡힌 근접 무기', blade: 60,
    techs: {
      mid:  { name: '횡베기',   key: '1', box: [0, 175, -118, -2],  swing: [-1.7, 0.7], damage: 25, desc: '같은 높이의 정면' },
      up:   { name: '올려베기', key: '2', box: [-10, 150, -262, -104], swing: [1.1, -2.0], damage: 25, desc: '한 층 위만 (같은 층 X)' },
      down: { name: '내려베기', key: '3', box: [-10, 150, 6, 140],  swing: [-1.5, 1.6], damage: 25, desc: '한 층 아래만 (같은 층 X)' }
    }
  }
};
const TECH_ORDER = ['mid', 'up', 'down'];

// ----------------------------------------------------------------- 무기 설정 (로드아웃)
/* 기본 무기 1개(검, 고정) + 특수 스킬 2칸. 각 특수 스킬은 정해진 칸(slot 0 = 1번 칸, 1 = 2번 칸)에만 장착된다.
   규칙: 특수 스킬을 쓰는 턴에는 검 공격을 할 수 없고, 다 쓴 특수 스킬은 SP_COOLDOWN 턴 동안 다시 쓸 수 없다. */
const SP_COOLDOWN = 2, HEAL_TURNS = 3, HEAL_AMOUNT = 50, GUN_MAX = 3, COUNTER_DMG = 10, BUFF_MULT = 1.5;
const SHOTGUN_DMG = [[50, 50], [85, 38], [999, 25]];   // [거리 이하, 대미지]
const SPECIALS = {
  heal:  { id: 'heal',  slot: 0, name: '회복',      color: '#2f9e5b', desc: `${HEAL_TURNS}턴 연속 모으면 체력 +${HEAL_AMOUNT}`,
           detail: '모으는 중에 맞거나 다른 행동을 하면 처음부터' },
  guard: { id: 'guard', slot: 0, name: '철벽 방어', color: '#b07a0e', desc: `앞쪽 공격을 막고 반격 ${COUNTER_DMG}`,
           detail: '막아 내면 공격한 상대에게 작은 반격 · 등 뒤 공격은 막지 못함' },
  buff:  { id: 'buff',  slot: 0, name: '버프',      color: '#d4880f', desc: `다음 공격 대미지 ${BUFF_MULT}배`,
           detail: '한 턴 기를 모음 · 검, 랜덤 건, 샷건, 회전 베기 모두 강해짐 · 공격 1번에 사라짐' },
  gun:   { id: 'gun',   slot: 1, name: '랜덤 건',   color: '#7a4fd1', desc: `장전(최대 ${GUN_MAX}발) 후 발사 · 같은 층 멀리`,
           detail: '대미지 25부터 무작위, 탄이 많을수록 최대치 증가 · 장전 중 맞으면 탄 초기화', box: [0, 390, -95, -20] },
  whirl: { id: 'whirl', slot: 1, name: '회전 베기', color: '#c2551f', desc: '같은 층 양옆을 동시에 벰 · 대미지 20',
           detail: '상대가 어느 쪽에 있을지 모를 때', box: [-140, 140, -118, -2], damage: 20 },
  shotgun: { id: 'shotgun', slot: 1, name: '샷건', color: '#5b6b7d', desc: '범위는 짧지만 가까울수록 매우 강함',
           detail: `같은 층 정면 120 · 거리 ${SHOTGUN_DMG[0][0]} 이내 ${SHOTGUN_DMG[0][1]} / ${SHOTGUN_DMG[1][0]} 이내 ${SHOTGUN_DMG[1][1]} / 그 밖 ${SHOTGUN_DMG[2][1]}`, box: [0, 120, -118, -2] }
};
const LOADOUT_KEY = 'mindclash.loadout.v2';
const loadout = { base: 'sword', special: ['heal', 'gun'] };
const validSpecial = (id, slot) => !!(id && SPECIALS[id] && SPECIALS[id].slot === slot);
(function loadLoadout() {
  try {
    const d = JSON.parse(localStorage.getItem(LOADOUT_KEY) || 'null');
    if (d && Array.isArray(d.special)) loadout.special = [0, 1].map(i => validSpecial(d.special[i], i) ? d.special[i] : null);
  } catch (e) {}
})();
function saveLoadout() { try { localStorage.setItem(LOADOUT_KEY, JSON.stringify(loadout)); } catch (e) {} }
function setSpecial(slot, id) {
  if (id !== null && !validSpecial(id, slot)) return;   // 각 특수 스킬은 자기 칸에만
  loadout.special[slot] = id; saveLoadout();
}
const specialName = id => (id && SPECIALS[id] ? SPECIALS[id].name : '없음');
function techRect(pos, facing, weaponId, techId) {
  const b = WEAPONS[weaponId].techs[techId].box;
  const x0 = facing > 0 ? pos.x + b[0] : pos.x - b[1];
  const x1 = facing > 0 ? pos.x + b[1] : pos.x - b[0];
  return { x0, x1, y0: pos.y + b[2], y1: pos.y + b[3] };
}
const bodyRect = pos => ({ x0: pos.x - BODY_W / 2, x1: pos.x + BODY_W / 2, y0: pos.y - BODY_H, y1: pos.y });
const overlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
function boxRect(pos, facing, b) {
  const x0 = facing > 0 ? pos.x + b[0] : pos.x - b[1], x1 = facing > 0 ? pos.x + b[1] : pos.x - b[0];
  return { x0, x1, y0: pos.y + b[2], y1: pos.y + b[3] };
}
// ---- 이번 턴 행동 (검 기술 또는 특수 스킬) ----
const actOf = f => f.action || { kind: 'basic' };
function actSpecial(f) { const a = actOf(f); return a.kind === 'special' ? SPECIALS[f.specials[a.slot]] || null : null; }
function canUseSpecial(f, slot, mode) {
  const id = f.specials[slot];
  if (!validSpecial(id, slot) || f.cd[slot] > 0) return false;
  if (id === 'gun') return mode === 'fire' ? f.ammo > 0 : f.ammo < GUN_MAX;
  if (id === 'buff') return !f.buff;
  return true;
}
function actionRects(f) {
  const a = actOf(f);
  if (a.kind === 'basic') return [techRect(f.pos, f.facing, f.weapon, f.tech)];
  const sp = actSpecial(f);
  if (!sp) return [];
  if ((sp.id === 'gun' && a.mode === 'fire') || sp.id === 'whirl' || sp.id === 'shotgun') return [boxRect(f.pos, f.facing, sp.box)];
  return [];
}
function actionName(f) {
  const a = actOf(f), sp = actSpecial(f);
  if (!sp) return WEAPONS[f.weapon].techs[f.tech].name;
  if (sp.id === 'heal') return `회복 모으기 ${Math.min(HEAL_TURNS, f.healCharge + 1)}/${HEAL_TURNS}`;
  if (sp.id === 'gun') return a.mode === 'fire' ? `랜덤 건 발사 (${f.ammo}발)` : `랜덤 건 장전 (${Math.min(GUN_MAX, f.ammo + 1)}발째)`;
  if (sp.id === 'buff') return `버프 (다음 공격 ${BUFF_MULT}배)`;
  return sp.name;
}
function actionShort(f) {
  const a = actOf(f), sp = actSpecial(f);
  if (!sp) return null;
  return { heal: '회복', guard: '방어', buff: '버프', whirl: '회전', shotgun: '샷건' }[sp.id] || (a.mode === 'fire' ? '발사' : '장전');
}
// 같은 문자열 → 같은 난수 (온라인에서 양쪽이 같은 랜덤 대미지를 얻도록)
function seededRand(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  let t = (h + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gunDamageRange(n) { return [25, 25 + 15 * n]; }
function shotgunDamage(d) { for (const [maxD, dmg] of SHOTGUN_DMG) if (d <= maxD) return dmg; return SHOTGUN_DMG[2][1]; }
function actionDamage(f, key, target) {
  const sp = actSpecial(f);
  if (!sp) return WEAPONS[f.weapon].techs[f.tech].damage;
  if (sp.id === 'whirl') return sp.damage;
  if (sp.id === 'shotgun') return shotgunDamage(Math.abs(target.pos.x - f.pos.x));
  const [lo, hi] = gunDamageRange(Math.max(1, f.ammo));
  const r = key ? seededRand(key) : Math.random();
  return lo + Math.floor(r * (hi - lo + 1));
}
// 철벽 방어: 방어자가 바라보는 쪽(또는 거의 같은 위치)에서 온 공격을 막음
function guarding(def, att) {
  const sp = actSpecial(def);
  if (!sp || sp.id !== 'guard') return false;
  const dx = att.pos.x - def.pos.x;
  return Math.abs(dx) < 12 || Math.sign(dx) === def.facing;
}

function drawRectArea(r, color, { alpha = 1, fill = 0.15, dash = null, lw = 2.5 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = color; ctx.globalAlpha *= fill;
  rr(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0, 8); ctx.fill();

  ctx.setLineDash([2, 8]); ctx.strokeStyle = 'rgba(60,70,90,0.12)';
  for (const s of SURFACES) if (!s.ground) { ctx.beginPath(); ctx.moveTo(a.x, s.y); ctx.lineTo(a.x + a.w, s.y); ctx.stroke(); }
  ctx.setLineDash([]);
  SURFACES.forEach(s => drawPlatform(s.x0, s.x1, s.y, s.ground, a.y + a.h));
  ctx.strokeStyle = '#3a4352'; ctx.lineWidth = 3; ctx.strokeRect(a.x, a.y, a.w, a.h);
  for (const s of SURFACES) if (!s.ground) text(`${s.lvl}층`, a.x + 8, s.y - 10, 10, 'rgba(60,70,90,0.4)', 'left', 700);
  ctx.restore();
}

// ----------------------------------------------------------------- 지형/이동 계산
function surfaceAt(pos) {
  for (let i = 0; i < SURFACES.length; i++) {
    const s = SURFACES[i];
    if (Math.abs(pos.y - s.y) < 1.5 && pos.x >= s.x0 - 1 && pos.x <= s.x1 + 1) return i;
  }
  return -1;
}
function levelOf(pos) {
  const i = surfaceAt(pos);
  return i >= 0 ? SURFACES[i].lvl : Math.max(0, Math.round((GROUND_Y - pos.y) / 124));
}
function surfaceBelow(x, y) {
  let best = -1;
  SURFACES.forEach((s, i) => { if (s.y > y + 1 && x >= s.x0 && x <= s.x1 && (best < 0 || s.y < SURFACES[best].y)) best = i; });
  return best;
}
const wallL = ARENA.x + BODY_W / 2 + 2, wallR = ARENA.x + ARENA.w - BODY_W / 2 - 2;

// 물리: 좌우 이동(이동력 소모), 점프(이동력 소모), 아래로 내려가기, 중력/착지
function physicsStep(f, dt, inp) {
  if (inp.dx && f.stamina > 0) {
    const mv = Math.min(SPEED * dt, f.stamina);
    const nx = clamp(f.pos.x + inp.dx * mv, wallL, wallR);
    f.stamina -= Math.abs(nx - f.pos.x);
    f.pos.x = nx; f.facing = inp.dx;
    if (f.grounded) f.walk += dt * 11;
    f.moving = true;
  } else f.moving = false;
  if (inp.jump && f.grounded) {
    if (f.stamina >= JUMP_COST) { f.vy = -JUMP_V; f.grounded = false; f.stamina -= JUMP_COST; if (!f.silent) Sfx.jump(); }
    else if (!f.isAI) showToast('이동력이 부족해 점프할 수 없습니다', 1.2);
  }
  if (inp.drop && f.grounded) {
    const si = surfaceAt(f.pos);
    if (si >= 0 && !SURFACES[si].ground) { f.grounded = false; f.vy = 60; f.dropFrom = si; f.dropT = 0.22; }
  }
  if (f.grounded && surfaceAt(f.pos) < 0) { f.grounded = false; f.vy = 0; }   // 발판 끝에서 걸어 나감
  if (!f.grounded) {
    const prevY = f.pos.y;
    f.vy += GRAVITY * dt; f.pos.y += f.vy * dt;
    if (f.pos.y - BODY_H < ARENA.y + 4) { f.pos.y = ARENA.y + 4 + BODY_H; if (f.vy < 0) f.vy = 0; }
    if (f.vy >= 0) {
      let land = -1;
      SURFACES.forEach((s, i) => {
        if (f.dropT > 0 && i === f.dropFrom) return;
        if (prevY <= s.y + 0.5 && f.pos.y >= s.y && f.pos.x >= s.x0 && f.pos.x <= s.x1) {
          if (land < 0 || s.y < SURFACES[land].y) land = i;
        }
      });
      if (land >= 0) { f.pos.y = SURFACES[land].y; f.vy = 0; f.grounded = true; if (!f.silent) Sfx.land(); }
    }
  }
  f.dropT -= dt;
}

/* 도달 가능 지점 계산 (AI 계획 & 화면 표시용)
   - 같은 발판 위 이동: 거리만큼 이동력
   - 점프로 한 층 위: 50 + 수평 거리 (수평 70px 이내)
   - 내려가기/떨어지기: 0                                             */
let SPOTS = null;
function buildSpots() {
  SPOTS = [];
  SURFACES.forEach((s, i) => {
    const a = s.ground ? wallL : s.x0 + 4, b = s.ground ? wallR : s.x1 - 4;
    const n = Math.max(1, Math.round((b - a) / 12));
    for (let k = 0; k <= n; k++) SPOTS.push({ si: i, x: a + (b - a) * k / n, y: s.y });
  });
  SPOTS.forEach(sp => { sp.nb = []; });
  SPOTS.forEach((a, ia) => {
    const sa = SURFACES[a.si];
    SPOTS.forEach((b, ib) => {
      if (ia === ib) return;
      const dx = Math.abs(a.x - b.x);
      if (a.si === b.si && dx <= 13) a.nb.push([ib, dx]);
      const sb = SURFACES[b.si];
      if (sb.y < sa.y && sa.y - sb.y <= 140 && dx <= 70) a.nb.push([ib, JUMP_COST + dx]);
    });
    if (!sa.ground) {
      for (const x of [a.x, sa.x0 - 22, sa.x1 + 22]) {
        const extra = Math.abs(a.x - x);
        if (extra > 30) continue;
        const bi = surfaceBelow(clamp(x, wallL, wallR), sa.y);
        if (bi < 0) continue;
        let best = -1, bd = 1e9;
        SPOTS.forEach((c, ic) => { if (c.si === bi && Math.abs(c.x - x) < bd) { bd = Math.abs(c.x - x); best = ic; } });
        if (best >= 0) a.nb.push([best, extra]);
      }
    }
  });
}
function reachFrom(pos) {
  if (!SPOTS) buildSpots();
  let si = surfaceAt(pos);
  if (si < 0) si = surfaceBelow(pos.x, pos.y - 1);
  if (si < 0) si = 0;
  const cost = new Array(SPOTS.length).fill(Infinity), done = new Array(SPOTS.length).fill(false);
  SPOTS.forEach((sp, i) => { if (sp.si === si) cost[i] = Math.abs(sp.x - pos.x); });
  for (;;) {
    let u = -1, bc = Infinity;
    for (let i = 0; i < cost.length; i++) if (!done[i] && cost[i] < bc) { bc = cost[i]; u = i; }
    if (u < 0 || bc > STAMINA) break;
    done[u] = true;
    for (const [v, c] of SPOTS[u].nb) if (cost[u] + c < cost[v]) cost[v] = cost[u] + c;
  }
  return SPOTS.map((sp, i) => ({ x: sp.x, y: sp.y, si: sp.si, cost: cost[i] })).filter(s => s.cost <= STAMINA);
}

function goHome() { if (B && B.online) netLeave(); netCancelRoom(); scene = 'home'; paused = false; B = null; releaseAllHolds(); }

}

const OPP = () => (B && B.online ? '상대' : 'AI');
const ME = () => (B && B.online ? '나' : '1P');

function onKeyPress(k) {
  if (k === 'Escape') {
    if ((scene === 'battle' && B && B.phase !== 'over') || scene === 'tutorial') { paused = !paused; Sfx.ui(); }
    else if (scene === 'online') { netCancelRoom(); goHome(); }
    else if (scene === 'loadout') goHome();
    return;
  }
  if (paused) return;
  if (scene === 'battle' && B) {
    if (B.phase === 'plan') {
      if (k === 'Space') playerReady();
      if (k === 'KeyW' || k === 'ArrowUp') B.p.jumpQ = true;
      if (k === 'KeyS' || k === 'ArrowDown') B.p.dropQ = true;
      if (k === 'KeyQ') setFacing(-1);
      if (k === 'KeyE') setFacing(1);
      if (k === 'Digit1' || k === 'Numpad1') setTech('mid');
      if (k === 'Digit2' || k === 'Numpad2') setTech('up');
      if (k === 'Digit3' || k === 'Numpad3') setTech('down');
      if (k === 'Digit4' || k === 'Numpad4') selectSpecial(0);
      if (k === 'Digit5' || k === 'Numpad5') selectSpecial(1);
    }
    if (k === 'KeyR' && B.phase === 'over' && B.overT > 1 && !B.online) startBattle();
  } else if (scene === 'loadout') {
    if (k === 'Digit1' || k === 'Numpad1') loSlot = 0;
    if (k === 'Digit2' || k === 'Numpad2') loSlot = 1;
  } else if (scene === 'tutorial') {
    if (k === 'ArrowRight' || k === 'KeyD' || k === 'Enter') tutGo(1);
    if (k === 'ArrowLeft' || k === 'KeyA') tutGo(-1);
  }
}

  B.trail.push(vcopy(B.ai.pos));

}
function beginPlan() {
  const { p, ai } = B;

  p.anchor = vcopy(p.pos); ai.anchor = vcopy(ai.pos);

// 경기장 클릭: 클릭한 쪽으로 방향 전환 + 높이에 따라 기술 선택

}
function battleClick(pt) {

/* ---------- 연습 대전 AI ----------
   1) 플레이어가 이번 턴 도달 가능한 지점들 중 어디에 설지 확률 분포를 만든다.
      (제자리 습관, 과거 이동 습관(상대 쪽으로 몇 px / 몇 층), AI 잔상 쪽으로 접근하는 경향, 기본 확률)
   2) 그 분포에서 시나리오 40개를 뽑고, 플레이어의 방향(대개 AI 잔상 쪽)과 기술(높이 차이 + 과거 기술 습관)을 추정한다.
   3) AI 자신이 도달 가능한 모든 지점 × 방향 2 × 기술 3 조합에 대해
      '명중 확률'과 '피격 위험'을 계산해 점수를 매기고, 상위 몇 개 중 하나를 고른다.             */
function aiDecide() {
  const { ai, p, hist } = B;
  const recent = hist.slice(-5);
  const side = Math.sign(ai.anchor.x - p.anchor.x) || 1;     // 플레이어 → AI 방향
  const pLvl = levelOf(p.anchor), aLvl = levelOf(ai.anchor);
  // --- 1. 플레이어 위치 분포 ---
  const stayRate = hist.length ? hist.filter(h => Math.abs(h.dx) < 25 && h.dLvl === 0).length / hist.length : 0.2;
  let habit = null;
  if (recent.length) {
    const ax = recent.reduce((s, h) => s + h.dx, 0) / recent.length;
    const al = recent.reduce((s, h) => s + h.dLvl, 0) / recent.length;
    habit = { x: p.anchor.x + ax * side, lvl: pLvl + Math.round(al) };
  }
  const pSpots = B.pReach.map(sp => {
    const lv = SURFACES[sp.si].lvl;
    let w = 0.2;
    w += (0.4 + stayRate * 2) * gaussW(sp.x - p.anchor.x, 35) * (lv === pLvl ? 1 : 0.2);
    if (habit) w += 1.4 * gaussW(sp.x - habit.x, 60) * (lv === habit.lvl ? 1 : 0.3);
    // AI 잔상을 공격할 수 있는 자리로 접근하는 경향
    w += 0.7 * gaussW(Math.abs(sp.x - ai.anchor.x) - 90, 50) * (Math.abs(lv - aLvl) <= 1 ? 1 : 0.3);
    return { sp, w };
  });
  const totalW = pSpots.reduce((s, q) => s + q.w, 0);
  const techFreq = { mid: 1, up: 1, down: 1 };
  recent.forEach(h => { techFreq[h.tech] += 1.2; });
  const towardRate = recent.length ? recent.filter(h => h.toward).length / recent.length : 0.75;
  const samples = [];
  for (let n = 0; n < 40; n++) {
    let r = Math.random() * totalW, pick = pSpots[0];
    for (const q of pSpots) { r -= q.w; if (r <= 0) { pick = q; break; } }
    const pos = { x: pick.sp.x, y: pick.sp.y };
    const toward = Math.random() < clamp(towardRate, 0.4, 0.92);
    const facing = (Math.sign(ai.anchor.x - pos.x) || 1) * (toward ? 1 : -1);
    // 기술: AI 잔상과의 층 차이로 '정석' 기술을 예상하되, 플레이어의 과거 기술 습관도 섞는다
    const dl = aLvl - SURFACES[pick.sp.si].lvl;
    let tech = dl > 0 ? 'up' : dl < 0 ? 'down' : 'mid';
    if (Math.random() < 0.35) {
      const tw = techFreq.mid + techFreq.up + techFreq.down; const r2 = Math.random() * tw;
      tech = r2 < techFreq.mid ? 'mid' : r2 < techFreq.mid + techFreq.up ? 'up' : 'down';
    }
    samples.push({ pos, facing, tech });
  }
  // --- 2. AI 후보 평가 ---
  const aggr = 0.25 + (ai.hp < p.hp ? 0.2 : 0) + (B.turn > 6 ? 0.1 : 0);
  const cands = [];
  const hitProb = r => { let h = 0; for (const s of samples) if (overlap(r, bodyRect(s.pos))) h++; return h / samples.length; };
  const toward = pos => (Math.sign(p.anchor.x - pos.x) || 1);
  const avail = slot => ai.specials[slot] && ai.cd[slot] === 0;
  const gunSlot = ai.specials.indexOf('gun'), whirlSlot = ai.specials.indexOf('whirl'), sgSlot = ai.specials.indexOf('shotgun');
  const mult = ai.buff ? BUFF_MULT : 1;
  let safest = null;
  for (const sp of B.aiReach) {
    const pos = { x: sp.x, y: sp.y }, body = bodyRect(pos);
    let danger = 0, front = 0;
    for (const s of samples) if (overlap(techRect(s.pos, s.facing, 'sword', s.tech), body)) { danger++; if (Math.sign(s.pos.x - pos.x) === toward(pos)) front++; }
    danger /= samples.length; front /= samples.length;
    const base = rand(0, 0.12) - Math.abs(pos.x - p.anchor.x) * 0.00025 - sp.cost * 0.00008;
    if (!safest || danger + sp.cost * 0.0002 < safest.danger + safest.cost * 0.0002) safest = { pos, danger, front, cost: sp.cost };
    for (const facing of [-1, 1]) {
      for (const tech of TECH_ORDER) {
        const hit = hitProb(techRect(pos, facing, ai.weapon, tech));
        cands.push({ pos, facing, tech, action: { kind: 'basic' }, score: hit * mult * (1 + aggr) - danger * (1.15 - aggr) + base });
      }
      if (gunSlot >= 0 && avail(gunSlot) && ai.ammo > 0) {
        const hit = hitProb(boxRect(pos, facing, SPECIALS.gun.box)), avg = 25 + 7.5 * ai.ammo;
        cands.push({ pos, facing, tech: 'mid', action: { kind: 'special', slot: gunSlot, mode: 'fire' },
          score: hit * (avg / 25) * mult * (1 + aggr) - danger * (1.15 - aggr) + base + (ai.ammo >= GUN_MAX ? 0.08 : -0.04) });
      }
      if (sgSlot >= 0 && avail(sgSlot)) {
        const r = boxRect(pos, facing, SPECIALS.shotgun.box);
        let ev = 0; for (const s of samples) if (overlap(r, bodyRect(s.pos))) ev += shotgunDamage(Math.abs(s.pos.x - pos.x)) / 25;
        ev /= samples.length;
        cands.push({ pos, facing, tech: 'mid', action: { kind: 'special', slot: sgSlot }, score: ev * mult * (1 + aggr) - danger * (1.15 - aggr) + base });
      }
      if (whirlSlot >= 0 && avail(whirlSlot) && facing === 1) {
        const hit = hitProb(boxRect(pos, facing, SPECIALS.whirl.box));
        cands.push({ pos, facing: toward(pos), tech: 'mid', action: { kind: 'special', slot: whirlSlot }, score: hit * 0.8 * mult * (1 + aggr) - danger * (1.15 - aggr) + base });
      }
    }
    // 철벽 방어: 위험한 자리에서 상대를 바라보고 막기
    const gSlot = ai.specials.indexOf('guard');
    if (gSlot >= 0 && avail(gSlot) && front > 0.25)
      cands.push({ pos, facing: toward(pos), tech: 'mid', action: { kind: 'special', slot: gSlot }, score: front * 0.7 - (danger - front) * 1.1 - 0.05 + base });
  }
  if (safest) {
    const hSlot = ai.specials.indexOf('heal');
    if (hSlot >= 0 && avail(hSlot) && (ai.healCharge > 0 || ai.hp <= 60))
      cands.push({ pos: safest.pos, facing: toward(safest.pos), tech: 'mid', action: { kind: 'special', slot: hSlot },
        score: (ai.healCharge > 0 ? 0.45 + ai.healCharge * 0.25 : 0.3) - safest.danger * 1.2 + rand(0, 0.1) });
    const bSlot = ai.specials.indexOf('buff');
    if (bSlot >= 0 && avail(bSlot) && !ai.buff)
      cands.push({ pos: safest.pos, facing: toward(safest.pos), tech: 'mid', action: { kind: 'special', slot: bSlot },
        score: 0.2 - safest.danger * 0.9 + rand(0, 0.1) });
    if (gunSlot >= 0 && avail(gunSlot) && ai.ammo < GUN_MAX)
      cands.push({ pos: safest.pos, facing: toward(safest.pos), tech: 'mid', action: { kind: 'special', slot: gunSlot, mode: 'load' },
        score: 0.16 - ai.ammo * 0.03 - safest.danger * 0.9 + rand(0, 0.1) });
  }
  cands.sort((a, b) => b.score - a.score);
  return cands[Math.floor(rand(0, Math.min(3, cands.length)))] || { pos: vcopy(ai.anchor), facing: ai.facing, tech: 'mid', action: { kind: 'basic' } };
}

function recordHistory() {
  const { p, ai } = B;
  const side = Math.sign(ai.anchor.x - p.anchor.x) || 1;
  B.hist.push({
    dx: (p.pos.x - p.anchor.x) * side, dLvl: levelOf(p.pos) - levelOf(p.anchor),
    toward: p.facing === (Math.sign(ai.anchor.x - p.pos.x) || 1), tech: p.tech
  });
}

function resolveClash() {
  const { p, ai } = B;
  B.resolved = true;
  if (!B.online) recordHistory();
  const keyOf = f => B.online ? `${B.online.code}|${B.turn}|${f.isAI ? (B.online.role === 'host' ? 'guest' : 'host') : B.online.role}` : null;
  const evalHit = (att, def) => {
    const rs = actionRects(att);
    if (!rs.length) return { attack: false };
    if (!rs.some(r => overlap(r, bodyRect(def.pos)))) return { attack: true, hit: false, rs };
    if (guarding(def, att)) return { attack: true, hit: false, blocked: true, rs };
    return { attack: true, hit: true, dmg: Math.round(actionDamage(att, keyOf(att), def) * (att.buff ? BUFF_MULT : 1)), rs };
  };
  const rp = evalHit(p, ai), ra = evalHit(ai, p);
  for (const [f, r] of [[p, rp], [ai, ra]]) {
    if (!r.attack) continue;
    for (const rect of r.rs) B.fx.push({ type: 'box', r: rect, t: 0, life: 0.7, color: f.color, hit: r.hit });
    const sp = actSpecial(f);
    if (sp && sp.id === 'shotgun') {
      for (let k = -2; k <= 2; k++) B.fx.push({ type: 'tracer', x0: f.pos.x + f.facing * 40, y0: f.pos.y - 62, x1: f.pos.x + f.facing * (40 + 110), y1: f.pos.y - 62 + k * 16, t: 0, life: 0.35, color: sp.color });
    }
    if (sp && sp.id === 'gun') {
      const mx = f.pos.x + f.facing * 40, my = f.pos.y - 62, tgt = f === p ? ai : p;
      const ex = r.hit ? tgt.pos.x : (f.facing > 0 ? r.rs[0].x1 : r.rs[0].x0);
      B.fx.push({ type: 'tracer', x0: mx, y0: my, x1: ex, y1: my, t: 0, life: 0.45, color: sp.color });
    }
  }
  const floatAt = (f, txt, color, dy = 0, size = 22) => B.floaters.push({ x: f.pos.x, y: f.pos.y - 178 - dy, text: txt, color, size, t: 0, life: 1.9 });
  const hitTarget = (attacker, target, dmg) => {
    target.hp = Math.max(0, target.hp - dmg);
    target.pose = 'hit'; target.poseT = 0; target.flash = 0.5; attacker.hits++;
    const sep = Math.abs(attacker.pos.x - target.pos.x) < 80 ? (target.isAI ? 32 : -32) : 0;
    B.floaters.push({ x: target.pos.x + sep, y: target.pos.y - 150, text: `-${dmg}`, color: '#d62f2f', size: dmg > 25 ? 50 : 42, t: 0, life: 1.9 });
    for (let i = 0; i < 22; i++) {
      const a = rand(0, TAU), sp = rand(120, 380);
      B.particles.push({ x: target.pos.x, y: target.pos.y - 55, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, t: 0, life: rand(0.35, 0.75), color: Math.random() < 0.5 ? attacker.color : '#f0a500', size: rand(3, 6) });
    }
  };
  const missAt = (attacker, r) => {
    const rect = r.rs[0];
    B.floaters.push({ x: clamp((rect.x0 + rect.x1) / 2, ARENA.x + 50, ARENA.x + ARENA.w - 50), y: clamp((rect.y0 + rect.y1) / 2, ARENA.y + 30, GROUND_Y - 20), text: 'MISS', color: '#6b7584', size: 32, t: 0, life: 1.9 });
  };
  const outcome = (att, def, r) => {
    if (r.hit) hitTarget(att, def, r.dmg);
    else if (r.blocked) {   // 철벽 방어 성공 → 공격한 쪽에 작은 반격
      floatAt(def, '막음!', SPECIALS.guard.color, -20, 30); Sfx.guard();
      att.hp = Math.max(0, att.hp - COUNTER_DMG); att.pose = 'hit'; att.poseT = 0; att.flash = 0.4; def.hits++;
      B.floaters.push({ x: att.pos.x, y: att.pos.y - 150, text: `반격 -${COUNTER_DMG}`, color: SPECIALS.guard.color, size: 32, t: 0, life: 1.9 });
      B.fx.push({ type: 'tracer', x0: def.pos.x + def.facing * 30, y0: def.pos.y - 60, x1: att.pos.x, y1: att.pos.y - 60, t: 0, life: 0.4, color: SPECIALS.guard.color });
    }
    else if (r.attack) missAt(att, r);
  };
  outcome(p, ai, rp); outcome(ai, p, ra);
  if (rp.hit || ra.hit) { B.shake = 0.3; Sfx.hit(); }
  if ((rp.attack && !rp.hit) || (ra.attack && !ra.hit)) Sfx.miss();
  // 특수 스킬 상태 변화 (재사용 대기 · 회복 모으기 · 탄)
  const statusLog = {};
  const updateSpecial = (f, damaged) => {
    const a = actOf(f), sp = actSpecial(f);
    for (let i = 0; i < 2; i++) if (f.cd[i] > 0) f.cd[i]--;
    if (sp && sp.id === 'heal') {
      if (damaged) { floatAt(f, '회복 실패', '#6b7584'); f.healCharge = 0; }
      else {
        f.healCharge++;
        if (f.healCharge >= HEAL_TURNS) {
          const before = f.hp; f.hp = Math.min(MAX_HP, f.hp + HEAL_AMOUNT); f.disp = Math.max(f.disp, f.hp);
          f.healCharge = 0; f.cd[a.slot] = SP_COOLDOWN; statusLog[f.isAI ? 'a' : 'p'] = '회복!';
          B.floaters.push({ x: f.pos.x, y: f.pos.y - 150, text: `+${f.hp - before}`, color: SPECIALS.heal.color, size: 44, t: 0, life: 1.9 });
          B.fx.push({ type: 'aura', x: f.pos.x, y: f.pos.y - 50, t: 0, life: 1.0, color: SPECIALS.heal.color });
          Sfx.heal();
        } else floatAt(f, `회복 ${f.healCharge}/${HEAL_TURNS}`, SPECIALS.heal.color);
      }
    } else if (f.healCharge > 0) { f.healCharge = 0; floatAt(f, '회복 중단', '#6b7584'); }
    if (sp && sp.id === 'gun') {
      if (a.mode === 'load') {
        if (damaged) { f.ammo = 0; floatAt(f, '탄 초기화', '#6b7584'); }
        else { f.ammo = Math.min(GUN_MAX, f.ammo + 1); floatAt(f, `장전 ${f.ammo}/${GUN_MAX}`, SPECIALS.gun.color); }
      } else { f.ammo = 0; f.cd[a.slot] = SP_COOLDOWN; }
    }
    if (sp && (sp.id === 'guard' || sp.id === 'whirl' || sp.id === 'shotgun')) f.cd[a.slot] = SP_COOLDOWN;
    // 버프: 이번 턴에 걸고, 다음 공격 한 번에 소모
    if (sp && sp.id === 'buff') { f.buff = true; f.cd[a.slot] = SP_COOLDOWN; floatAt(f, `버프! 다음 공격 ${BUFF_MULT}배`, sp.color);
      B.fx.push({ type: 'aura', x: f.pos.x, y: f.pos.y - 50, t: 0, life: 0.9, color: sp.color }); Sfx.heal(); }
    else if (f.buff && actionRects(f).length) f.buff = false;
  };
  updateSpecial(p, !!(ra.hit || rp.blocked)); updateSpecial(ai, !!(rp.hit || ra.blocked));   // 반격을 맞아도 '맞음'으로 처리

  let msg, col;
  if (rp.hit && ra.hit) { msg = '상호 명중!'; col = C.gold; }
  else if (rp.hit) { msg = '명중! 예측 성공'; col = C.p1; }
  else if (ra.hit) { msg = `피격! ${OPP()}에게 읽혔다`; col = C.ai; }
  else if (rp.blocked || ra.blocked) { msg = '방어 성공! 반격'; col = SPECIALS.guard.color; }
  else if (!rp.attack && !ra.attack) { msg = '서로 공격하지 않음'; col = C.sub; }
  else { msg = '양측 모두 빗나감!'; col = C.sub; }
  B.resultText = { msg, col, t: 0 };
  const txt = (r, f, key, other) => statusLog[key] || (r.hit ? '명중' : r.blocked ? '막힘' : other.blocked ? '반격' : r.attack ? 'MISS' : actionShort(f));
  B.log.unshift({ turn: B.turn, pHit: !!rp.hit, aHit: !!ra.hit, pTxt: txt(rp, p, 'p', ra), aTxt: txt(ra, ai, 'a', rp) });
  if (B.log.length > 7) B.log.pop();
  // 다음 작전 페이즈용 잔상
  B.ghost = { pos: vcopy(ai.pos), facing: ai.facing, rects: actionRects(ai).map(r => Object.assign({}, r)), label: actionName(ai) };
  B.trail.push(vcopy(ai.pos)); if (B.trail.length > 5) B.trail.shift();
}
function endClash() {
  const { p, ai } = B;
  if (p.hp <= 0 || ai.hp <= 0) {
    B.phase = 'over'; B.overT = 0;
    if (p.hp <= 0 && ai.hp <= 0) { B.result = 'draw'; p.pose = ai.pose = 'ko'; Sfx.draw(); }
    else if (ai.hp <= 0) { B.result = 'win'; ai.pose = 'ko'; p.pose = 'win'; Sfx.win(); }
    else { B.result = 'lose'; p.pose = 'ko'; ai.pose = 'win'; Sfx.lose(); }
    p.poseT = ai.poseT = 0;
    if (B.online) netFinishMatch();
    return;
  }
  beginPlan();
}

function updateBattle(dt) {
  const { p, ai } = B;
  for (const f of [p, ai]) {
    f.poseT += dt; f.flash = Math.max(0, f.flash - dt);
    f.disp = f.disp > f.hp ? Math.max(f.hp, f.disp - 45 * dt) : f.hp;
  }
  if (B.banner) { B.banner.t += dt; if (B.banner.t > 1.3) B.banner = null; }
  if (B.resultText) B.resultText.t += dt;

  if (B.phase === 'intro') {
    B.t += dt;
    if (B.t >= 1.6) beginPlan();
  } else if (B.phase === 'plan') {
    B.timer -= dt;
    const c = Math.ceil(B.timer);
    if (c !== B.lastTick) { B.lastTick = c; if (c <= 3 && c > 0) Sfx.tick(); }
    const dxRaw = (keys.KeyD || keys.ArrowRight || held('right') ? 1 : 0) - (keys.KeyA || keys.ArrowLeft || held('left') ? 1 : 0);
    const dx = paused ? 0 : dxRaw;
    physicsStep(p, dt, { dx, jump: p.jumpQ, drop: p.dropQ });
    p.jumpQ = false; p.dropQ = false;
    if (B.timer <= 0) { B.timer = 0; finishPlan(); }
  } else if (B.phase === 'wait') {
    B.waitT += dt;
    physicsStep(p, dt, { dx: 0, jump: false, drop: false });
    netTryStartClash();
  } else if (B.phase === 'clash') {
    B.t += dt; const t = B.t;
    // 플레이어: 공중이면 착지할 때까지 낙하
    physicsStep(p, dt, { dx: 0, jump: false, drop: false });
    // AI: 잔상 위치 → 계획 위치로 (점프 궤적) 이동 연출
    const k = clamp(t / CL_REVEAL, 0, 1), e = easeOut(k);
    const far = Math.abs(ai.planPos.y - ai.from.y) > 2 || Math.abs(ai.planPos.x - ai.from.x) > 60;
    const arc = Math.sin(Math.PI * k) * (far ? 70 : 0);
    ai.pos = { x: lerp(ai.from.x, ai.planPos.x, e), y: lerp(ai.from.y, ai.planPos.y, e) - arc };
    ai.air = arc > 3; ai.moving = k < 1; if (ai.moving) ai.walk += dt * 14;
    if (!B.fired && t >= CL_FIRE_MIN && p.grounded) {
      B.fired = true; B.fireT = t;
      let swing = false, shot = false;
      for (const f of [p, ai]) {
        const sp = actSpecial(f), a = actOf(f);
        f.poseT = 0;
        if (!sp || sp.id === 'whirl') { f.pose = 'slash'; swing = true; }
        else if (sp.id === 'gun') { f.pose = a.mode === 'fire' ? 'shoot' : 'load'; if (a.mode === 'fire') shot = true; else Sfx.load(); }
        else if (sp.id === 'shotgun') { f.pose = 'shoot'; shot = true; }
        else if (sp.id === 'guard') f.pose = 'guard';
        else f.pose = 'channel';
      }
      if (swing) Sfx.swing();
      if (shot) Sfx.shot();
    }
    if (B.fired && !B.resolved && t >= B.fireT + SWING_T * 0.8) resolveClash();
    if (B.resolved && t >= B.fireT + SWING_T + CL_AFTER) endClash();
  } else if (B.phase === 'over') {
    B.overT += dt;
  }
  B.shake = Math.max(0, B.shake - dt);
  for (const e of B.fx) e.t += dt;
  B.fx = B.fx.filter(e => e.t < e.life);
  for (const q of B.particles) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy = q.vy * 0.92 + 600 * dt; }
  B.particles = B.particles.filter(q => q.t < q.life);
  for (const fl of B.floaters) fl.t += dt;
  B.floaters = B.floaters.filter(fl => fl.t < fl.life);
}

// ----------------------------------------------------------------- 배틀 렌더링
function drawReach(spots, color, off) {
  ctx.save(); ctx.fillStyle = color;
  for (const s of spots) ctx.fillRect(s.x - 6.5, s.y + off, 13, 4);
  ctx.restore();
}
function renderBattle() {
  const { p, ai } = B;
  drawBg();
  ctx.save();
  if (B.shake > 0) ctx.translate(rand(-1, 1) * B.shake * 18, rand(-1, 1) * B.shake * 18);
  drawArenaFloor();
  ctx.save(); ctx.beginPath(); ctx.rect(ARENA.x, ARENA.y - 40, ARENA.w, ARENA.h + 40); ctx.clip();

  const plan = B.phase === 'plan';
  const clashT = B.phase === 'clash' ? B.t : 99;

  // --- 도달 가능 지점 (발판 위 띠) ---

        ctx.fillStyle = `rgba(214,69,69,${a})`; ctx.beginPath(); ctx.arc(q.x, q.y - 50, 6, 0, TAU); ctx.fill();
        text(`-${B.trail.length - 1 - i}`, q.x, q.y - 64, 10, `rgba(180,50,50,${a + 0.2})`, 'center', 700);
      });
    }
    if (B.ghost) {
      B.ghost.rects.forEach(r => drawRectArea(r, C.ai, { alpha: 0.8, fill: 0.08, dash: [8, 6], lw: 2 }));
      const r0 = B.ghost.rects[0];
      if (r0) text(`${OPP()} 직전 공격 · ${B.ghost.label}`, (r0.x0 + r0.x1) / 2, r0.y0 + 14, 11, '#b83a3a', 'center', 700);
      else text(`직전 행동 · ${B.ghost.label}`, B.ghost.pos.x, B.ghost.pos.y - 172, 11, '#b83a3a', 'center', 700);
    }

    ctx.globalAlpha = ghostAlpha;
    ctx.strokeStyle = 'rgba(214,69,69,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.ellipse(gp.x, gp.y, 24, 7, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    text(B.ghost ? `${OPP()} 잔상 (직전 턴)` : `${OPP()} 시작 위치`, gp.x, gp.y - 134, 12, '#b83a3a', 'center', 800);
    if (plan) text('?', gp.x, gp.y - 154 + Math.sin(gt * 3) * 2, 20, '#b83a3a', 'center', 900);
    ctx.restore();
  }

  // --- 내 공격 범위 미리보기 ---
  if (plan) {
    ctx.save(); ctx.strokeStyle = 'rgba(47,111,209,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.anchor.x - 8, p.anchor.y - 3); ctx.lineTo(p.anchor.x + 8, p.anchor.y - 3);

    }

    rects.forEach(r => drawRectArea(r, pcol, { fill: 0.14, lw: 2.5 }));
    if (rects.length) text(`내 공격 · ${actionName(p)}`, (rects[0].x0 + rects[0].x1) / 2, rects[0].y1 - 12, 12, pcol, 'center', 800);
    else {
      if (spc && spc.id === 'guard') drawGuardArc(p, 0.8);
      if (spc && (spc.id === 'heal' || spc.id === 'buff')) { ctx.save(); ctx.strokeStyle = pcol; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(gt * 4); ctx.lineWidth = 3; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.ellipse(p.pos.x, p.pos.y - 52, 42, 64, 0, 0, TAU); ctx.stroke(); ctx.restore(); }
      text(`내 행동 · ${actionName(p)}`, p.pos.x, p.pos.y - 172, 12, pcol, 'center', 800);

    const a = clamp((clashT - CL_REVEAL * 0.8) / 0.2, 0, 1) * (0.6 + 0.4 * Math.sin(clashT * 30));
    for (const f of [p, ai]) actionRects(f).forEach(r => drawRectArea(r, f.color, { alpha: a, fill: 0.16, lw: 2.5 }));
  }
  for (const e of B.fx) {
    const k = e.t / e.life;

      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = e.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, 10 + k * 40, 0, TAU); ctx.stroke(); ctx.restore();
    } else if (e.type === 'box') {

      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = e.color; ctx.lineWidth = 5 * (1 - k) + 1; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x0, e.y0); ctx.lineTo(e.x1, e.y1); ctx.stroke();
      ctx.fillStyle = '#f0a500'; ctx.beginPath(); ctx.arc(e.x0, e.y0, 12 * (1 - k), 0, TAU); ctx.fill(); ctx.restore();
    } else if (e.type === 'aura') {
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = e.color; ctx.lineWidth = 4;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(e.x, e.y - k * 30, 20 + (k * 60 + i * 18) % 70, 0, TAU); ctx.stroke(); }
      ctx.restore();
    }
  }

  // --- 캐릭터 ---
  const list = [p]; if (!plan) list.push(ai);
  for (const f of list) {
    const air = f.isAI ? f.air : !f.grounded;
    drawMarker(f.pos.x, f.pos.y, f.color, f.pose === 'ko' ? null : f.name, air ? 0.5 : 1, gt + (f.isAI ? 1 : 0));
    const fsp = (plan && f.isAI) ? null : actSpecial(f);
    if (f.buff && f.pose !== 'ko') { ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(gt * 6); ctx.fillStyle = SPECIALS.buff.color; ctx.beginPath(); ctx.ellipse(f.pos.x, f.pos.y - 4, 30, 8, 0, 0, TAU); ctx.fill(); ctx.restore(); }
    drawStick(f.pos.x, f.pos.y, {
      color: f.color, facing: f.facing, moving: f.moving, walk: f.walk, idle: gt, pose: f.pose, poseT: f.poseT,
      flash: f.flash, tech: f.tech, weapon: fsp && (fsp.id === 'gun' || fsp.id === 'shotgun') ? fsp.id : f.weapon, air
    });
    if (B.fired && f.pose === 'slash' && f.poseT < SWING_T + 0.25) {
      drawSlashArc(f.pos, f.facing, f.tech, f.poseT / SWING_T, f.color);
      if (fsp && fsp.id === 'whirl') drawSlashArc(f.pos, -f.facing, 'mid', f.poseT / SWING_T, f.color);
    }
    if (B.fired && f.pose === 'guard') drawGuardArc(f, 1);
    if (B.fired && f.pose === 'channel') { ctx.save(); ctx.globalAlpha = 0.6; ctx.strokeStyle = (fsp || SPECIALS.heal).color; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(f.pos.x, f.pos.y - 52, 40 + Math.sin(gt * 8) * 4, 62, 0, 0, TAU); ctx.stroke(); ctx.restore(); }
  }
  if (plan) {   // 이동력 바 (머리 위)
    const k = p.stamina / STAMINA, bx = p.pos.x - 30, by = p.pos.y - 156;
    ctx.fillStyle = '#e3e7ed'; rr(bx, by, 60, 6, 3); ctx.fill();
    ctx.fillStyle = k < 0.15 ? '#e07b20' : C.p1; rr(bx, by, Math.max(3, 60 * k), 6, 3); ctx.fill();
  }
  for (const q of B.particles) {
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  for (const fl of B.floaters) {
    const k = fl.t / fl.life;
    const pop = fl.t < 0.15 ? 0.6 + fl.t / 0.15 * 0.6 : fl.t < 0.25 ? 1.2 - (fl.t - 0.15) * 2 : 1;
    ctx.save(); ctx.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1;
    ctx.translate(fl.x, fl.y - easeOut(Math.min(1, fl.t / 0.8)) * 26); ctx.scale(pop, pop);
    outlinedText(fl.text, 0, 0, fl.size, fl.color, '#ffffff', 900, 7);
    ctx.restore();
  }
  ctx.restore(); // clip

  if (B.phase === 'intro') {
    const t = B.t, s = t < 0.8 ? 'READY' : 'FIGHT!', lt = t < 0.8 ? t : t - 0.8;
    const sc = 1 + Math.max(0, 0.4 - lt) * 1.5;
    ctx.save(); ctx.translate(ARENA.x + ARENA.w / 2, ARENA.y + ARENA.h / 2 - 60); ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, lt * 5);
    outlinedText(s, 0, 0, 72, t < 0.8 ? C.text : C.gold, '#ffffff', 900, 12);
    ctx.restore();
  }
  if (B.banner && !(B.resultText && B.phase === 'clash')) {
    const t = B.banner.t;
    const a = t < 0.2 ? t / 0.2 : t > 1.0 ? Math.max(0, (1.3 - t) / 0.3) : 1;
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + 50, bw = 380;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; rr(cx - bw / 2, cy - 30, bw, 60, 12); ctx.fill();
    ctx.strokeStyle = B.banner.color; ctx.lineWidth = 2.5; ctx.stroke();
    text(B.banner.text, cx, cy - 8, 26, B.banner.color, 'center', 900);
    text(B.banner.sub, cx, cy + 16, 12, C.sub, 'center', 600);
    ctx.restore();
  }
  if (B.resultText && B.phase === 'clash') {
    const t = B.resultText.t, a = Math.min(1, t * 6) * (t > 1.7 ? Math.max(0, (1.95 - t) / 0.25) : 1);
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + 50;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,0.96)'; rr(cx - 170, cy - 26, 340, 52, 12); ctx.fill();
    ctx.strokeStyle = B.resultText.col; ctx.lineWidth = 2.5; ctx.stroke();
    text(B.resultText.msg, cx, cy + 1, 24, B.resultText.col, 'center', 900);
    ctx.restore();
  }
  if (B.phase === 'wait') {
    const cx = ARENA.x + ARENA.w / 2, cy = ARENA.y + 50;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.96)'; rr(cx - 190, cy - 30, 380, 60, 12); ctx.fill();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2.5; ctx.stroke();
    const dots = '.'.repeat(1 + Math.floor(gt * 2) % 3);
    text(`상대가 작전 중${dots}`, cx, cy - 8, 22, C.gold, 'center', 900);
    text(`준비 완료 · ${Math.floor(B.waitT)}초 대기`, cx, cy + 16, 12, C.sub, 'center', 600);
    ctx.restore();
  }
  ctx.restore(); // shake

  renderHud();
  renderSidePanels();
  if (B.phase === 'over') renderOver();
  if (B.phase === 'wait' && B.waitT > 45 && !paused) {
    const cx = ARENA.x + ARENA.w / 2;
    text('상대의 응답이 없습니다', cx, ARENA.y + 110, 14, C.ai, 'center', 800);
    button(cx - 90, ARENA.y + 126, 180, 40, '대전 나가기', () => goHome(), { size: 15, style: 'danger' });
  }
}

function specialStatusText(f, i) {
  const id = f.specials[i]; if (!id || !SPECIALS[id]) return null;
  const sp = SPECIALS[id];
  let t = sp.name;
  if (id === 'heal') t += ` ${f.healCharge}/${HEAL_TURNS}`;
  if (id === 'gun') t += ` ${f.ammo}/${GUN_MAX}발`;
  if (id === 'buff' && f.buff) t += ' ON';
  if (f.cd[i] > 0) t += ` · 대기 ${f.cd[i]}`;
  return { t, col: f.cd[i] > 0 ? C.dim : sp.color };
}
function drawSpecialStatus(f, x, y, right) {
  ctx.font = font(11, 800);
  for (let k = 0; k < 2; k++) {
    const i = right ? 1 - k : k, st = specialStatusText(f, i);
    if (!st) continue;
    const w = ctx.measureText(st.t).width + 16, bx = right ? x - w : x;
    ctx.fillStyle = '#ffffff'; rr(bx, y - 9, w, 18, 9); ctx.fill();
    ctx.strokeStyle = st.col; ctx.lineWidth = 1.5; ctx.stroke();
    text(st.t, bx + w / 2, y + 1, 11, st.col, 'center', 800);
    x += right ? -(w + 6) : w + 6;
  }
}
function panel(x, y, w, h, title) {
  ctx.fillStyle = 'rgba(30,40,60,0.08)'; rr(x, y + 2, w, h, 12); ctx.fill();
  ctx.fillStyle = C.panel; rr(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.stroke();
  if (title) text(title, x + 14, y + 18, 13, C.sub, 'left', 800);
}

// 모바일 터치 패드 (오른쪽 패널 자리)
function holdButton(id, x, y, w, h, drawIcon, label, disabled) {
  if (!disabled) holdZones.push({ id, x, y, w, h });
  const on = held(id) && !disabled;
  ctx.save(); ctx.globalAlpha = disabled ? 0.45 : 1;
  ctx.fillStyle = 'rgba(30,40,60,0.12)'; rr(x, y + 3, w, h, 14); ctx.fill();
  ctx.fillStyle = on ? '#d6e4fb' : '#ffffff'; rr(x, y + (on ? 2 : 0), w, h, 14); ctx.fill();
  ctx.strokeStyle = on ? C.p1 : '#c3ccd8'; ctx.lineWidth = on ? 3 : 1.5; ctx.stroke();
  drawIcon(x + w / 2, y + h / 2 - 8 + (on ? 2 : 0), on);
  text(label, x + w / 2, y + h - 16 + (on ? 2 : 0), 13, on ? C.p1 : C.sub, 'center', 800);
  ctx.restore();
}
function tri(cx, cy, dir, col) {
  ctx.fillStyle = col; ctx.beginPath();
  if (dir === 'l') { ctx.moveTo(cx - 18, cy); ctx.lineTo(cx + 12, cy - 18); ctx.lineTo(cx + 12, cy + 18); }
  else if (dir === 'r') { ctx.moveTo(cx + 18, cy); ctx.lineTo(cx - 12, cy - 18); ctx.lineTo(cx - 12, cy + 18); }
  else if (dir === 'u') { ctx.moveTo(cx, cy - 16); ctx.lineTo(cx - 18, cy + 12); ctx.lineTo(cx + 18, cy + 12); }
  else { ctx.moveTo(cx, cy + 16); ctx.lineTo(cx - 18, cy - 12); ctx.lineTo(cx + 18, cy - 12); }
  ctx.closePath(); ctx.fill();
}
function renderTouchPad() {

  holdButton('drop', rx + 14, 382, rw - 28, 80, (x, y, on) => tri(x, y + 2, 'd', on ? C.p1 : C.text), '내려가기', !plan);
  text('누르고 있으면 이동합니다', rx + rw / 2, 480, 11, C.dim, 'center', 600);
  text('경기장을 탭하면 방향·기술 선택', rx + rw / 2, 498, 11, C.dim, 'center', 600);
  // 최근 기록 3개
  B.log.slice(0, 3).forEach((l, i) => {
    const y = 532 + i * 22;

function renderOver() {

function miniStage(x, y, w, h, plats = []) {
  ctx.fillStyle = C.paper; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (let gx = x + 30; gx < x + w; gx += 30) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
  ctx.stroke();
  drawPlatform(x, x + w, y + h - 40, true, y + h);
  plats.forEach(([a, b, py]) => drawPlatform(x + a, x + b, y + py, false));
  ctx.strokeStyle = '#3a4352'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  return y + h - 40;
}
const SC = 0.8;   // 튜토리얼 캐릭터 크기
function miniRect(pos, facing, tech, sc = SC) {
  const b = WEAPONS.sword.techs[tech].box;
  const x0 = facing > 0 ? pos.x + b[0] * sc : pos.x - b[1] * sc, x1 = facing > 0 ? pos.x + b[1] * sc : pos.x - b[0] * sc;
  return { x0, x1, y0: pos.y + b[2] * sc, y1: pos.y + b[3] * sc };
}

// ---- 로그인 없는 P2P (WebRTC, PeerJS 공개 중계 서버로 연결만 주선) ----
const PEER_PREFIX = 'mindclash-v1-';
const PEER_SRC = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
function loadScript(src) {

}
async function p2pInit() {

    for (const src of PEER_SRC) { try { await loadScript(src); if (typeof window.Peer === 'function') break; } catch (e) {} }

  if (typeof window.Peer !== 'function') { NET.err = 'nop2p'; return; }
  NET.uid = 'tab-' + NET.tab; NET.ready = true; NET.roomsLoaded = true;

}
function p2pErrMsg(e) {
  const t = e && e.type;

  if (t === 'browser-incompatible') return '이 브라우저는 온라인 대전을 지원하지 않습니다.';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return '연결 서버에 접속하지 못했습니다. 인터넷 연결을 확인하세요.';

}
function p2pDestroy() {

function p2pSend(obj) { try { if (NET.conn && NET.conn.open) NET.conn.send(obj); } catch (e) {} }

  conn.on('data', d => netOnOppData(d));

function p2pCreateRoom(tries = 0) {
  if (!NET.ready || NET.busy || NET.myRoom) return;
  NET.busy = true; NET.opening = true;
  const code = makeCode();
  const peer = new window.Peer(PEER_PREFIX + code.toLowerCase(), { debug: 0 });
  NET.peer = peer;
  peer.on('open', () => { if (NET.peer !== peer) return; NET.busy = false; NET.opening = false; NET.myRoom = code; });

    if (NET.conn || NET.peer !== peer || !NET.myRoom) { try { conn.close(); } catch (e) {} return; }
    NET.conn = conn;
    conn.on('open', () => {
      p2pWire(conn);

    if (e && e.type === 'unavailable-id' && tries < 3) { p2pDestroy(); NET.busy = false; p2pCreateRoom(tries + 1); return; }

function p2pJoinRoom(code) {
  if (!NET.ready || NET.busy) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4) { showToast('방 코드는 4글자입니다'); return; }
  NET.busy = true; NET.joining = code;
  const peer = new window.Peer({ debug: 0 });
  NET.peer = peer;
  const fail = msg => { if (NET.peer !== peer) return; clearTimeout(timer); NET.busy = false; NET.joining = null; p2pDestroy(); showToast(msg, 3.5); Sfx.err(); };

      ? ['인터넷에 연결되어 있는지 확인하세요.', '공개 주소: ' + PUBLIC_URL]

    lines.forEach((l, i) => text(l, px + pw / 2, 344 + i * 26, 14, C.sub, 'center', 600));
    button(px + pw / 2 - 90, 420, 180, 46, '다시 시도', () => { NET.err = null; NET.ready = false; netInit(); }, { size: 16 });
  } else if (!NET.ready) {
    if (pendingJoin) text('방 ' + pendingJoin + '에 참가하는 중', px + pw / 2, 320, 18, C.text, 'center', 800);
  } else if (NET.joining || NET.opening) {
    text(NET.joining ? '방 ' + NET.joining + '에 연결하는 중' : '방을 여는 중', px + pw / 2, 320, 20, C.text, 'center', 800);
    text('잠시만 기다려 주세요' + '.'.repeat(1 + Math.floor(gt * 2) % 3), px + pw / 2, 356, 15, C.sub, 'center', 600);
    button(px + pw / 2 - 90, 420, 180, 46, '취소', () => { NET.joining = null; p2pCancelRoom(); }, { size: 16 });

  } else if (NET.myRoom) {

    text('상대를 기다리는 중' + '.'.repeat(1 + Math.floor(gt * 2) % 3), px + 40, 250, 16, C.text, 'left', 800);
    const qs = 250, qx = px + pw - qs - 30, qy = 146;
    drawQR(roomLink(code), qx, qy, qs);
    text('휴대폰 카메라로 찍으면', px + 40, 300, 15, C.sub, 'left', 700);
    text('바로 이 방에 참가합니다', px + 40, 322, 15, C.sub, 'left', 700);
    text(roomLink(code), cx, 430, 11, C.dim, 'center', 600);
    text(NET.mode === 'p2p' ? '또는 상대가 게임에서 [코드로 참가]를 눌러 ' + code + ' 를 입력해도 됩니다' : '또는 같은 링크를 연 사람이 방 목록에서 참가할 수도 있습니다', cx, 452, 12, C.dim, 'center', 600);
    button(px + 40, 480, 230, 50, '참가 링크 복사', () => copyRoomLink(code), { size: 16 });
    button(px + pw - 270, 480, 230, 50, '방 닫기', () => netCancelRoom(), { size: 16, style: 'danger' });
    text(NET.mode === 'p2p' ? '로그인 없이 참가할 수 있습니다 · 이 화면을 닫으면 방이 사라집니다' : '참가하는 사람도 claude.ai에 로그인하고 이 게임에 참여 권한이 있어야 합니다', cx, 572, 12, C.sub, 'center', 600);
  } else {
    text('새 대전 시작', px + 30, 160, 18, C.text, 'left', 800);
    text(NET.mode === 'p2p' ? '방을 만들면 QR 코드가 나옵니다. 상대가 찍으면 로그인 없이 바로 참가합니다' : '방을 만들면 다른 사람이 목록에서 보고 참가할 수 있습니다', px + 30, 186, 13, C.sub, 'left', 600);
    button(px + 30, 210, pw - 60, 64, '방 만들기', () => netCreateRoom(), { style: 'primary', size: 22, disabled: NET.busy });
    text('혼자 시험해 보려면 이 링크를 새 탭에서 하나 더 열고 참가하세요', px + pw / 2, 300, 12, C.dim, 'center', 600);
    text('같은 화면에서 2인 대전은 지원하지 않습니다', px + pw / 2, 320, 12, C.dim, 'center', 600);
    if (NET.canWrite === false) text('보기 전용 권한이라 방을 만들거나 참가할 수 없을 수 있습니다', px + pw / 2, 360, 13, C.ai, 'center', 700);
    if (NET.mode === 'db') {
      text('로그인 없이 하고 싶다면', px + 30, 420, 15, C.text, 'left', 800);
      text('아래 공개 주소에서 게임을 열면 QR만으로 대전할 수 있습니다', px + 30, 444, 13, C.sub, 'left', 600);

  }
  // 방 목록 (P2P 모드는 목록 대신 코드로 참가)
  const lx = 640, lw = 600;
  if (NET.mode === 'p2p') {
    panel(lx, 120, lw, 520, '방에 참가하기');
    const cx = lx + lw / 2;
    text('QR 코드를 휴대폰 카메라로 찍으면', cx, 230, 18, C.text, 'center', 800);
    text('자동으로 방에 참가합니다', cx, 258, 18, C.text, 'center', 800);
    text('카메라를 쓸 수 없다면 방 코드를 직접 입력하세요', cx, 300, 13, C.sub, 'center', 600);
    button(cx - 150, 330, 300, 60, '코드로 참가', () => p2pPromptJoin(), { style: 'primary', size: 20, disabled: !NET.ready || NET.busy || !!NET.myRoom });
    text('로그인 없이 · 두 기기를 직접 연결합니다', cx, 430, 13, C.dim, 'center', 600);
    text('회사·학교 네트워크에서는 연결이 막힐 수 있습니다', cx, 452, 12, C.dim, 'center', 600);

  if (NET.ready) {
    const now = Date.now();
    const rooms = NET.rooms.filter(r => r.id !== NET.myRoom && typeof r.created === 'number' && now - r.created < ROOM_TTL && !r.guest)
      .sort((a, b) => b.created - a.created).slice(0, 7);
    if (!rooms.length) {
      text(NET.roomsLoaded ? '열린 방이 없습니다' : (NET.slow ? '방 목록을 아직 불러오지 못했습니다' : '방 목록을 불러오는 중…'), lx + lw / 2, 360, 16, C.dim, 'center', 700);
      if (NET.roomsLoaded) text('[방 만들기]로 새 방을 열어 보세요', lx + lw / 2, 388, 13, C.dim, 'center', 600);
    }
    rooms.forEach((r, i) => {
      const y = 158 + i * 66;
      ctx.fillStyle = C.panel2; rr(lx + 16, y, lw - 32, 56, 10); ctx.fill();
      text('방 ' + String(r.id).slice(0, 8), lx + 34, y + 20, 20, C.text, 'left', 900);
      const mins = Math.max(0, Math.floor((now - r.created) / 60000));
      const mine = r.host === NET.uid;
      text((mins < 1 ? '방금 열림' : mins + '분 전 열림') + (mine ? ' · 내가 연 방' : ''), lx + 34, y + 42, 12, C.sub, 'left', 600);
      button(lx + lw - 150, y + 8, 118, 40, '참가', () => netJoinRoom(r.id), { style: 'primary', size: 16, disabled: NET.busy || !!NET.myRoom });
    });
  }
}

// ----------------------------------------------------------------- QR 코드 생성기 (외부 라이브러리 없음)
/* 바이트 모드 · 오류 정정 레벨 M · 버전 1~10 (Nayuki QR Code generator 알고리즘을 간추려 이식) */
const QR = (() => {
  const ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLOCKS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  function rsDivisor(deg) {
    const r = new Array(deg - 1).fill(0); r.push(1); let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
      root = mul(root, 0x02);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  }
  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC_M[v] * BLOCKS_M[v];
  function alignPos(v, size) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const r = [6];
    for (let pos = size - 7; r.length < n; pos -= step) r.splice(1, 0, pos);
    return r;
  }
  function encode(str) {
    const bytes = Array.from(new TextEncoder().encode(str));
    let v = 1;
    for (; v <= 10; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCodewords(v) * 8) break;
    if (v > 10) return null;
    // 데이터 비트열
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(v) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let k = 0; k < 8; k++) b = (b << 1) | bits[i + k]; data.push(b); }
    // 오류 정정 + 인터리브
    const nb = BLOCKS_M[v], eccLen = ECC_M[v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = rsDivisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) cw.push(b[i]); });
    // 모듈 배치
    const size = v * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
      }
    const ap = alignPos(v, size), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const dat = (0 << 3) | mask; let rem = dat;   // 레벨 M = 0
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((dat << 10) | rem) ^ 0x5412, bit = i => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
      setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7) {
      let rem = v; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (v << 12) | rem;
      for (let i = 0; i < 18; i++) { const d = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3); setF(a, c, d); setF(c, a, d); }
    }
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && bi < cw.length * 8) { mod[y][x] = ((cw[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
      }
    }
    // 마스크 선택 (간단한 벌점: 연속, 2x2, 밝기 균형)
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0
    ];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let y = 0; y < size; y++) {
        let rx = 1, ry = 1;
        for (let x = 0; x < size; x++) {
          if (mod[y][x]) dark++;
          if (x > 0) { if (mod[y][x] === mod[y][x - 1]) { rx++; if (rx === 5) p += 3; else if (rx > 5) p++; } else rx = 1;
                       if (mod[x][y] === mod[x - 1][y]) { ry++; if (ry === 5) p += 3; else if (ry > 5) p++; } else ry = 1; }
          if (x > 0 && y > 0) { const c = mod[y][x]; if (c === mod[y][x - 1] && c === mod[y - 1][x] && c === mod[y - 1][x - 1]) p += 3; }
        }
      }
      const total = size * size;
      p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const pv = penalty(); if (pv < bestP) { bestP = pv; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return { size, dark: (x, y) => mod[y][x] };
  }
  return { encode };
})();
const QR_CACHE = {};
function drawQR(str, x, y, size) {
  if (!(str in QR_CACHE)) QR_CACHE[str] = QR.encode(str);
  const q = QR_CACHE[str];
  ctx.save();
  ctx.fillStyle = '#ffffff'; rr(x, y, size, size, 10); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.stroke();
  if (q) {
    const cell = Math.floor(size / (q.size + 8)), off = (size - cell * q.size) / 2;
    ctx.fillStyle = '#111827';
    for (let r = 0; r < q.size; r++) for (let c = 0; c < q.size; c++)
      if (q.dark(c, r)) ctx.fillRect(Math.round(x + off + c * cell), Math.round(y + off + r * cell), cell, cell);
  }
  ctx.restore();
}

// ----------------------------------------------------------------- 메인 루프 (고정 60Hz + Delta Time)
function update(dt) {
  gt += dt;
  if (toast) { toast.t += dt; if (toast.t > toast.life) toast = null; }
  if (paused && !(scene === 'battle' && B && B.online)) return;
  if (scene === 'battle' && B) updateBattle(dt);
  else if (scene === 'tutorial') tutT += dt;
}
function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  buttons = []; hoverAny = false; holdZones = [];
  if (scene === 'home') renderHome();
  else if (scene === 'battle') renderBattle();
  else if (scene === 'tutorial') renderTutorial();
  else if (scene === 'online') renderOnline();
  else if (scene === 'loadout') renderLoadout();
  if (paused) { buttons = []; hoverAny = false; holdZones = []; releaseAllHolds(); renderPause(); }
  if (touchMode && innerHeight > innerWidth && !portraitDismissed) renderRotateHint();
  if (toast) {
    const k = toast.t, a = Math.min(1, k * 6) * Math.min(1, (toast.life - k) * 4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = font(18, 700);
    const tw = ctx.measureText(toast.msg).width + 56;
    const ty = scene === 'home' ? 452 : 160;
    ctx.fillStyle = '#ffffff'; rr(W / 2 - tw / 2, ty - 25, tw, 50, 25); ctx.fill();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
    text(toast.msg, W / 2, ty, 18, C.gold, 'center', 800);
    ctx.restore();
  }
  const aiming = scene === 'battle' && B && B.phase === 'plan' && !paused && inArena(mouse);
  cv.style.cursor = hoverAny ? 'pointer' : aiming ? 'crosshair' : 'default';
}
const STEP = 1 / 60;
let lastT = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;           // 탭 전환 등 큰 지연 보호
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 20) { update(STEP); acc -= STEP; n++; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('hashchange', handleRoomHash);
setTimeout(handleRoomHash, 0);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && ((scene === 'battle' && B && B.phase !== 'over') || scene === 'tutorial')) paused = true;
});
window.__mc = { get B() { return B; }, get scene() { return scene; } };
